<!doctype html>
<html><head><meta charset="utf-8">
<!-- Purple Cow marketing (Seth Godin's idea) explained with the cow metaphor, house teaching style. Pain, Poke, Fix, Payoff, Recap, CTA. -->
<style>
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
@font-face{font-family:Mont;src:url(fonts/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/SpaceMono-Bold.ttf)}
@font-face{font-family:ISerif;src:url(fonts/InstrumentSerif-Italic.ttf);font-style:normal;font-weight:400}
:root{
  --ink:#030403; --ink2:#0A0D0B; --line:rgba(255,255,255,.08);
  --text:#F5F8F6; --muted:#8A938C; --lime:#22E06F; --violet:#0E7A3C; --deep:#06331A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
body{font-family:Inter,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-200px}
.blob{position:absolute;border-radius:50%;filter:blur(140px);opacity:.42}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 45%,#000 30%,transparent 80%);opacity:.55}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.65) 100%);pointer-events:none}
.scene{position:absolute;inset:0;will-change:transform,filter,opacity}
.abs{position:absolute}
.mono{font-family:Mono,monospace;letter-spacing:.04em}
#prog{position:absolute;top:118px;left:90px;right:90px;display:flex;gap:12px}
#prog .seg{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
#prog .seg i{display:block;height:100%;width:0;background:var(--lime);border-radius:8px;box-shadow:0 0 18px var(--lime)}
.card{position:absolute;left:90px;width:900px;border-radius:44px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14);box-shadow:0 40px 120px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(30px);overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:12px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:30px}
.title{font-family:Mont;font-weight:900;font-size:128px;line-height:.92;letter-spacing:-.035em}
.sub{font-size:44px;font-weight:500;color:#C8D0CA;line-height:1.25}
.sub b{color:var(--lime);font-weight:800}
.bar{height:22px;border-radius:12px;background:rgba(255,255,255,.14)}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-family:Mont;font-weight:900;font-size:66px;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase}
#cap span{display:inline-block;margin:0 10px;text-shadow:0 6px 30px rgba(0,0,0,.7)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:overlay}
#wipe{position:absolute;left:0;right:0;height:2400px;top:-2400px;background:var(--lime)}
.ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16)}
.tile{display:inline-flex;align-items:center;justify-content:center;flex:none;background:#fff;color:#030403;font-family:Mont;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style></head>
<body><div id="stage">
  <div class="bg" id="bg">
    <div class="blob" id="b1" style="width:900px;height:900px;background:var(--violet)"></div>
    <div class="blob" id="b2" style="width:800px;height:800px;background:var(--deep)"></div>
    <div class="blob" id="b3" style="width:600px;height:600px;background:var(--lime);opacity:.18"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="scenes"></div>
  <div id="prog"></div>
  <div id="cap"></div>
  <div id="wipe"></div>
  <div id="flash"></div>
  <div class="vig"></div>
</div>
<script>
const D = window.__DATA__;
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eo5=t=>1-Math.pow(1-clamp(t),5);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const P=(t,a,d)=>clamp((t-a)/d);
function st(el,o){for(const k in o) el.style[k]=o[k];}
function pop(el,t,a,d=.45,from=.6){const p=P(t,a,d);st(el,{opacity:clamp(p*3),transform:`scale(${lerp(from,1,back(p))})`});}
function rise(el,t,a,d=.5,dy=60){const p=eo(P(t,a,d));st(el,{opacity:p,transform:`translateY(${(1-p)*dy}px)`,filter:`blur(${(1-p)*10}px)`});}
function typed(el,txt,t,a,cps=26){const n=Math.floor(clamp((t-a)*cps,0,txt.length));el.textContent=txt.slice(0,n);return n<txt.length;}
function mk(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
const scenesEl=$('#scenes');

/* ---------- content: teaching shots (house delivery). Each visual stays up and changes state on the spoken words. ---------- */
const S=D.segs, segBy=Object.fromEntries(S.map(s=>[s.key,s]));
const W=(seg,re,n=0)=>{const ws=segBy[seg].words.filter(x=>re.test(x.w));return ws[n]?ws[n].s:null;};
const ST=k=>segBy[k].start;
const END=D.end;
let _gid=0;
const LT=(svg,size,r)=>{const id='g'+(++_gid);return `<span class="tile" style="width:${size}px;height:${size}px;border-radius:${r}px;padding:${Math.round(size*.17)}px;background:#fff">${svg.replace(/igg/g,id)}</span>`;};
const LOGO_G=`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#0081FB" d="M6.915 4.03c-1.968 0-3.683 1.28-4.871 3.113C.704 9.208 0 11.883 0 14.449c0 .706.07 1.369.21 1.973a6.624 6.624 0 0 0 .265.86 5.297 5.297 0 0 0 .371.761c.696 1.159 1.818 1.927 3.593 1.927 1.497 0 2.633-.671 3.965-2.444.76-1.012 1.144-1.626 2.663-4.32l.756-1.339.186-.325c.061.1.121.196.183.3l2.152 3.595c.724 1.21 1.665 2.556 2.47 3.314 1.046.987 1.992 1.22 3.06 1.22 1.075 0 1.876-.355 2.455-.843a3.743 3.743 0 0 0 .81-.973c.542-.939.861-2.127.861-3.745 0-2.72-.681-5.357-2.084-7.45-1.282-1.912-2.957-2.93-4.716-2.93-1.047 0-2.088.467-3.053 1.308-.652.57-1.257 1.29-1.82 2.05-.69-.875-1.335-1.547-1.958-2.056-1.182-.966-2.315-1.303-3.454-1.303zm10.16 2.053c1.147 0 2.188.758 2.992 1.999 1.132 1.748 1.647 4.195 1.647 6.4 0 1.548-.368 2.9-1.839 2.9-.58 0-1.027-.23-1.664-1.004-.496-.601-1.343-1.878-2.832-4.358l-.617-1.028a44.908 44.908 0 0 0-1.255-1.98c.07-.109.141-.224.211-.327 1.12-1.667 2.118-2.602 3.358-2.602zm-10.201.553c1.265 0 2.058.791 2.675 1.446.307.327.737.871 1.234 1.579l-1.02 1.566c-.757 1.163-1.882 3.017-2.837 4.338-1.191 1.649-1.81 1.817-2.486 1.817-.524 0-1.038-.237-1.383-.794-.263-.426-.464-1.13-.464-2.046 0-2.221.63-4.535 1.66-6.088.454-.687.964-1.226 1.533-1.533a2.264 2.264 0 0 1 1.088-.285z"/></svg>`;
const DOC=`<svg width="100%" height="100%" viewBox="0 0 24 24"><path d="M6 2h8l5 5v15H6z" fill="none" stroke="#030403" stroke-width="2.2" stroke-linejoin="round"/><path d="M14 2v5h5M9 12h7M9 16h7" stroke="#030403" stroke-width="2.2"/></svg>`;
const TICK=(s=34,c='#030403')=>`<svg width="${s}" height="${s}" viewBox="0 0 26 26"><path d="M4 14l6 6L22 6" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CARD='background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.16);border-radius:40px';

/* ---------- the cow (original illustration, faces right) ---------- */
const COWC={brown:{b:'#9A6A47',s:'#5C3A25',sn:'#E2B39A',l:'#7A5136',h:'#3B2A1E'},purple:{b:'#9D5CF5',s:'#6A35D8',sn:'#F2C2F5',l:'#7E45E6',h:'#3E1E7A'}};
function COW(kind,w){const c=COWC[kind];return `<svg width="${w}" viewBox="0 0 240 170" style="overflow:visible;display:block">
 <path d="M38 70 C18 78 20 112 14 122" stroke="${c.l}" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="13" cy="126" rx="7" ry="10" fill="${c.s}"/>
 ${[[58,0],[82,1],[136,0],[160,1]].map(([x,b])=>`<rect x="${x}" y="98" width="17" height="56" rx="8" fill="${b?c.l:c.b}"/><rect x="${x-1}" y="146" width="19" height="12" rx="4" fill="${c.h}"/>`).join('')}
 <path d="M40 66 C40 36 70 30 110 32 C150 30 182 36 186 62 C190 92 176 112 146 114 L80 114 C52 114 40 96 40 66Z" fill="${c.b}"/>
 <path d="M70 40 C86 34 100 46 94 60 C88 74 66 70 62 58 C59 50 62 44 70 40Z" fill="${c.s}"/>
 <path d="M128 70 C142 62 160 70 156 86 C152 100 130 102 124 90 C120 82 120 75 128 70Z" fill="${c.s}"/>
 <path d="M150 36 C160 34 172 40 170 50 C166 58 152 56 148 48Z" fill="${c.s}"/>
 <path d="M176 44 C178 30 196 22 210 30 C224 38 226 60 218 72 C210 84 190 84 182 74 C176 66 174 56 176 44Z" fill="${c.b}"/>
 <path d="M186 28 C182 16 186 10 192 8" stroke="#F3E9D8" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M208 26 C212 14 210 8 204 6" stroke="#F3E9D8" stroke-width="5" fill="none" stroke-linecap="round"/>
 <ellipse cx="176" cy="38" rx="11" ry="6" fill="${c.l}" transform="rotate(-25 176 38)"/>
 <ellipse cx="212" cy="76" rx="20" ry="14" fill="${c.sn}"/><ellipse cx="205" cy="76" rx="3" ry="4" fill="${c.h}"/><ellipse cx="219" cy="76" rx="3" ry="4" fill="${c.h}"/>
 <circle cx="200" cy="50" r="5" fill="#111"/><circle cx="201.5" cy="48.5" r="1.6" fill="#fff"/></svg>`;}
const PURP='#B07CFF';

/* ---------- headline: the spoken words, each blurs in when it is said ---------- */
const g=(txt,at,col)=>`<span class="h-w" data-at="${at}" style="display:inline-block;${col==='p'?`color:${PURP};text-shadow:0 0 30px rgba(157,92,245,.6)`:col?'color:var(--lime)':''}">${txt}</span>`;
const L=t=>`<b style="color:var(--lime)">${t}</b>`;
const HL=[
  {a:0, lead:'your ad looks like', size:116, big:g('EVERY',W('p1',/^every/))+' '+g('OTHER AD.',W('p1',/^other/),1), sub:g('in the feed.',W('p1',/^in/))},
  {a:ST('p2')-.12, lead:"that's why", size:140, big:g('NOBODY',W('p2',/^nobody/))+'<br>'+g('STOPS.',W('p2',/^stops/),1)},
  {a:ST('k1')-.12, lead:'picture driving past a', size:120, big:g('FIELD',W('k1',/^field/))+' '+g('OF COWS.',W('k1',/^cows/),1)},
  {a:W('k1',/^After/)-.12, lead:'after a few minutes of brown cows', size:120, big:g('YOU STOP',W('k1',/^stop/))+'<br>'+g('LOOKING.',W('k1',/^looking/),1)},
  {a:ST('k2')-.12, lead:"that's your customer, scrolling past", size:84, big:g('QUALITY.',W('k2',/^quality/))+'<br>'+g('FAST SHIPPING.',W('k2',/^fast/))+'<br>'+g('BEST PRICE.',W('k2',/^best/),1)},
  {a:W('k2',/^And/)-.12, lead:'and you pay for', size:124, big:g('EVERY',W('k2',/^every/))+' '+g('SCROLL.',W('k2',/^scroll/),1)},
  {a:ST('f0a')-.12, lead:'but if you saw a', size:130, big:g('PURPLE COW',W('f0a',/^purple/),'p'), sub:g("you'd stop.",W('f0a',/^you'd/))+' '+g("you'd "+L('tell a friend.'),W('f0a',/^You'd/))},
  {a:ST('f0b')-.12, lead:"that's seth godin's", size:130, big:g('PURPLE COW.',W('f0b',/^Purple/),'p'), sub:g("here's how to "+L('find yours.'),W('f0b',/^Here's/))},
  {a:ST('f1a')-.12, lead:'step one · write down what', size:96, big:g('EVERY',W('f1a',/^every/))+' '+g('COMPETITOR',W('f1a',/^competitor/))+'<br>'+g('SAYS.',W('f1a',/^says/),1)},
  {a:ST('f1b')-.12, lead:'those are your brown cows', size:130, big:g('CROSS THEM',W('f1b',/^Cross/))+'<br>'+g('OUT.',W('f1b',/^out/),1)},
  {a:ST('f2a')-.12, lead:'step two · ask', size:84, big:g('WHAT WOULD',W('f2a',/^what/))+' '+g('A CUSTOMER',W('f2a',/^customer/))+'<br>'+g('TELL A FRIEND?',W('f2a',/^tell/),1)},
  {a:ST('f2b')-.12, lead:'pick one thing, push it to the', size:140, big:g('EXTREME.',W('f2b',/^extreme/),1), sub:g('not fast replies.',W('f2b',/^Not/))+' '+g(L('replies in 5 min, guaranteed.'),W('f2b',/^Replies/))},
  {a:ST('f3a')-.12, lead:'step three · put it in the', size:116, big:g('FIRST LINE',W('f3a',/^first/),1)+'<br>'+g('OF YOUR AD.',W('f3a',/^line/))},
  {a:ST('f3b')-.12, lead:'show it to the people who', size:130, big:g('CARE MOST.',W('f3b',/^care/),1), sub:g("they'll "+L('spread it for you.'),W('f3b',/^They'll/))},
  {a:ST('y1')-.12, lead:'now your ad is the', size:110, big:g('PURPLE COW',W('y1',/^purple/),'p')+'<br>'+g('IN THE FEED.',W('y1',/^feed/)), sub:g('people stop, remember it, and '+L('tell a friend.'),W('y1',/^People/))},
  {a:ST('r1')-.12, lead:'recap · save this', size:96, big:g('CROSS OUT.',W('r1',/^Cross/))+' '+g('FIND.',W('r1',/^Find/))+'<br>'+g('LEAD WITH IT.',W('r1',/^Lead/),1)},
  {a:ST('c1')-.12, cta:true},
];
const hlEls=HL.map(h=>{const e=mk(`<div class="scene">${h.cta||h.shock?'':`<div class="abs" style="top:210px;left:30px;right:30px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
  ${h.lead?`<div class="h-l mono" style="font-size:38px;color:#AEB7B0;text-transform:lowercase">${h.lead}</div>`:''}
  <div class="h-b" style="font:900 ${h.size||118}px/.95 Mont;letter-spacing:-.035em;text-transform:uppercase">${h.big}</div>
  ${h.sub?`<div class="h-s" style="font:700 44px Inter;color:#C8D0CA">${h.sub}</div>`:''}</div>`}</div>`);scenesEl.appendChild(e);return e;});

const CUR=`<svg width="70" height="70" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#fff" stroke="#030403" stroke-width="1.5"/></svg>`;
const PERSON=(c,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="${c}"/><circle cx="20" cy="15" r="7" fill="#030403" opacity=".55"/><path d="M8 34 C10 24 30 24 32 34" fill="#030403" opacity=".55"/></svg>`;

/* ---------- phone feed (pain + payoff) ---------- */
const CLAIMS=['Quality you can trust','Fast, free shipping','Best prices, guaranteed','Top quality products','Fast delivery','Best value'];
const feedCard=(i,mine)=>`<div class="fcard" data-i="${i}" style="position:absolute;left:18px;right:18px;height:340px;border-radius:24px;background:${mine?'#120C1E':'#141815'};border:${mine?'3px solid '+PURP:'1.5px solid rgba(255,255,255,.12)'};padding:16px;overflow:hidden">
  <div style="display:flex;align-items:center;gap:10px"><i style="display:block;width:34px;height:34px;border-radius:50%;background:${mine?PURP:'#3A403C'}"></i><div><div style="font:800 20px Inter">${mine?'Your brand':'Brand '+String.fromCharCode(65+i%6)}</div><div style="font:600 15px Inter;color:#8E9890">Sponsored</div></div></div>
  <div style="margin-top:12px;height:170px;border-radius:16px;background:${mine?'linear-gradient(135deg,#2A1650,#120C1E)':'linear-gradient(135deg,#2A302C,#1B201D)'};display:flex;align-items:center;justify-content:center">${mine?`<div class="mycow" style="filter:drop-shadow(0 0 24px rgba(157,92,245,.8))">${COW('purple',190)}</div>`:`<i style="display:block;width:90px;height:90px;border-radius:18px;background:#3A403C"></i>`}</div>
  <div style="margin-top:12px;font:800 24px Inter;color:${mine?'#fff':'#C8D0CA'}">${mine?'⚡ Replies in 5 minutes. Guaranteed.':CLAIMS[i%6]}</div>
  ${mine?`<div class="mst" style="margin-top:6px;display:flex;gap:18px;font:800 20px Inter;color:#C8D0CA"><span>🔖 <b class="sv">0</b> saves</span><span>↗ <b class="sh">0</b> shares</span></div>`:''}</div>`;
const PHONE=(id,mine)=>`<div class="abs ${id}" style="left:250px;top:650px;width:580px;height:780px;border-radius:64px;background:#060806;border:10px solid #2A302C;box-shadow:0 40px 100px rgba(0,0,0,.6);overflow:hidden">
  <i style="position:absolute;left:50%;top:14px;width:120px;height:26px;margin-left:-60px;border-radius:13px;background:#000;z-index:3"></i>
  <div class="fd" style="position:absolute;left:0;right:0;top:0;bottom:0">${[0,1,2,3].map(i=>feedCard(i,false)).join('')}${mine?feedCard(9,true):''}</div></div>`;
function scrollFeed(el,y,mineY){$$('.fcard',el).forEach(c=>{const i=+c.dataset.i; if(i===9){c.style.top=mineY+'px';return;} const yy=((i*360-y)%1440+1440)%1440-200; c.style.top=yy+'px';});}
const vFeed=mk(`<div class="scene">${PHONE('ph',false)}<div class="abs thumb" style="left:640px;top:1180px;font-size:110px">👆</div></div>`);
scenesEl.appendChild(vFeed);
function rFeed(t,el){const T=t; pop($('.ph',el),T,0,.35,.9);
  const sp=T<W('p2',/^nobody/)?520:900; const y=T*520+Math.max(0,T-W('p2',/^nobody/))*380; scrollFeed(el,y);
  const fd=$('.fd',el); fd.style.filter=T>W('p2',/^nobody/)?`blur(${2*clamp(P(T,W('p2',/^nobody/),.3))}px)`:'none';
  const ph=(T*1.4)%1; $('.thumb',el).style.transform=`translateY(${-eio(clamp(ph/.6))*260}px)`; $('.thumb',el).style.opacity=ph<.7?1:1-(ph-.7)/.3;}

/* ---------- the drive: field of brown cows, then the purple cow ---------- */
const NC=6, GAP=450, SPD=380;
const vField=mk(`<div class="scene"><div class="abs fl" style="left:40px;right:40px;top:640px;height:780px;border-radius:44px;overflow:hidden;background:linear-gradient(#0A140E,#06331A 70%);border:1.5px solid rgba(255,255,255,.12)">
  <svg class="abs" width="1000" height="780" viewBox="0 0 1000 780" style="left:0;top:0"><path d="M0 430 C200 380 420 420 600 390 C780 360 900 400 1000 380 L1000 780 L0 780Z" fill="#0E3B21"/><path d="M0 500 C250 470 500 510 1000 480 L1000 780 L0 780Z" fill="#0E7A3C" opacity=".55"/></svg>
  <div class="fence abs" style="left:0;top:470px;width:3000px;height:120px">${Array.from({length:30},(_,i)=>`<i style="position:absolute;left:${i*100}px;top:0;width:16px;height:120px;border-radius:6px;background:#3B2A1E"></i>`).join('')}<i style="position:absolute;left:0;right:0;top:30px;height:10px;background:#4A3626"></i><i style="position:absolute;left:0;right:0;top:75px;height:10px;background:#4A3626"></i></div>
  <div class="herd">${Array.from({length:NC},(_,i)=>`<div class="bc abs" data-i="${i}" style="top:370px;width:370px"><span class="tag pill" style="position:absolute;left:40px;top:-70px;background:#F5F8F6;color:#030403;font-size:26px;font-weight:900;white-space:nowrap;opacity:0">${['Quality','Fast shipping','Best price'][i%3]}</span>${COW('brown',370)}</div>`).join('')}</div>
  <div class="pcw abs" style="top:300px;width:460px;opacity:0"><div style="filter:drop-shadow(0 0 40px rgba(157,92,245,.85))">${COW('purple',460)}</div></div>
  <div class="bub abs" style="left:80px;top:150px;padding:20px 30px;border-radius:30px 30px 30px 8px;background:#F5F8F6;color:#030403;font:800 38px Inter;opacity:0">💬 “You HAVE to see this cow”</div>
