<!doctype html>
<html><head><meta charset="utf-8">
<!-- BFCM #2: don't press the Google Ads seasonality adjustment button (house teaching style). Pain, Poke, Fix, Payoff, Recap, CTA. -->
<style>
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
@font-face{font-family:Mont;src:url(fonts/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/SpaceMono-Bold.ttf)}
@font-face{font-family:ISerif;src:url(fonts/InstrumentSerif-Italic.ttf);font-style:normal;font-weight:400}
:root{
  --ink:#030403; --ink2:#0A0D0B; --line:rgba(255,255,255,.08);
  --text:#F5F8F6; --muted:#8A938C; --lime:#22E06F; --violet:#0E7A3C; --deep:#06331A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
body{font-family:Inter,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-200px}
.blob{position:absolute;border-radius:50%;filter:blur(140px);opacity:.42}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 45%,#000 30%,transparent 80%);opacity:.55}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.65) 100%);pointer-events:none}
.scene{position:absolute;inset:0;will-change:transform,filter,opacity}
.abs{position:absolute}
.mono{font-family:Mono,monospace;letter-spacing:.04em}
#prog{position:absolute;top:118px;left:90px;right:90px;display:flex;gap:12px}
#prog .seg{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
#prog .seg i{display:block;height:100%;width:0;background:var(--lime);border-radius:8px;box-shadow:0 0 18px var(--lime)}
.card{position:absolute;left:90px;width:900px;border-radius:44px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14);box-shadow:0 40px 120px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(30px);overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:12px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:30px}
.title{font-family:Mont;font-weight:900;font-size:128px;line-height:.92;letter-spacing:-.035em}
.sub{font-size:44px;font-weight:500;color:#C8D0CA;line-height:1.25}
.sub b{color:var(--lime);font-weight:800}
.bar{height:22px;border-radius:12px;background:rgba(255,255,255,.14)}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-family:Mont;font-weight:900;font-size:66px;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase}
#cap span{display:inline-block;margin:0 10px;text-shadow:0 6px 30px rgba(0,0,0,.7)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:overlay}
#wipe{position:absolute;left:0;right:0;height:2400px;top:-2400px;background:var(--lime)}
.ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16)}
.tile{display:inline-flex;align-items:center;justify-content:center;flex:none;background:#fff;color:#030403;font-family:Mont;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style></head>
<body><div id="stage">
  <div class="bg" id="bg">
    <div class="blob" id="b1" style="width:900px;height:900px;background:var(--violet)"></div>
    <div class="blob" id="b2" style="width:800px;height:800px;background:var(--deep)"></div>
    <div class="blob" id="b3" style="width:600px;height:600px;background:var(--lime);opacity:.18"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="scenes"></div>
  <div id="prog"></div>
  <div id="cap"></div>
  <div id="wipe"></div>
  <div id="flash"></div>
  <div class="vig"></div>
</div>
<script>
const D = window.__DATA__;
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eo5=t=>1-Math.pow(1-clamp(t),5);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const P=(t,a,d)=>clamp((t-a)/d);
function st(el,o){for(const k in o) el.style[k]=o[k];}
function pop(el,t,a,d=.45,from=.6){const p=P(t,a,d);st(el,{opacity:clamp(p*3),transform:`scale(${lerp(from,1,back(p))})`});}
function rise(el,t,a,d=.5,dy=60){const p=eo(P(t,a,d));st(el,{opacity:p,transform:`translateY(${(1-p)*dy}px)`,filter:`blur(${(1-p)*10}px)`});}
function typed(el,txt,t,a,cps=26){const n=Math.floor(clamp((t-a)*cps,0,txt.length));el.textContent=txt.slice(0,n);return n<txt.length;}
function mk(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
const scenesEl=$('#scenes');

/* ---------- content: teaching shots (house delivery). Each visual stays up and changes state on the spoken words. ---------- */
const S=D.segs, segBy=Object.fromEntries(S.map(s=>[s.key,s]));
const W=(seg,re,n=0)=>{const ws=segBy[seg].words.filter(x=>re.test(x.w));return ws[n]?ws[n].s:null;};
const ST=k=>segBy[k].start;
const END=D.end;
let _gid=0;
const LT=(svg,size,r)=>{const id='g'+(++_gid);return `<span class="tile" style="width:${size}px;height:${size}px;border-radius:${r}px;padding:${Math.round(size*.17)}px;background:#fff">${svg.replace(/igg/g,id)}</span>`;};
const LOGO_G=`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><line x1="56" y1="150" x2="102" y2="56" stroke="#FBBC04" stroke-width="46" stroke-linecap="round"/><line x1="102" y1="56" x2="148" y2="150" stroke="#4285F4" stroke-width="46" stroke-linecap="round"/><circle cx="56" cy="150" r="25" fill="#34A853"/></svg>`;
const DOC=`<svg width="100%" height="100%" viewBox="0 0 24 24"><path d="M6 2h8l5 5v15H6z" fill="none" stroke="#030403" stroke-width="2.2" stroke-linejoin="round"/><path d="M14 2v5h5M9 12h7M9 16h7" stroke="#030403" stroke-width="2.2"/></svg>`;
const TICK=(s=34,c='#030403')=>`<svg width="${s}" height="${s}" viewBox="0 0 26 26"><path d="M4 14l6 6L22 6" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CARD='background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.16);border-radius:40px';

/* ---------- headline: the spoken words, each blurs in when it is said ---------- */
const g=(txt,at,lime)=>`<span class="h-w" data-at="${at}" style="display:inline-block;${lime?'color:var(--lime)':''}">${txt}</span>`;
const L=t=>`<b style="color:var(--lime)">${t}</b>`;
const HL=[
  {a:0, lead:'over', size:150, big:g('5,000',W('p1',/^five/),1)+'<br>'+g('ACCOUNTS',W('p1',/^accounts/)), sub:g('tried one '+L('Black Friday trick.'),W('p1',/^tried/))},
  {a:ST('p2')-.12, lead:'and it made their', size:120, big:g('CLICKS',W('p2',/^clicks/))+'<br>'+g('COST MORE.',W('p2',/^cost/),1)},
  {a:ST('p3')-.12, size:112, big:g("DON'T PRESS",ST('p3'))+'<br>'+g('THIS BUTTON.',W('p3',/^button/),1)},
  {a:ST('k1')-.12, lead:"it's called a", size:96, big:g('SEASONALITY',W('k1',/^seasonality/))+'<br>'+g('ADJUSTMENT.',W('k1',/^adjustment/),1), sub:g('it tells Google to '+L('bid higher.'),W('k1',/^It$/))},
  {a:ST('k2')-.12, lead:'accounts that used it saw click costs rise', size:210, big:g('2×',W('k2',/^twice/),1), sub:g("as much as accounts that didn't.",W('k2',/^as/))},
  {a:ST('f0')-.12, lead:"here's what to do instead", size:150, big:g('3 STEPS',W('f0',/^Three/),1), sub:g('before Friday.',W('f0',/^before/))},
  {a:ST('f1a')-.12, lead:'step one · search for', size:96, big:g('SEASONALITY',W('f1a',/^seasonality/))+'<br>'+g('ADJUSTMENTS',W('f1a',/^adjustments/),1)},
  {a:ST('f1b')-.12, lead:'one set for black friday?', size:140, big:g('REMOVE IT.',W('f1b',/^remove/),1)},
  {a:ST('f2a')-.12, lead:'step two · let', size:100, big:g('SMART BIDDING',W('f2a',/^Smart/),1)+'<br>'+g('DO ITS JOB.',W('f2a',/^do/))},
  {a:ST('f2b')-.12, lead:'google says it already accounts for', size:130, big:g('HOLIDAYS.',W('f2b',/^holidays/),1)},
  {a:ST('f3a')-.12, lead:'step three · put that energy into', size:140, big:g('YOUR',W('f3a',/^your/))+' '+g('OFFER.',W('f3a',/^offer/),1)},
  {a:ST('f3b')-.12, lead:'add a black friday', size:110, big:g('PROMOTION',W('f3b',/^promotion/),1)+'<br>'+g('ASSET.',W('f3b',/^asset/)), sub:g('so your discount shows '+L('right in the ad.'),W('f3b',/^so/))},
  {a:ST('y1')-.12, lead:'now google bids on', size:120, big:g('REAL DEMAND.',W('y1',/^real/),1), sub:g('and shoppers see your deal '+L('before they click.'),W('y1',/^And/))},
  {a:ST('r1')-.12, lead:'recap · save this', size:100, big:g('REMOVE.',W('r1',/^Remove/))+' '+g('TRUST.',W('r1',/^Trust/))+'<br>'+g('PROMOTE.',W('r1',/^Promote/),1)},
  {a:ST('c1')-.12, cta:true},
];
const hlEls=HL.map(h=>{const e=mk(`<div class="scene">${h.cta?'':`<div class="abs" style="top:220px;left:30px;right:30px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
  ${h.lead?`<div class="h-l mono" style="font-size:38px;color:#AEB7B0;text-transform:lowercase">${h.lead}</div>`:''}
  <div class="h-b" style="font:900 ${h.size||118}px/.95 Mont;letter-spacing:-.035em;text-transform:uppercase">${h.big}</div>
  ${h.sub?`<div class="h-s" style="font:700 46px Inter;color:#C8D0CA">${h.sub}</div>`:''}</div>`}</div>`);scenesEl.appendChild(e);return e;});

const CUR=`<svg width="70" height="70" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#fff" stroke="#030403" stroke-width="1.5"/></svg>`;
const STAMP=(txt)=>`<div class="stamp" style="position:absolute;left:0;right:0;margin:0 auto;width:fit-content;padding:14px 34px;border:8px solid #F5F8F6;border-radius:20px;font:900 70px Mont;color:#F5F8F6;background:rgba(3,4,3,.8);transform:rotate(-7deg);opacity:0">${txt}</div>`;
function stampAt(el,T,at){const p=P(T,at-.05,.25); st(el,{opacity:clamp(p*3),transform:`rotate(-7deg) scale(${lerp(1.8,1,eo5(p))})`});}

/* ---------- V1a: 5,000 accounts, click cost goes up ---------- */
const vDots=mk(`<div class="scene"><div class="abs dc" style="left:70px;right:70px;top:720px;padding:32px;${CARD}">
  <div style="display:flex;align-items:center;gap:16px">${LT(LOGO_G,56,15)}<span class="mono" style="font-size:22px;color:#8E9890">GOOGLE ADS ACCOUNTS · BLACK FRIDAY</span></div>
  <div style="margin-top:24px;display:grid;grid-template-columns:repeat(20,1fr);gap:10px">${Array.from({length:100},()=>`<i class="dd" style="display:block;aspect-ratio:1;border-radius:50%;background:#22E06F;opacity:0"></i>`).join('')}</div>
  <div style="margin-top:26px;display:flex;align-items:center;justify-content:space-between"><span class="mono" style="font-size:24px;color:#AEB7B0">AVG. COST PER CLICK</span><span class="dcp" style="font:900 54px Mont">$1.00</span></div>
  <div style="margin-top:10px;height:22px;border-radius:11px;background:rgba(255,255,255,.1);overflow:hidden"><i class="dcb" style="display:block;height:100%;width:40%;background:#8A938C"></i></div></div></div>`);
scenesEl.appendChild(vDots);
function rDots(t,el){const T=t; rise($('.dc',el),T,0,.35,40);
  $$('.dd',el).forEach((d,i)=>{d.style.opacity=clamp((T-.15-i*.016)/.15);});
  const c=eo(P(T,W('p2',/^clicks/),.9)); $('.dcp',el).textContent='$'+(1+.5*c).toFixed(2); $('.dcb',el).style.width=lerp(40,80,c)+'%'; $('.dcb',el).style.background=c>.1?'#F5F8F6':'#8A938C';
  $$('.dd',el).forEach(d=>{if(c>.1) d.style.background='#F5F8F6';});
}
/* ---------- V1b: the button ---------- */
const vBtn=mk(`<div class="scene"><div class="abs bc" style="left:120px;right:120px;top:760px;padding:40px;${CARD};text-align:center">
  <div class="mono" style="font-size:22px;color:#8E9890">GOOGLE ADS · EXAMPLE</div>
  <div class="bb" style="margin:34px auto 0;width:fit-content;padding:30px 50px;border-radius:999px;background:#22E06F;color:#030403;font:900 50px Mont;box-shadow:0 0 50px rgba(34,224,111,.6)">+ Seasonality adjustment</div></div>
  <div class="abs bcur" style="left:700px;top:1010px;opacity:0">${CUR}</div>
  <div class="abs" style="left:0;right:0;top:880px">${STAMP('✕ DON\'T')}</div></div>`);
scenesEl.appendChild(vBtn);
function rBtn(t,el){const T=t+ST('p3')-.12; pop($('.bc',el),t,0,.35,.8);
  const cu=$('.bcur',el); const mv=eo(P(t,.1,.7)); cu.style.opacity=clamp(P(t,.1,.2)); cu.style.transform=`translate(${(1-mv)*180}px,${(1-mv)*160}px)`;
  stampAt($('.stamp',el),T,W('p3',/^button/));}
/* ---------- V1c: what it does ---------- */
const vAdj=mk(`<div class="scene"><div class="abs ajc" style="left:70px;right:70px;top:720px;padding:34px;${CARD}">
  <div style="display:flex;align-items:center;gap:16px">${LT(LOGO_G,56,15)}<span class="mono" style="font-size:22px;color:#8E9890">SEASONALITY ADJUSTMENT · EXAMPLE</span></div>
  ${[['Name','Black Friday'],['Dates','Nov 27 – Nov 30'],['Conversion rate change','+50%']].map(([k,v],i)=>`<div class="aj" style="margin-top:${i?14:26}px;display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-radius:22px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.16)"><span style="font:700 30px Inter;color:#AEB7B0">${k}</span><span style="font:900 ${i===2?56:38}px ${i===2?'Mont':'Inter'};color:${i===2?'var(--lime)':'#fff'}">${v}</span></div>`).join('')}
  <div class="ajb pill" style="margin-top:22px;background:#F5F8F6;color:#030403;font-size:32px;font-weight:900;opacity:0">↑ Google bids higher on every click</div></div></div>`);
scenesEl.appendChild(vAdj);
function rAdj(t,el){const T=t+ST('k1')-.12; rise($('.ajc',el),t,0,.35,40); $$('.aj',el).forEach((r,i)=>rise(r,t,.15+i*.15,.3,20)); pop($('.ajb',el),T,W('k1',/^bid/)-.05,.4,.6);}
/* ---------- V1d: 2x ---------- */
const vBars=mk(`<div class="scene"><div class="abs brc" style="left:70px;right:70px;top:720px;padding:34px;${CARD}">
  <div class="mono" style="font-size:22px;color:#8E9890">RISE IN COST PER CLICK · BLACK FRIDAY WEEK</div>
  <div style="margin-top:20px;height:380px;display:flex;align-items:flex-end;justify-content:center;gap:90px">
   ${[['Without it','1×','#8A938C',.5],['With it','2×','#F5F8F6',1]].map(([l,v,c,h])=>`<div style="display:flex;flex-direction:column;align-items:center;gap:12px;height:100%;justify-content:flex-end"><span class="bv" style="font:900 60px Mont;color:${c};opacity:0">${v}</span><i class="bbar" data-h="${h}" style="display:block;width:200px;height:0;border-radius:18px 18px 6px 6px;background:${c}"></i><span style="font:800 32px Inter">${l}</span></div>`).join('')}</div>
  <div class="mono" style="margin-top:22px;font-size:18px;color:#8E9890">SOURCE: OPTMYZR STUDY, 5,000+ ACCOUNTS PER YEAR, BFCM 2022–2024</div></div></div>`);
scenesEl.appendChild(vBars);
function rBars(t,el){const T=t+ST('k2')-.12; rise($('.brc',el),t,0,.35,40);
  const bs=$$('.bbar',el); const a0=W('k2',/^rise/), a1=W('k2',/^twice/);
  bs.forEach((b,i)=>{const p=eo(P(T,i?a1-.1:a0,.6)); b.style.height=(+b.dataset.h*300*p)+'px'; b.previousElementSibling.style.opacity=p>.3?1:0;});}

/* ---------- V2: the 3 steps ---------- */
const STEPS=['Remove the adjustment','Let Smart Bidding work','Promote your offer'];
const vFix=mk(`<div class="scene"><div class="abs" style="left:90px;right:90px;top:720px;display:flex;flex-direction:column;gap:22px">${STEPS.map((x,i)=>`<div class="fs" style="display:flex;align-items:center;gap:24px;padding:30px 32px;border-radius:28px;${CARD}"><span class="tile" style="width:80px;height:80px;border-radius:22px;font:900 40px Mont">${i+1}</span><span style="font:800 44px Inter">${x}</span></div>`).join('')}</div></div>`);
scenesEl.appendChild(vFix);
function rFix(t,el){const T=t+ST('f0')-.12; $$('.fs',el).forEach((c,i)=>pop(c,T,W('f0',/^Three/)-.05+i*.15,.4,.6));}

/* ---------- V3: steps card ---------- */
const AD=(promo)=>`<div style="padding:26px;border-radius:24px;background:#F5F8F6;color:#030403;text-align:left">
  <div style="font:700 22px Inter;color:#3A403C"><b>Sponsored</b> · yourstore.com</div>
  <div style="margin-top:8px;font:800 36px Inter;color:#1a3fb0">Winter Jackets | Free Shipping</div>
  <div style="margin-top:8px;font:500 26px/1.35 Inter;color:#3A403C">Warm, waterproof jackets for every day. Easy returns.</div>
  <div class="pr" style="margin-top:14px;display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:14px;background:#E3F9EC;font:800 28px Inter;${promo?'':'opacity:0'}">🏷 Black Friday: 30% off jackets <span style="font:600 22px Inter;color:#3A403C">· Ends Nov 30</span></div></div>`;
const vStep=mk(`<div class="scene"><div class="abs sc3" style="left:60px;right:60px;top:690px;height:660px;padding:32px;${CARD}">
  <div style="display:flex;align-items:center;gap:16px">${LT(LOGO_G,56,15)}<span class="mono st-h" style="font-size:22px;color:#8E9890"></span></div>
  <div class="s1" style="position:absolute;left:32px;right:32px;top:120px">
    <div style="display:flex;align-items:center;gap:16px;padding:22px 26px;border-radius:999px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3)"><span style="font-size:34px">🔍</span><span class="q" style="font:700 34px Inter"></span><i class="qc" style="display:inline-block;width:3px;height:36px;background:#fff"></i></div>
    <div class="r1" style="margin-top:26px;padding:24px 26px;border-radius:22px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18)">
      <div style="display:flex;align-items:center;justify-content:space-between"><div><div style="font:800 34px Inter">Black Friday</div><div style="font:600 26px Inter;color:#AEB7B0">Nov 27 – Nov 30 · +50%</div></div>
      <span class="rm pill" style="background:#F5F8F6;color:#030403;font-size:28px;font-weight:900">Remove</span></div></div>
    <div class="rok" style="margin-top:22px;font:800 32px Inter;color:var(--lime);opacity:0">✓ Removed. Bids go back to normal.</div>
    <div class="abs s1cur" style="left:640px;top:200px;opacity:0">${CUR}</div></div>
  <div class="s2" style="position:absolute;left:32px;right:32px;top:120px">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-radius:22px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.16)"><span style="font:800 32px Inter">Bid strategy</span><span style="font:800 30px Inter;color:var(--lime)">Smart Bidding ✓</span></div>
    <div style="margin-top:20px;display:grid;grid-template-columns:repeat(9,1fr);gap:8px">${['M','T','W','T','F','S','S','M','T'].map((d,i)=>`<div class="cd" style="text-align:center;padding:16px 0;border-radius:14px;background:${i>=4&&i<=7?'rgba(34,224,111,.18)':'rgba(255,255,255,.06)'};border:1.5px solid ${i>=4&&i<=7?'rgba(34,224,111,.6)':'rgba(255,255,255,.12)'}"><div style="font:700 22px Inter;color:#AEB7B0">${d}</div><div style="font:900 30px Mont">${23+i>30?23+i-30:23+i}</div></div>`).join('')}</div>
    <div class="sbok" style="margin-top:24px;padding:22px 26px;border-radius:22px;background:rgba(34,224,111,.12);border:2px solid rgba(34,224,111,.6);font:800 32px Inter;opacity:0">✓ Black Friday demand: already in the model</div></div>
  <div class="s3" style="position:absolute;left:32px;right:32px;top:120px">${AD(false)}</div>
</div></div>`);
scenesEl.appendChild(vStep);
