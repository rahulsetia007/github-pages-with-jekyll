<!doctype html>
<html><head><meta charset="utf-8">
<!-- Day 6: 1 prompt = 30 Reel hooks. Built from reels/_brand/reference_reel.html (house look). -->
<style>
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
@font-face{font-family:Mont;src:url(fonts/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/SpaceMono-Bold.ttf)}
@font-face{font-family:ISerif;src:url(fonts/InstrumentSerif-Italic.ttf);font-style:normal;font-weight:400}
:root{
  --ink:#030403; --ink2:#0A0D0B; --line:rgba(255,255,255,.08);
  --text:#F5F8F6; --muted:#8A938C; --lime:#22E06F; --violet:#0E7A3C; --deep:#06331A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
body{font-family:Inter,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-200px}
.blob{position:absolute;border-radius:50%;filter:blur(140px);opacity:.42}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 45%,#000 30%,transparent 80%);opacity:.55}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.65) 100%);pointer-events:none}
.scene{position:absolute;inset:0;will-change:transform,filter,opacity}
.abs{position:absolute}
.mono{font-family:Mono,monospace;letter-spacing:.04em}
#prog{position:absolute;top:118px;left:90px;right:90px;display:flex;gap:12px}
#prog .seg{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
#prog .seg i{display:block;height:100%;width:0;background:var(--lime);border-radius:8px;box-shadow:0 0 18px var(--lime)}
.card{position:absolute;left:90px;width:900px;border-radius:44px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14);box-shadow:0 40px 120px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(30px);overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:12px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:30px}
.title{font-family:Mont;font-weight:900;font-size:128px;line-height:.92;letter-spacing:-.035em}
.sub{font-size:44px;font-weight:500;color:#C8D0CA;line-height:1.25}
.sub b{color:var(--lime);font-weight:800}
.bar{height:22px;border-radius:12px;background:rgba(255,255,255,.14)}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-family:Mont;font-weight:900;font-size:66px;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase}
#cap span{display:inline-block;margin:0 10px;text-shadow:0 6px 30px rgba(0,0,0,.7)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:overlay}
#wipe{position:absolute;left:0;right:0;height:2400px;top:-2400px;background:var(--lime)}
.ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16)}
.tile{display:inline-flex;align-items:center;justify-content:center;flex:none;background:#fff;color:#030403;font-family:Mont;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style></head>
<body><div id="stage">
  <div class="bg" id="bg">
    <div class="blob" id="b1" style="width:900px;height:900px;background:var(--violet)"></div>
    <div class="blob" id="b2" style="width:800px;height:800px;background:var(--deep)"></div>
    <div class="blob" id="b3" style="width:600px;height:600px;background:var(--lime);opacity:.18"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="scenes"></div>
  <div id="prog"></div>
  <div id="cap"></div>
  <div id="wipe"></div>
  <div id="flash"></div>
  <div class="vig"></div>
</div>
<script>
const D = window.__DATA__;
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eo5=t=>1-Math.pow(1-clamp(t),5);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const P=(t,a,d)=>clamp((t-a)/d);
function st(el,o){for(const k in o) el.style[k]=o[k];}
function pop(el,t,a,d=.45,from=.6){const p=P(t,a,d);st(el,{opacity:clamp(p*3),transform:`scale(${lerp(from,1,back(p))})`});}
function rise(el,t,a,d=.5,dy=60){const p=eo(P(t,a,d));st(el,{opacity:p,transform:`translateY(${(1-p)*dy}px)`,filter:`blur(${(1-p)*10}px)`});}
function typed(el,txt,t,a,cps=26){const n=Math.floor(clamp((t-a)*cps,0,txt.length));el.textContent=txt.slice(0,n);return n<txt.length;}
function mk(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
const scenesEl=$('#scenes');

/* ---------- content ---------- */
const PROMPT='Write 30 Reel hooks for [your niche]. Each one names a problem my viewer has right now. Under 8 words. No "hey guys".';
const EX=[
 {key:'e1',n:1,angle:'PAIN',     why:'Names a <b>loss</b> they fear.',   h:'Your captions are losing you followers', hi:'losing', views:'48.2K'},
 {key:'e2',n:2,angle:'CURIOSITY',why:'They need the <b>answer</b>.',     h:'Why nobody saves your posts', hi:'saves', views:'31.6K'},
 {key:'e3',n:3,angle:'TWIST',    why:'Praise, then a <b>gut punch</b>.', h:'Your content is good. Your hook isn\'t.', hi:'hook', views:'62.9K'},
];
const CHECK=`<svg width="30" height="30" viewBox="0 0 26 26"><path d="M4 14l6 6L22 6" stroke="#22E06F" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const PHONE=(inner,id='')=>`<div class="abs ${id}" style="left:60px;top:60px;width:290px;height:520px;border-radius:40px;background:#0A0D0B;border:6px solid #1C231F;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5)">
  <div class="abs" style="inset:0;background:radial-gradient(300px 260px at 50% 40%,#0E7A3C,#06331A 60%,#030403)"></div>${inner}</div>`;

/* ---------- HOOK (cover frame) ---------- */
const hook=mk(`<div class="scene" id="s-hook">
  <div class="abs mono" id="h-tag" style="top:250px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)">STUCK AT 200 VIEWS?</div>
  <div class="abs" id="h-n" style="top:300px;left:0;right:0;text-align:center;font-family:Mont;font-weight:900;font-size:520px;line-height:1;letter-spacing:-.06em;background:linear-gradient(180deg,#fff 30%,#22E06F);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 20px 80px rgba(34,224,111,.35))">200</div>
  <div class="abs title" id="h-t1" style="top:860px;left:0;right:0;text-align:center;font-size:118px">VIEWS. AGAIN?</div>
  <div class="abs" id="h-t2" style="top:990px;left:0;right:0;text-align:center;font-family:ISerif;font-size:92px;color:#D8E0DA">it's your first 3 seconds</div>
  <div class="abs" id="h-list" style="top:1140px;left:40px;right:40px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px">
    ${['How Reels get pushed','The fix','30 hooks'].map((a,i)=>`<div class="pill ghost" style="font-size:29px;padding:8px 22px 8px 8px;gap:10px"><span class="tile" style="width:46px;height:46px;border-radius:23px;font:700 20px Mono">${String(i+1).padStart(2,'0')}</span>${a}</div>`).join('')}</div>
  <div class="abs pill" id="h-save" style="top:1400px;left:50%;margin-left:-160px;width:320px;justify-content:center;background:var(--lime);color:#030403;font-size:34px;font-weight:900">
    <svg width="30" height="36" viewBox="0 0 30 36"><path d="M3 2h24v32l-12-8-12 8z" fill="#030403"/></svg> SAVE THIS</div>
</div>`);
scenesEl.appendChild(hook);

/* ---------- item scene shell (same layout as the tool scenes) ---------- */
const CARD_TOP=760, CARD_H=640;
function itemScene(key,idx,tileTxt,name,pillTxt,monoTxt,one,pillMuted){
  const s=mk(`<div class="scene" id="s-${key}">
    <div class="abs mono s-idx" style="top:230px;left:90px;font-size:32px;color:var(--lime)">${idx}</div>
    <div class="abs s-logo" style="top:292px;left:90px"><span class="tile" style="width:132px;height:132px;border-radius:34px;font-size:${tileTxt.length>2?50:68}px">${tileTxt}</span></div>
    <div class="abs title s-name" style="top:300px;left:252px;font-size:${name.length>11?96:112}px">${name}</div>
    <div class="abs s-by" style="top:430px;left:90px;display:flex;gap:16px;align-items:center">
      <span class="pill" style="background:${pillMuted?'rgba(255,255,255,.14)':'var(--lime)'};color:${pillMuted?'#fff':'#030403'};font-size:28px;padding:10px 22px;font-weight:900">${pillTxt}</span>
      <span class="mono" style="font-size:30px;color:var(--muted)">${monoTxt}</span></div>
    <div class="abs sub s-one" style="top:540px;left:90px;right:90px;font-size:56px;font-weight:700;color:#fff">${one}</div>
    <div class="card s-card" style="top:${CARD_TOP}px;height:${CARD_H}px"><div class="abs" style="inset:0;background:radial-gradient(600px 300px at 80% 0%,#0E7A3C55,transparent 70%)"></div><div class="abs s-ui" style="inset:0"></div></div>
  </div>`);
  scenesEl.appendChild(s); return s;
}

// 1) How Reels get pushed: small test group, most swipe, reach stops
const SH=itemScene('how','STEP 01 · HOW REELS GET PUSHED','1','Test group','FIRST 3 SEC','DECIDE YOUR REACH','Swipe away = <b>no push</b>.');
$('.s-ui',SH).innerHTML=`
 <div class="abs h-reel" style="left:60px;top:150px;width:170px;height:300px;border-radius:30px;background:radial-gradient(160px 160px at 50% 40%,#0E7A3C,#06331A 70%);border:5px solid #1C231F;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px"><svg width="56" height="60" viewBox="0 0 22 24"><path d="M2 2l18 10L2 22z" fill="#fff"/></svg><span class="mono" style="font-size:22px">YOUR REEL</span></div>
 <svg class="abs" style="left:250px;top:270px" width="110" height="60"><path class="h-arr" d="M5 30 H90 M70 10 L95 30 L70 50" stroke="#22E06F" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
 <div class="abs" style="left:390px;top:120px;width:450px;display:grid;grid-template-columns:repeat(5,1fr);gap:22px">${Array.from({length:20}).map(()=>`<div class="h-d" style="width:66px;height:66px;border-radius:50%;background:#22E06F;box-shadow:0 0 20px rgba(34,224,111,.5)"></div>`).join('')}</div>
 <div class="abs mono" style="left:390px;top:500px;font-size:24px;color:#8E9890">TEST GROUP</div>
 <div class="abs" style="left:60px;top:520px;display:flex;align-items:baseline;gap:14px"><span class="mono" style="font-size:24px;color:#8E9890">VIEWS</span><span class="h-v" style="font:900 60px Mont">0</span></div>
 <div class="abs h-stop pill" style="right:50px;bottom:44px;background:rgba(255,255,255,.14);color:#fff;font-size:30px;font-weight:900;border:2px solid rgba(255,255,255,.35)">REACH STOPS HERE</div>`;

// 2) What most do: slow intro, viewer swipes
const SB=itemScene('bad','STEP 02 · WHAT MOST DO','✕','Slow start','SWIPED','NO REASON TO STAY','"Hey guys…" = <b>gone</b>.',true);
$('.s-ui',SB).innerHTML=PHONE(`<div class="abs b-cap" style="left:22px;right:22px;top:150px;font:900 34px/1.08 Mont;text-transform:uppercase"></div>`,'b-ph')+`
 <div class="abs" style="left:400px;right:50px;top:90px"><div class="mono" style="font-size:24px;color:#8E9890">VIEWER WATCHING</div>
   <div class="b-t" style="font:900 120px Mont;margin-top:10px;font-variant-numeric:tabular-nums">0:00</div>
   <div style="height:22px;border-radius:12px;background:rgba(255,255,255,.12);margin-top:24px;overflow:hidden"><i class="b-bar" style="display:block;height:100%;width:0;background:#8A938C"></i></div>
   <div class="b-sw" style="margin-top:44px;font:900 64px Mont;color:#fff;display:flex;align-items:center;gap:18px"><svg width="54" height="54" viewBox="0 0 24 24"><path d="M12 20V5M5 11l7-7 7 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Swiped</div></div>`;

// 3) The fix: their problem first
const SG=itemScene('good','STEP 03 · THE FIX','✓','Their problem','KEEPS THEM','SAY IT IN SECOND 1','Lead with their <b>problem</b>.');
$('.s-ui',SG).innerHTML=PHONE(`<div class="abs" style="left:22px;right:22px;top:150px;font:900 38px/1.05 Mont;text-transform:uppercase">Your Reels are stuck at <span style="color:var(--lime)">200 views?</span></div>`,'g-ph')+`
 <div class="abs" style="left:400px;right:50px;top:90px"><div class="mono" style="font-size:24px;color:#8E9890">VIEWER WATCHING</div>
   <div class="g-t" style="font:900 120px Mont;margin-top:10px;color:var(--lime);font-variant-numeric:tabular-nums">0:00</div>
   <div style="height:22px;border-radius:12px;background:rgba(255,255,255,.12);margin-top:24px;overflow:hidden"><i class="g-bar" style="display:block;height:100%;width:0;background:linear-gradient(90deg,#0E7A3C,#22E06F)"></i></div>
   <div class="g-ok" style="margin-top:40px;display:flex;flex-direction:column;gap:16px;font:700 32px Inter;color:#C8D0CA">
     <div class="g-c" style="display:flex;gap:14px;align-items:center">${CHECK}Kept watching</div>
     <div class="g-c" style="display:flex;gap:14px;align-items:center">${CHECK}Shown to more people</div></div></div>`;

// 4) The prompt
const SP=itemScene('prompt','STEP 04 · COPY THIS','C','ChatGPT','FREE','FREE PLAN WORKS','Get <b>30 hooks</b> like that.');
$('.s-ui',SP).innerHTML=`
 <div class="abs" style="left:50px;right:50px;top:50px;height:400px;border-radius:30px;background:rgba(0,0,0,.35);border:1.5px solid rgba(34,224,111,.5);padding:34px 40px">
   <div class="mono" style="font-size:24px;color:var(--lime);margin-bottom:14px">PROMPT</div>
   <div style="font:600 38px/1.42 Inter"><span class="p-q"></span><i class="p-caret" style="display:inline-block;width:4px;height:42px;background:#22E06F;vertical-align:-8px;margin-left:4px"></i></div></div>
 <div class="abs p-send pill" style="right:50px;top:476px;background:var(--lime);color:#030403;font-size:30px;font-weight:900;padding:14px 30px">Send <svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 20V5M5 11l7-7 7 7" stroke="#030403" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 <div class="abs mono p-gen" style="left:60px;top:494px;font-size:26px;color:#8E9890">ALL 30 IN THE CAPTION ↓</div>`;

// 5-7) Three examples it wrote
const ES=EX.map(F=>{
  const s=itemScene(F.key,`EXAMPLE ${F.n} / 3`,'#'+F.n,'Hook #'+F.n,F.angle,`${F.h.split(' ').length} WORDS`,F.why);
  const h=F.h.replace(F.hi,`<span style="color:var(--lime)">${F.hi}</span>`);
  $('.s-ui',s).innerHTML=PHONE(`<div class="abs" style="left:22px;right:22px;top:120px;font:900 34px/1.05 Mont;text-transform:uppercase;letter-spacing:-.01em">${h}</div>
     <div class="abs" style="left:22px;bottom:26px;display:flex;align-items:center;gap:10px;font:800 26px Inter"><svg width="22" height="24" viewBox="0 0 22 24"><path d="M2 2l18 10L2 22z" fill="#fff"/></svg><span class="f-v">0</span></div>`,'f-ph')+`
   <div class="abs f-big" style="left:400px;right:50px;top:96px;font:900 62px/1.02 Mont;letter-spacing:-.02em">${h}</div>
   <div class="abs f-chk" style="left:400px;right:50px;bottom:60px;display:flex;flex-direction:column;gap:14px">
     ${['Names a real problem','8 words or fewer','Makes them need the answer'].map(c=>`<div class="f-c" style="display:flex;gap:14px;align-items:center;font:700 28px Inter;color:#C8D0CA">${CHECK}${c}</div>`).join('')}</div>`;
  return s;});
const ANGLES=['Pain','Curiosity','Twist','Mistake','Shortcut','Result'];

/* ---------- CTA ---------- */
const cta=mk(`<div class="scene" id="s-cta">
  <div class="abs mono" style="top:250px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)" id="c-tag">ALL 30 HOOKS · IN THE CAPTION</div>
  <div class="abs" id="c-grid" style="top:330px;left:90px;right:90px;display:grid;grid-template-columns:1fr 1fr;gap:20px">
   ${ANGLES.map((a,i)=>`<div class="c-g ghost" style="border-radius:28px;padding:18px 26px;display:flex;align-items:center;gap:20px"><span class="tile" style="width:64px;height:64px;border-radius:18px;font:700 26px Mono">${String(i+1).padStart(2,'0')}</span><span style="font:800 38px Inter">${a}</span></div>`).join('')}</div>
  <div class="abs title" id="c-t" style="top:1010px;left:0;right:0;text-align:center;font-size:110px">Follow for more</div>
  <div class="abs" id="c-s" style="top:1135px;left:0;right:0;text-align:center;font-family:ISerif;font-size:80px;color:#D8E0DA">send this to a creator stuck at 200</div>
  <div class="abs pill" id="c-btn" style="top:1290px;left:50%;width:380px;margin-left:-190px;height:110px;justify-content:center;font-size:44px;font-weight:900;background:var(--lime);color:#030403">Follow</div>
  <svg class="abs" id="c-cur" style="top:1352px;left:700px" width="70" height="80" viewBox="0 0 70 80"><path d="M6 4 L6 62 L22 48 L34 74 L46 68 L34 43 L56 43 Z" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round"/></svg>
</div>`);
scenesEl.appendChild(cta);

/* ---------- THESIS: takes over from the cover at 1.4s and finishes the opening line ---------- */
const HOOK_HOLD=1.4;
const thesis=mk(`<div class="scene" id="s-thesis">
  <div class="abs mono" id="t-tag" style="top:470px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)">THE REAL REASON</div>
  <div class="abs" id="t-q" style="top:560px;left:90px;right:90px;text-align:center;font:900 92px/1 Mont;letter-spacing:-.03em;text-transform:uppercase">Stuck at <span style="color:var(--lime)">200 views?</span></div>
  <div class="abs" id="t-s1" style="top:760px;left:70px;right:70px;text-align:center;font:900 116px/.98 Mont;letter-spacing:-.035em;text-transform:uppercase;background:linear-gradient(180deg,#fff 35%,#22E06F);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 20px 60px rgba(34,224,111,.35))">Not the algorithm.</div>
  <div class="abs" id="t-s2" style="top:1090px;left:60px;right:60px;text-align:center;font-family:ISerif;font-size:92px;color:#D8E0DA">it's your first 3 seconds</div>
</div>`);
scenesEl.appendChild(thesis);
function renderThesis(t,el){const w=segBy.hook.words; const a1=w[8].s-HOOK_HOLD-.05, a2=w[12].s-HOOK_HOLD-.05;
  rise($('#t-tag',el),t,0,.3,20);
  const q=$('#t-q',el); const pq=eo5(P(t,0,.35)); st(q,{opacity:clamp(pq*2)*(t>a1?lerp(1,.35,eo(P(t,a1,.3))):1),transform:`scale(${lerp(1.15,1,pq)})`});
  const p1=eo5(P(t,a1,.4)); st($('#t-s1',el),{opacity:clamp(p1*2),transform:`scale(${lerp(1.25,1,p1)})`});
  const s1=$('#t-s1',el); $('#t-s2',el).style.top=(s1.offsetTop+s1.offsetHeight+36)+'px';
  rise($('#t-s2',el),t,a2,.45,30);
}

/* ---------- timeline (voice-driven) ---------- */
const S=D.segs, segBy=Object.fromEntries(S.map(s=>[s.key,s]));
const LEAD=0.18;
const order=['hook','thesis','how','bad','good','prompt','e1','e2','e3','cta'];
const els={hook,thesis,how:SH,bad:SB,good:SG,prompt:SP,cta}; EX.forEach((F,i)=>els[F.key]=ES[i]);
const starts=order.map((k,i)=>i===0?0:k==='thesis'?HOOK_HOLD:segBy[k].start-LEAD);
const END=D.end;
const TR=0.42;
const TRTYPE=['zoom','whip','zoom','whip','wipe','whip','zoom','whip','wipe'];
const NSEG=order.length-3;
for(let i=0;i<NSEG;i++) $('#prog').appendChild(mk('<div class="seg"><i></i></div>'));

/* captions from the real word timings */
const capWords=[];
S.forEach(s=>s.words.forEach((w,k)=>{const nx=s.words[k+1];capWords.push({w:w.w.replace(/[.,]$/,''),s:w.s,e:nx?nx.s:s.start+s.dur,seg:s.key,brk:/[.,!?]$/.test(w.w)});}));
const chunks=[];let cur=[];
capWords.forEach((w,i)=>{cur.push(w);const nx=capWords[i+1];if(cur.length>=3||w.brk||!nx||nx.seg!==w.seg){chunks.push(cur);cur=[];}});

function renderBg(t){
  st($('#b1'),{left:`${300+Math.sin(t*.35)*180}px`,top:`${200+Math.cos(t*.28)*160}px`});
  st($('#b2'),{left:`${500+Math.cos(t*.3)*200}px`,top:`${1300+Math.sin(t*.4)*180}px`});
  st($('#b3'),{left:`${100+Math.sin(t*.5+1)*120}px`,top:`${900+Math.cos(t*.45)*200}px`});
  st($('#grid'),{transform:`translateY(${(t*30)%90}px)`});
}
function sceneTransform(idx,t){
  const a=starts[idx], b=idx+1<order.length?starts[idx+1]:END+5;
  if(t<a-TR*0.5||t>b+TR*0.5) return null;
  let tr='',f='',o=1;
  if(idx>0&&t<a+TR*0.5){const p=eio((t-(a-TR*0.5))/TR);const ty=TRTYPE[idx-1];
    if(ty==='whip'){tr=`translateX(${(1-p)*1100}px)`;f=`blur(${(1-p)*(1-p)*40}px)`;}
    if(ty==='zoom'){tr=`scale(${lerp(.55,1,p)})`;f=`blur(${(1-p)*30}px)`;o=clamp(p*2);}
    if(ty==='wipe'){tr=`translateY(${(1-p)*400}px) scale(${lerp(1.1,1,p)})`;o=p>0.5?1:0;}
  }
  if(idx+1<order.length&&t>b-TR*0.5){const p=eio((t-(b-TR*0.5))/TR);const ty=TRTYPE[idx];
    if(ty==='whip'){tr=`translateX(${-p*1100}px)`;f=`blur(${p*p*40}px)`;}
    if(ty==='zoom'){tr=`scale(${lerp(1,2.2,p)})`;f=`blur(${p*30}px)`;o=1-clamp(p*1.6);}
    if(ty==='wipe'){tr=`translateY(${-p*400}px)`;o=p<0.5?1:0;}
  }
  const life=t-a; tr+=` scale(${1+clamp(life/6)*0.03})`;
  return {tr,f,o};
}
function renderHook(t,el){
  const p7=eo5(P(t,0,.5));
  st($('#h-n',el),{transform:`scale(${lerp(1.12,1,p7)})`,opacity:1});
  const pt=eo5(P(t,0,.4)); st($('#h-t1',el),{transform:`scale(${lerp(1.08,1,pt)})`,opacity:1});
  {const q=eo(P(t,0,.4));st($('#h-t2',el),{opacity:clamp(.5+q),transform:`translateY(${(1-q)*20}px)`});}
  [...$('#h-list',el).children].forEach((c,i)=>pop(c,t,.05+i*.07,.35,.5));
  pop($('#h-save',el),t,1.0,.45,.4);
  const sv=$('#h-save',el); const pulse=1+Math.max(0,Math.sin((t-1.5)*6))*0.04*(t>1.5?1:0); sv.style.transform+=` scale(${pulse})`;
}
function renderItemShell(t,el){
  rise($('.s-idx',el),t,.0,.35,30); pop($('.s-logo',el),t,.02,.45,.3);
  const pn=eo5(P(t,.0,.45)); st($('.s-name',el),{opacity:clamp(pn*2),transform:`translateX(${(1-pn)*-80}px)`,clipPath:`inset(0 ${(1-pn)*100}% 0 0)`});
  rise($('.s-by',el),t,.15,.4,30);
  rise($('.s-one',el),t,.3,.45,40);
  const pc=eo5(P(t,.25,.6)); st($('.s-card',el),{opacity:clamp(pc*2),transform:`translateY(${(1-pc)*160}px) rotateX(${(1-pc)*20}deg) scale(${lerp(.92,1,pc)})`});
}
function renderHow(t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.5;
  pop($('.h-reel',U),u,0,.45,.6); $('.h-arr',U).style.strokeDashoffset=1-eo(P(u,.4,.4));
  const dots=$$('.h-d',U); const keep=[3,12];
  dots.forEach((d,i)=>{const a=.6+i*.04; const p=back(P(u,a,.35)); const gone=!keep.includes(i)&&u>2.6+((i*7)%20)*.06;
    const g=gone?eo(P(u,2.6+((i*7)%20)*.06,.4)):0;
    st(d,{opacity:clamp(P(u,a,.15))*(1-g*.8),transform:`translateX(${g*60}px) scale(${lerp(.3,1,p)*(1-g*.3)})`,background:gone?'#3A433D':'#22E06F',boxShadow:gone?'none':'0 0 20px rgba(34,224,111,.5)'});});
  $('.h-v',U).textContent=Math.round(200*eo(P(u,.6,2.4)));
  pop($('.h-stop',U),u,4.0,.45,.5);
}
function renderBad(t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.45;
  typed($('.b-cap',U),'Hey guys, today I want to show you…',u,.1,16);
  const sec=clamp(u*1.1,0,3); $('.b-t',U).textContent='0:0'+Math.floor(sec); $('.b-bar',U).style.width=(sec/3*100)+'%';
  const sw=P(u,2.9,.5); st($('.b-ph',U),{transform:`translateY(${-eio(sw)*700}px)`,opacity:1-sw});
  rise($('.b-sw',U),u,2.9,.4,30);
}
function renderGood(t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.45;
  pop($('.g-ph',U),u,0,.5,.7);
  const sec=clamp(u*1.4,0,4); $('.g-t',U).textContent='0:0'+Math.floor(sec); $('.g-bar',U).style.width=(Math.min(sec,3)/3*100)+'%';
  $$('.g-c',U).forEach((c,k)=>rise(c,u,1.3+k*.45,.4,30));
}
function renderPrompt(t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.5;
  const cps=40; const typing=typed($('.p-q',U),PROMPT,u,0,cps); $('.p-caret',U).style.opacity=(typing||Math.floor(u*3)%2)?1:0;
  const done=PROMPT.length/cps; pop($('.p-send',U),u,done+.05,.35,.5);
  const press=P(u,done+.45,.2); $('.p-send',U).style.transform+=` scale(${1-Math.sin(press*Math.PI)*.1})`;
  rise($('.p-gen',U),u,done+.6,.4,20);
}
function renderEx(i,t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.45;
  pop($('.f-ph',U),u,0,.5,.7);
  rise($('.f-big',U),u,.15,.45,40);
  const target=parseFloat(EX[i].views); $('.f-v',U).textContent=(target*eo(P(u,.3,1.6))).toFixed(1)+'K';
  $$('.f-c',U).forEach((c,k)=>rise(c,u,.7+k*.25,.4,30));
}
function renderCta(t,el){
  rise($('#c-tag',el),t,0,.3,20);
  [...$('#c-grid',el).children].forEach((c,i)=>pop(c,t,.05+i*.06,.4,.6));
  const pt=eo5(P(t,.3,.45)); st($('#c-t',el),{opacity:pt,transform:`scale(${lerp(1.2,1,pt)})`});
  rise($('#c-s',el),t,.5,.4,30);
  const b=$('#c-btn',el); pop(b,t,.7,.45,.4);
  const click=P(t,2.6,.2); const followed=t>2.7;
  st(b,{background:followed?'rgba(255,255,255,.12)':'#22E06F',color:followed?'#fff':'#030403',border:followed?'2px solid rgba(255,255,255,.4)':'none'}); b.innerHTML=followed?'Following <svg width="34" height="34" viewBox="0 0 34 34" style="margin-left:10px"><path d="M6 18l7 7L28 9" stroke="#22E06F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'Follow';
  b.style.transform+=` scale(${1-Math.sin(click*Math.PI)*.08})`;
  const pc=eio(P(t,1.8,.75)); st($('#c-cur',el),{opacity:clamp(P(t,1.75,.2)),transform:`translate(${(1-pc)*220}px,${(1-pc)*260}px)`});
}

window.seek=function(t){
  renderBg(t);
  order.forEach((k,idx)=>{const el=els[k];const tf=sceneTransform(idx,t);
    if(!tf){el.style.display='none';return;} el.style.display='block';
    st(el,{transform:tf.tr,filter:tf.f||'none',opacity:tf.o});
    const lt=t-starts[idx];
    if(k==='hook')renderHook(lt,el); else if(k==='thesis')renderThesis(lt,el); else if(k==='cta')renderCta(lt,el);
    else if(k==='how')renderHow(lt,el); else if(k==='bad')renderBad(lt,el); else if(k==='good')renderGood(lt,el);
    else if(k==='prompt')renderPrompt(lt,el); else renderEx(EX.findIndex(F=>F.key===k),lt,el);
  });
  [...$('#prog').children].forEach((s,i)=>{const a=starts[i+2],b=starts[i+3];s.firstChild.style.width=`${clamp((t-a)/(b-a))*100}%`;});
  const pv=t<starts[2]-.2?0:t<starts[2]+.2?eo(P(t,starts[2]-.2,.4)):(t>starts[order.length-1]?1-eo(P(t,starts[order.length-1],.3)):1); st($('#prog'),{opacity:pv});
  const cap=$('#cap'); const ch=chunks.find(c=>t>=c[0].s-.05&&t<c[c.length-1].e+.08);
  if(!ch){cap.innerHTML='';} else {
    const pin=eo5(P(t,ch[0].s-.05,.18));
    cap.innerHTML=ch.map(w=>{const on=t>=w.s&&t<w.e+.05; return `<span style="color:${on?'#22E06F':'#fff'};transform:scale(${on?1.08:1})">${w.w}</span>`}).join(' ');
    st(cap,{transform:`translateY(${(1-pin)*30}px) scale(${lerp(.9,1,pin)})`,opacity:pin});
    if(ch[0].seg==='hook'||ch[0].seg==='cta') cap.style.opacity=0;
  }
  let fl=0, wy=-2400;
  for(let i=1;i<order.length;i++){const b=starts[i];const d=t-b;
    if(Math.abs(d)<.12) fl=Math.max(fl,(1-Math.abs(d)/.12)*(TRTYPE[i-1]==='zoom'?.55:.3));
    if(TRTYPE[i-1]==='wipe'&&Math.abs(d)<TR*0.5){const p=eio((d+TR*.5)/TR); wy=lerp(1920,-2400,p);}
  }
  $('#flash').style.opacity=fl; $('#wipe').style.top=`${wy}px`;
  return true;
};
window.__ready=document.fonts.ready.then(()=>true);
window.__starts=starts;
