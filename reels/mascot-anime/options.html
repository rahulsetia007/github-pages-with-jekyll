<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(file:///root/.claude/skills/effects/fonts/Inter.ttf);font-weight:100 900}
@font-face{font-family:Mont;src:url(file:///root/.claude/skills/effects/fonts/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Mono;src:url(file:///root/.claude/skills/effects/fonts/SpaceMono-Bold.ttf)}
@font-face{font-family:ISerif;src:url(file:///root/.claude/skills/effects/fonts/InstrumentSerif-Italic.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1180px;background:#030403;color:#F5F8F6;font-family:Inter;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(140px)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:90px 90px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 30%,transparent 85%)}
h1{position:absolute;left:80px;top:56px;font-family:Mont;font-weight:900;font-size:64px;letter-spacing:-.03em}
h1 span{color:#22E06F}
.sub{position:absolute;left:80px;top:140px;font-family:ISerif;font-size:40px;color:#C8D0CA}
.panel{position:absolute;top:214px;width:560px;height:930px;border-radius:40px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1.5px solid rgba(255,255,255,.14);overflow:hidden}
.panel svg{position:absolute;left:30px;top:70px}
.tag{position:absolute;left:36px;top:30px;font-family:Mono;font-size:24px;color:#22E06F;letter-spacing:.06em}
.name{position:absolute;left:36px;top:690px;font-family:Mont;font-weight:900;font-size:46px;letter-spacing:-.02em}
.desc{position:absolute;left:36px;right:36px;top:748px;font-size:22px;line-height:1.4;color:#C8D0CA}
.desc b{color:#22E06F}
</style></head><body>
<div class="blob" style="width:900px;height:900px;left:-200px;top:-300px;background:#0E7A3C;opacity:.4"></div>
<div class="blob" style="width:900px;height:900px;right:-200px;top:500px;background:#06331A;opacity:.5"></div>
<div class="grid"></div>
<h1>Mascot options <span>· pick one</span></h1>
<div class="sub">original anime-style characters, in your green + black brand</div>
<div id="row"></div>
<script>
const G='#22E06F',SK='#EDB78F',SKS='#CC8E66',HAIR='#2A1D16',HAIRH='#4A3428';
const OUT=`<filter id="o" x="-10%" y="-10%" width="120%" height="120%"><feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/><feFlood flood-color="#fff"/><feComposite in2="d" operator="in" result="w"/><feMerge><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="ir" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E140E"/><stop offset=".6" stop-color="#5A3A22"/><stop offset="1" stop-color="#9A6A3A"/></linearGradient>
<linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C2320"/><stop offset="1" stop-color="#0B0E0C"/></linearGradient>`;
function eye(cx,cy,s,flip){const f=flip?-1:1;return `<g transform="translate(${cx} ${cy}) scale(${f*s} ${s})">
 <clipPath id="c${cx}${s}"><path d="M-36 2 Q-8 -30 34 -8 Q30 26 -4 30 Q-30 26 -36 2Z"/></clipPath>
 <path d="M-36 2 Q-8 -30 34 -8 Q30 26 -4 30 Q-30 26 -36 2Z" fill="#fff"/>
 <g clip-path="url(#c${cx}${s})"><ellipse cx="0" cy="4" rx="21" ry="27" fill="url(#ir)"/><ellipse cx="0" cy="6" rx="10" ry="14" fill="#120B07"/><path d="M-36 -30 H40 V-6 Q0 -16 -36 0Z" fill="rgba(0,0,0,.18)"/></g>
 <ellipse cx="7" cy="-7" rx="8" ry="9" fill="#fff"/><circle cx="-8" cy="15" r="4" fill="#fff"/>
 <path d="M-40 4 Q-10 -36 38 -10 L42 -16 Q-8 -42 -44 -2Z" fill="#120B07"/><path d="M34 -10 L46 -4" stroke="#120B07" stroke-width="5" stroke-linecap="round"/></g>`}
function head(o){ // o:{beard,glasses,chibi,mouth}
 const ex=o.chibi?54:50,ey=o.chibi?330:322,es=o.chibi?1.32:1;
 return `
 <path d="M184 300 C164 160 222 78 300 78 C378 78 436 160 416 300Z" fill="${HAIR}"/>
 <ellipse cx="196" cy="330" rx="18" ry="28" fill="${SKS}"/><ellipse cx="404" cy="330" rx="18" ry="28" fill="${SKS}"/>
 <path d="M200 240 C194 330 214 400 256 446 Q300 486 344 446 C386 400 406 330 400 240 C400 150 200 150 200 240Z" fill="${SK}"/>
 <path d="M200 270 C240 300 360 300 400 270 L400 240 C400 150 200 150 200 240Z" fill="${SKS}" opacity=".55"/>
 ${o.beard?`<path d="M203 330 C206 410 250 472 300 488 C350 472 394 410 397 330 C386 388 360 414 300 418 C240 414 214 388 203 330Z" fill="${HAIR}"/>
 <path d="M262 408 Q300 392 338 408 Q300 418 262 408Z" fill="${HAIR}"/>`:''}
 ${o.mouth==='open'?`<path d="M282 ${o.beard?422:432} Q300 ${o.beard?444:458} 318 ${o.beard?422:432}Z" fill="#7A2A2A"/><path d="M284 ${o.beard?423:433} H316 L314 ${o.beard?429:439} H286Z" fill="#fff"/>`:`<path d="M284 432 Q300 444 316 432" stroke="#7A2A2A" stroke-width="5" fill="none" stroke-linecap="round"/>`}
 <path d="M300 352 L294 384 L302 386" stroke="${SKS}" stroke-width="4" fill="none" stroke-linecap="round"/>
 <ellipse cx="236" cy="372" rx="20" ry="9" fill="#F08A8A" opacity=".35"/><ellipse cx="364" cy="372" rx="20" ry="9" fill="#F08A8A" opacity=".35"/>
 ${eye(300-ex,ey,es,false)}${eye(300+ex,ey,es,true)}
 <path d="M${300-ex-36} ${ey-50} Q${300-ex} ${ey-66} ${300-ex+34} ${ey-52}" stroke="${HAIR}" stroke-width="10" fill="none" stroke-linecap="round"/>
 <path d="M${300+ex+36} ${ey-50} Q${300+ex} ${ey-66} ${300+ex-34} ${ey-52}" stroke="${HAIR}" stroke-width="10" fill="none" stroke-linecap="round"/>
 ${o.glasses?`<g fill="rgba(160,255,200,.08)" stroke="#0B0E0C" stroke-width="6"><rect x="${300-ex-46}" y="${ey-36*es}" width="92" height="${74*es}" rx="16"/><rect x="${300+ex-46}" y="${ey-36*es}" width="92" height="${74*es}" rx="16"/></g>
  <path d="M${300-ex+46} ${ey-8} Q300 ${ey-18} ${300+ex-46} ${ey-8}" stroke="#0B0E0C" stroke-width="6" fill="none"/>
  <path d="M${300-ex-30} ${ey-20} l18 -12 M${300+ex+14} ${ey-20} l18 -12" stroke="${G}" stroke-width="5" stroke-linecap="round"/>`:''}
 <path d="M190 262 L206 176 L236 238 L250 150 L282 228 L300 132 L322 226 L350 148 L366 236 L394 174 L412 262 C440 170 400 80 300 74 C200 80 160 170 190 262Z" fill="${HAIR}"/>
 <path d="M232 120 L300 60 L290 110 L360 66 L340 118 L410 110 L380 140 C340 96 260 96 232 120Z" fill="${HAIR}"/>
 <path d="M250 150 L262 196 M300 132 L306 182 M350 148 L344 190" stroke="${HAIRH}" stroke-width="6" stroke-linecap="round"/>`}
function hoodie(y,w){const l=300-w/2,r=300+w/2;return `
 <path d="M272 ${y-40} H328 V${y+20} H272Z" fill="${SKS}"/>
 <path d="M${l} 800 C${l} ${y+60} ${l+70} ${y+6} 300 ${y} C${r-70} ${y+6} ${r} ${y+60} ${r} 800Z" fill="url(#hood)"/>
 <path d="M228 ${y+10} Q300 ${y+60} 372 ${y+10}" stroke="#2A332E" stroke-width="16" fill="none" stroke-linecap="round"/>
 <path d="M282 ${y+40} V${y+120} M318 ${y+40} V${y+120}" stroke="${G}" stroke-width="7" stroke-linecap="round"/><circle cx="282" cy="${y+126}" r="8" fill="${G}"/><circle cx="318" cy="${y+126}" r="8" fill="${G}"/>
 <path d="M212 ${y-4} Q300 ${y+44} 388 ${y-4}" stroke="${G}" stroke-width="12" fill="none"/><path d="M212 ${y-4} Q300 ${y+44} 388 ${y-4}" stroke="#0B0E0C" stroke-width="4" fill="none" opacity=".35"/>
 <rect x="190" y="${y-38}" width="44" height="64" rx="18" fill="${G}"/><rect x="366" y="${y-38}" width="44" height="64" rx="18" fill="${G}"/>
 <text x="${r-110}" y="${y+120}" font-family="Mono" font-size="34" fill="${G}">&lt;/&gt;</text>`}
const A=`<svg width="500" height="620" viewBox="50 30 500 620">${OUT}<g filter="url(#o)">${hoodie(530,380)}${head({beard:1,glasses:1,mouth:'open'})}</g></svg>`;
const C=`<svg width="500" height="620" viewBox="50 30 500 620">${OUT}<g filter="url(#o)">${hoodie(500,270)}<g transform="translate(300 290) scale(1.04) translate(-300 -290)">${head({beard:1,glasses:1,chibi:1,mouth:'open'})}</g></g></svg>`;
const B=`<svg width="500" height="620" viewBox="50 30 500 620">${OUT}
 <radialGradient id="scr" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#0D2A18"/><stop offset="1" stop-color="#040A06"/></radialGradient>
 <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F7F5"/><stop offset="1" stop-color="#C9D1CC"/></linearGradient>
 <g filter="url(#o)">
 <path d="M300 110 V70" stroke="#C9D1CC" stroke-width="10"/><circle cx="300" cy="62" r="18" fill="${G}"/><circle cx="294" cy="56" r="6" fill="#fff" opacity=".7"/>
 <rect x="208" y="470" width="184" height="150" rx="56" fill="url(#sh)"/>
 <rect x="252" y="510" width="96" height="60" rx="18" fill="#0B0E0C"/><text x="263" y="551" font-family="Mono" font-size="28" fill="${G}">&lt;/&gt;</text>
 <path d="M214 520 q-50 10 -64 -40" stroke="url(#sh)" stroke-width="34" fill="none" stroke-linecap="round"/><circle cx="148" cy="470" r="24" fill="${G}"/>
 <path d="M386 520 q40 20 50 60" stroke="url(#sh)" stroke-width="34" fill="none" stroke-linecap="round"/>
 <rect x="282" y="440" width="36" height="40" fill="#9AA49E"/>
 <rect x="130" y="210" width="40" height="120" rx="20" fill="${G}"/><rect x="430" y="210" width="40" height="120" rx="20" fill="${G}"/>
 <rect x="150" y="100" width="300" height="350" rx="110" fill="url(#sh)"/>
 <rect x="182" y="150" width="236" height="230" rx="80" fill="url(#scr)" stroke="#0B0E0C" stroke-width="6"/>
 <g style="filter:drop-shadow(0 0 10px ${G})"><ellipse cx="248" cy="252" rx="26" ry="36" fill="${G}"/><ellipse cx="352" cy="252" rx="26" ry="36" fill="${G}"/>
 <path d="M278 316 Q300 338 322 316" stroke="${G}" stroke-width="8" fill="none" stroke-linecap="round"/></g>
 <ellipse cx="256" cy="238" rx="9" ry="12" fill="#fff"/><ellipse cx="360" cy="238" rx="9" ry="12" fill="#fff"/><circle cx="242" cy="270" r="4" fill="#fff"/><circle cx="346" cy="270" r="4" fill="#fff"/>
 <ellipse cx="212" cy="300" rx="14" ry="7" fill="${G}" opacity=".4"/><ellipse cx="388" cy="300" rx="14" ry="7" fill="${G}" opacity=".4"/>
 <path d="M196 170 q40 -20 70 -14" stroke="rgba(255,255,255,.25)" stroke-width="8" fill="none" stroke-linecap="round"/>
 </g></svg>`;
const P=[
 ['OPTION A · RECOMMENDED','Anime "AI Sensei"',A,'Anime version of your <b>current mascot</b>: same beard, glasses, black hoodie, green headphones and <b>&lt;/&gt;</b>. Feels like a friendly tech big brother. <b>Best match for the male voice</b> and keeps the brand people already know.'],
 ['OPTION B','"Byte" the AI bot',B,'A glowing-green <b>robot with a screen face</b>. Very on-topic for AI content, <b>fully faceless</b>, and the easiest to animate (eyes + mouth are just green shapes). Less personal than a human host.'],
 ['OPTION C','Chibi Sensei',C,'A <b>cute, big-head chibi</b> version of option A. Most <b>sticker / meme friendly</b>, great for reactions and small corner placement. Can feel less "expert" for business topics.'],
];
P.forEach((p,i)=>{document.getElementById('row').insertAdjacentHTML('beforeend',`<div class="panel" style="left:${80+i*600}px"><div class="tag">${p[0]}</div>${p[2]}<div class="name">${p[1]}</div><div class="desc">${p[3]}</div></div>`)});
</script></body></html>
