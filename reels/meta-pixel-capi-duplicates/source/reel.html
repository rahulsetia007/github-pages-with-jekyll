<!doctype html>
<html><head><meta charset="utf-8">
<!-- Meta Pixel + Conversions API duplicates: two cashiers, one customer (house teaching style). Pain, Poke, Fix, Payoff, Recap, CTA. -->
<style>
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
@font-face{font-family:Mont;src:url(fonts/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/SpaceMono-Bold.ttf)}
@font-face{font-family:ISerif;src:url(fonts/InstrumentSerif-Italic.ttf);font-style:normal;font-weight:400}
:root{
  --ink:#030403; --ink2:#0A0D0B; --line:rgba(255,255,255,.08);
  --text:#F5F8F6; --muted:#8A938C; --lime:#22E06F; --violet:#0E7A3C; --deep:#06331A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
body{font-family:Inter,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-200px}
.blob{position:absolute;border-radius:50%;filter:blur(140px);opacity:.42}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 45%,#000 30%,transparent 80%);opacity:.55}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.65) 100%);pointer-events:none}
.scene{position:absolute;inset:0;will-change:transform,filter,opacity}
.abs{position:absolute}
.mono{font-family:Mono,monospace;letter-spacing:.04em}
#prog{position:absolute;top:118px;left:90px;right:90px;display:flex;gap:12px}
#prog .seg{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
#prog .seg i{display:block;height:100%;width:0;background:var(--lime);border-radius:8px;box-shadow:0 0 18px var(--lime)}
.card{position:absolute;left:90px;width:900px;border-radius:44px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14);box-shadow:0 40px 120px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(30px);overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:12px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:30px}
.title{font-family:Mont;font-weight:900;font-size:128px;line-height:.92;letter-spacing:-.035em}
.sub{font-size:44px;font-weight:500;color:#C8D0CA;line-height:1.25}
.sub b{color:var(--lime);font-weight:800}
.bar{height:22px;border-radius:12px;background:rgba(255,255,255,.14)}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-family:Mont;font-weight:900;font-size:66px;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase}
#cap span{display:inline-block;margin:0 10px;text-shadow:0 6px 30px rgba(0,0,0,.7)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:overlay}
#wipe{position:absolute;left:0;right:0;height:2400px;top:-2400px;background:var(--lime)}
.ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16)}
.tile{display:inline-flex;align-items:center;justify-content:center;flex:none;background:#fff;color:#030403;font-family:Mont;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style></head>
<body><div id="stage">
  <div class="bg" id="bg">
    <div class="blob" id="b1" style="width:900px;height:900px;background:var(--violet)"></div>
    <div class="blob" id="b2" style="width:800px;height:800px;background:var(--deep)"></div>
    <div class="blob" id="b3" style="width:600px;height:600px;background:var(--lime);opacity:.18"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="scenes"></div>
  <div id="prog"></div>
  <div id="cap"></div>
  <div id="wipe"></div>
  <div id="flash"></div>
  <div class="vig"></div>
</div>
<script>
const D = window.__DATA__;
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eo5=t=>1-Math.pow(1-clamp(t),5);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const P=(t,a,d)=>clamp((t-a)/d);
function st(el,o){for(const k in o) el.style[k]=o[k];}
function pop(el,t,a,d=.45,from=.6){const p=P(t,a,d);st(el,{opacity:clamp(p*3),transform:`scale(${lerp(from,1,back(p))})`});}
function rise(el,t,a,d=.5,dy=60){const p=eo(P(t,a,d));st(el,{opacity:p,transform:`translateY(${(1-p)*dy}px)`,filter:`blur(${(1-p)*10}px)`});}
function typed(el,txt,t,a,cps=26){const n=Math.floor(clamp((t-a)*cps,0,txt.length));el.textContent=txt.slice(0,n);return n<txt.length;}
function mk(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
const scenesEl=$('#scenes');

/* ---------- content: teaching shots (house delivery). Each visual stays up and changes state on the spoken words. ---------- */
const S=D.segs, segBy=Object.fromEntries(S.map(s=>[s.key,s]));
const W=(seg,re,n=0)=>{const ws=segBy[seg].words.filter(x=>re.test(x.w));return ws[n]?ws[n].s:null;};
const ST=k=>segBy[k].start;
const END=D.end;
let _gid=0;
const LT=(svg,size,r)=>{const id='g'+(++_gid);return `<span class="tile" style="width:${size}px;height:${size}px;border-radius:${r}px;padding:${Math.round(size*.17)}px;background:#fff">${svg.replace(/igg/g,id)}</span>`;};
const LOGO_G=`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#0081FB" d="M6.915 4.03c-1.968 0-3.683 1.28-4.871 3.113C.704 9.208 0 11.883 0 14.449c0 .706.07 1.369.21 1.973a6.624 6.624 0 0 0 .265.86 5.297 5.297 0 0 0 .371.761c.696 1.159 1.818 1.927 3.593 1.927 1.497 0 2.633-.671 3.965-2.444.76-1.012 1.144-1.626 2.663-4.32l.756-1.339.186-.325c.061.1.121.196.183.3l2.152 3.595c.724 1.21 1.665 2.556 2.47 3.314 1.046.987 1.992 1.22 3.06 1.22 1.075 0 1.876-.355 2.455-.843a3.743 3.743 0 0 0 .81-.973c.542-.939.861-2.127.861-3.745 0-2.72-.681-5.357-2.084-7.45-1.282-1.912-2.957-2.93-4.716-2.93-1.047 0-2.088.467-3.053 1.308-.652.57-1.257 1.29-1.82 2.05-.69-.875-1.335-1.547-1.958-2.056-1.182-.966-2.315-1.303-3.454-1.303zm10.16 2.053c1.147 0 2.188.758 2.992 1.999 1.132 1.748 1.647 4.195 1.647 6.4 0 1.548-.368 2.9-1.839 2.9-.58 0-1.027-.23-1.664-1.004-.496-.601-1.343-1.878-2.832-4.358l-.617-1.028a44.908 44.908 0 0 0-1.255-1.98c.07-.109.141-.224.211-.327 1.12-1.667 2.118-2.602 3.358-2.602zm-10.201.553c1.265 0 2.058.791 2.675 1.446.307.327.737.871 1.234 1.579l-1.02 1.566c-.757 1.163-1.882 3.017-2.837 4.338-1.191 1.649-1.81 1.817-2.486 1.817-.524 0-1.038-.237-1.383-.794-.263-.426-.464-1.13-.464-2.046 0-2.221.63-4.535 1.66-6.088.454-.687.964-1.226 1.533-1.533a2.264 2.264 0 0 1 1.088-.285z"/></svg>`;
const DOC=`<svg width="100%" height="100%" viewBox="0 0 24 24"><path d="M6 2h8l5 5v15H6z" fill="none" stroke="#030403" stroke-width="2.2" stroke-linejoin="round"/><path d="M14 2v5h5M9 12h7M9 16h7" stroke="#030403" stroke-width="2.2"/></svg>`;
const TICK=(s=34,c='#030403')=>`<svg width="${s}" height="${s}" viewBox="0 0 26 26"><path d="M4 14l6 6L22 6" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CARD='background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.16);border-radius:40px';

/* ---------- headline: the spoken words, each blurs in when it is said ---------- */
const g=(txt,at,lime)=>`<span class="h-w" data-at="${at}" style="display:inline-block;${lime?'color:var(--lime)':''}">${txt}</span>`;
const L=t=>`<b style="color:var(--lime)">${t}</b>`;
const HL=[
  {a:0, lead:'meta says', size:120, big:g('20 SALES.',W('p1',/^twenty/),1)+'<br>'+g('YOUR STORE:',W('p1',/^store/))+' '+g('10.',W('p1',/^ten/))},
  {a:ST('p2')-.12, lead:'your setup might be', size:116, big:g('COUNTING',W('p2',/^counting/))+'<br>'+g('EVERY SALE',W('p2',/^every/))+' '+g('TWICE.',W('p2',/^twice/),1)},
  {a:ST('k1')-.12, lead:'picture', size:116, big:g('TWO CASHIERS',W('k1',/^cashiers/),1)+'<br>'+g('ONE CUSTOMER.',W('k1',/^customer/)), sub:g('one at the door,',W('k1',/^One/))+' '+g('one at the till.',W('k1',/^one/))},
  {a:ST('k2')-.12, lead:'your meta pixel and conversions API', size:120, big:g('BOTH',W('k2',/^can/))+' '+g('COUNT IT.',W('k2',/^same/),1), sub:g('meta learns from sales that '+L('never happened.'),W('k2',/^Then/))},
  {a:ST('f0')-.12, lead:"here's how to", size:150, big:g('CHECK.',W('f0',/^check/),1), sub:g('3 steps.',W('f0',/^Three/))},
  {a:ST('f1a')-.12, lead:'step one · open events manager', size:120, big:g('PURCHASE',W('f1a',/^Purchase/),1)+'<br>'+g('EVENT.',W('f1a',/^event/))},
  {a:ST('f1b')-.12, lead:'see where it comes from', size:110, big:g('BROWSER,',W('f1b',/^browser/))+' '+g('SERVER,',W('f1b',/^server/))+'<br>'+g('OR BOTH?',W('f1b',/^both/),1)},
  {a:ST('f2a')-.12, lead:"step two · if it's both, check", size:100, big:g('DEDUPLI-<br>CATION.',W('f2a',/^deduplication/),1)},
  {a:ST('f2b')-.12, lead:'both need the same', size:140, big:g('EVENT ID.',W('f2b',/^event/),1), sub:g('so meta counts the sale '+L('once.'),W('f2b',/^so/))},
  {a:ST('f3a')-.12, lead:'step three · compare a week', size:104, big:g('META',W('f3a',/^Meta/))+' '+g('VS',W('f3a',/^with/))+'<br>'+g('REAL ORDERS.',W('f3a',/^orders/),1)},
  {a:ST('f3b')-.12, lead:'meta way higher?', size:116, big:g('FIX THE',W('f3b',/^fix/))+'<br>'+g('EVENT ID.',W('f3b',/^event/),1), sub:g('ask your developer, or your store\'s app.',W('f3b',/^ask/))},
  {a:ST('y1')-.12, lead:'now one sale', size:120, big:g('COUNTS ONCE.',W('y1',/^counts/),1), sub:g('meta learns from '+L('real buyers, not ghosts.'),W('y1',/^And/))},
  {a:ST('r1')-.12, lead:'recap · save this', size:92, big:g('SOURCE.',W('r1',/^source/))+' '+g('DEDUPE.',W('r1',/^deduplication/))+'<br>'+g('COMPARE.',W('r1',/^Compare/),1)},
  {a:ST('c1')-.12, cta:true},
];
const hlEls=HL.map(h=>{const e=mk(`<div class="scene">${h.cta?'':`<div class="abs" style="top:210px;left:30px;right:30px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
  ${h.lead?`<div class="h-l mono" style="font-size:38px;color:#AEB7B0;text-transform:lowercase">${h.lead}</div>`:''}
  <div class="h-b" style="font:900 ${h.size||118}px/.95 Mont;letter-spacing:-.035em;text-transform:uppercase">${h.big}</div>
  ${h.sub?`<div class="h-s" style="font:700 44px Inter;color:#C8D0CA">${h.sub}</div>`:''}</div>`}</div>`);scenesEl.appendChild(e);return e;});

const CUR=`<svg width="70" height="70" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#fff" stroke="#030403" stroke-width="1.5"/></svg>`;
const PERSON=(c,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="${c}"/><circle cx="20" cy="15" r="7" fill="#030403" opacity=".55"/><path d="M8 34 C10 24 30 24 32 34" fill="#030403" opacity=".55"/></svg>`;
const STORE=`<svg width="100%" height="100%" viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5M4 9h16v11H4z" fill="none" stroke="#030403" stroke-width="2.2" stroke-linejoin="round"/><path d="M9 20v-6h6v6" stroke="#030403" stroke-width="2.2" fill="none"/></svg>`;
const RECEIPT=(id,col,w)=>`<div class="rc" style="width:${w||190}px;padding:16px 16px 22px;background:#F5F8F6;color:#030403;border-radius:10px 10px 0 0;clip-path:polygon(0 0,100% 0,100% 92%,90% 100%,80% 92%,70% 100%,60% 92%,50% 100%,40% 92%,30% 100%,20% 92%,10% 100%,0 92%);font:800 22px Inter">
  <div class="mono" style="font-size:16px;color:#5A625C">PURCHASE</div><div style="font:900 34px Mont">$58</div><div class="rid mono" style="margin-top:6px;font-size:18px;color:${col||'#030403'}">${id}</div></div>`;

/* ---------- V1: 20 vs 10 (pain) ---------- */
const vCmp=mk(`<div class="scene"><div class="abs cc" style="left:60px;right:60px;top:700px;display:grid;grid-template-columns:1fr 1fr;gap:24px">
  <div class="ca" style="padding:30px;${CARD}"><div style="display:flex;align-items:center;gap:14px">${LT(LOGO_G,56,15)}<div><div style="font:800 30px Inter">Meta</div><div class="mono" style="font-size:18px;color:#8E9890">PURCHASES · EXAMPLE</div></div></div><div class="cav" style="margin-top:30px;font:900 200px Mont;line-height:1;color:var(--lime)">0</div></div>
  <div class="cb" style="padding:30px;${CARD}"><div style="display:flex;align-items:center;gap:14px">${LT(STORE,56,15)}<div><div style="font:800 30px Inter">Your store</div><div class="mono" style="font-size:18px;color:#8E9890">REAL ORDERS</div></div></div><div class="cbv" style="margin-top:30px;font:900 200px Mont;line-height:1">0</div></div></div>
  <div class="abs pill cg" style="top:1190px;left:0;right:0;margin:0 auto;width:fit-content;background:#F5F8F6;color:#030403;font-size:36px;font-weight:900;opacity:0">10 sales that never happened?</div>
  <div class="abs pill cx" style="top:1290px;left:0;right:0;margin:0 auto;width:fit-content;background:var(--lime);color:#030403;font-size:36px;font-weight:900;box-shadow:0 0 40px rgba(34,224,111,.6);opacity:0">×2 COUNTED TWICE?</div></div>`);
scenesEl.appendChild(vCmp);
function rCmp(t,el){const T=t; rise($('.ca',el),T,0,.35,40); rise($('.cb',el),T,.1,.35,40);
  $('.cav',el).textContent=Math.round(20*eo(P(T,.1,W('p1',/^twenty/)+.4))); $('.cbv',el).textContent=Math.round(10*eo(P(T,W('p1',/^store/)-.2,W('p1',/^ten/)-W('p1',/^store/)+.4)));
  pop($('.cg',el),T,W('p1',/^ten/)+.3,.4,.6); pop($('.cx',el),T,W('p2',/^twice/)-.1,.45,.6);
  const tw=T>=W('p2',/^twice/)-.1; $('.ca',el).style.borderColor=tw?'#22E06F':'rgba(255,255,255,.16)';}

/* ---------- V2: two cashiers, one customer (poke) ---------- */
const vCash=mk(`<div class="scene"><div class="abs kc" style="left:40px;right:40px;top:660px;height:760px;${CARD};overflow:hidden">
  <div class="abs mono" style="left:34px;top:28px;font-size:22px;color:#8E9890">ONE PURCHASE · EXAMPLE</div>
  <div class="abs kcnt" style="right:34px;top:20px;display:flex;align-items:center;gap:12px;padding:10px 20px;border-radius:999px;background:rgba(3,4,3,.6);border:1.5px solid rgba(255,255,255,.2)">${LT(LOGO_G,40,11)}<span style="font:900 40px Mont">Meta: <b class="kv" style="color:var(--lime)">0</b></span></div>
  <div class="abs cust" style="left:40px;top:560px">${PERSON('#22E06F',120)}</div>
  ${[0,1].map(i=>`<div class="abs csh" data-i="${i}" style="left:${i?640:330}px;top:150px;width:290px;text-align:center">
    <div style="font-size:120px;line-height:1">🧾</div>
    <div style="margin-top:6px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);font:800 28px Inter">${i?'Conversions API':'Meta Pixel'}<div class="mono" style="font-size:18px;color:#AEB7B0">${i?'SERVER · THE TILL':'BROWSER · THE DOOR'}</div></div>
    <div class="rcw" style="margin:18px auto 0;width:190px;opacity:0">${RECEIPT('event ID: none')}</div></div>`).join('')}
  <div class="abs gh" style="left:0;right:0;bottom:30px;text-align:center;font-size:70px;opacity:0">👻 👻 👻</div></div></div>`);
scenesEl.appendChild(vCash);
function rCash(t,el){const T=t+ST('k1')-.12; rise($('.kc',el),t,0,.35,40);
  $$('.csh',el).forEach((c,i)=>pop(c,T,W('k1',/^cashiers/)-.1+i*.2,.4,.6));
  const walk=eo(P(T,W('k1',/^customer/)-.3,1.6)); $('.cust',el).style.left=lerp(40,820,walk)+'px';
  const r1=W('k1',/^door/), r2=W('k1',/^till/); const rc=$$('.rcw',el);
  [r1,r2].forEach((r,i)=>{const p=eo(P(T,r-.1,.4)); rc[i].style.opacity=p; rc[i].style.transform=`translateY(${(1-p)*-40}px)`;});
  $('.kv',el).textContent=(T>=r2?2:T>=r1?1:0); $('.kcnt',el).style.borderColor=T>=r2?'#22E06F':'rgba(255,255,255,.2)';
  pop($('.gh',el),T,W('k2',/^never/)-.1,.45,.5);
  if(T>=W('k2',/^Your/)-.1){ $$('.csh',el).forEach(c=>c.style.boxShadow='none'); }}

/* ---------- V3: 3 steps ---------- */
const STEPS=['Check the source','Check deduplication','Compare with real orders'];
const vFix=mk(`<div class="scene"><div class="abs" style="left:90px;right:90px;top:720px;display:flex;flex-direction:column;gap:22px">${STEPS.map((x,i)=>`<div class="fs" style="display:flex;align-items:center;gap:24px;padding:30px 32px;border-radius:28px;${CARD}"><span class="tile" style="width:80px;height:80px;border-radius:22px;font:900 40px Mont">${i+1}</span><span style="font:800 44px Inter">${x}</span></div>`).join('')}</div></div>`);
scenesEl.appendChild(vFix);
function rFix(t,el){const T=t+ST('f0')-.12; $$('.fs',el).forEach((c,i)=>pop(c,T,W('f0',/^Three/)-.05+i*.15,.4,.6));}

/* ---------- V4: steps card ---------- */
const CHIP=(c,txt)=>`<span class="${c} pill" style="background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);font-size:30px;font-weight:900;color:#AEB7B0">${txt}</span>`;
const vStep=mk(`<div class="scene"><div class="abs sc3" style="left:60px;right:60px;top:690px;height:680px;padding:32px;${CARD}">
  <div style="display:flex;align-items:center;gap:16px">${LT(LOGO_G,56,15)}<span class="mono st-h" style="font-size:22px;color:#8E9890"></span></div>
  <div class="s1" style="position:absolute;left:32px;right:32px;top:120px">
    <div class="mono" style="font-size:22px;color:#AEB7B0">EVENTS MANAGER · EXAMPLE</div>
    ${['PageView','AddToCart','Purchase'].map(n=>`<div class="ev${n==='Purchase'?' evp':''}" style="margin-top:14px;display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-radius:20px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14)"><span style="font:800 34px Inter">${n}</span><span class="mono" style="font-size:20px;color:#8E9890">${n==='Purchase'?'EVENT':''}</span></div>`).join('')}
    <div class="cn" style="margin-top:26px"><div class="mono" style="font-size:22px;color:#AEB7B0;margin-bottom:12px">CONNECTION METHOD</div><div style="display:flex;gap:14px">${CHIP('chb','Browser')}${CHIP('chs','Server')}</div></div></div>
  <div class="s2" style="position:absolute;left:32px;right:32px;top:120px">
    <div class="mono d-lb" style="font-size:22px;color:#AEB7B0">PIXEL + CONVERSIONS API · SAME PURCHASE</div>
    <div style="position:relative;margin-top:20px;height:320px">
      <div class="r-a abs" style="left:120px;top:0">${RECEIPT('ID: #1042','#030403',220)}</div>
      <div class="r-b abs" style="left:500px;top:0">${RECEIPT('ID: <b class="rbid">#88d1</b>','#030403',220)}</div>
      <div class="r-x abs mono" style="left:0;right:0;top:250px;text-align:center;font-size:28px;color:#F5F8F6">≠ different IDs → counted twice</div></div>
