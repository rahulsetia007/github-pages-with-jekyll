<!doctype html>
<html><head><meta charset="utf-8">
<!-- Day 9: 7 Google Ads settings burning your budget. Built from reels/_brand/reference_reel.html (house look). -->
<style>
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
@font-face{font-family:Mont;src:url(fonts/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/SpaceMono-Bold.ttf)}
@font-face{font-family:ISerif;src:url(fonts/InstrumentSerif-Italic.ttf);font-style:normal;font-weight:400}
:root{
  --ink:#030403; --ink2:#0A0D0B; --line:rgba(255,255,255,.08);
  --text:#F5F8F6; --muted:#8A938C; --lime:#22E06F; --violet:#0E7A3C; --deep:#06331A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
body{font-family:Inter,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-200px}
.blob{position:absolute;border-radius:50%;filter:blur(140px);opacity:.42}

.vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.65) 100%);pointer-events:none}
.scene{position:absolute;inset:0;will-change:transform,filter,opacity}
.abs{position:absolute}
.mono{font-family:Mono,monospace;letter-spacing:.04em}
#prog{position:absolute;top:118px;left:90px;right:90px;display:flex;gap:12px}

#prog .seg i{display:block;height:100%;width:0;background:var(--lime);border-radius:8px;box-shadow:0 0 18px var(--lime)}
.card{position:absolute;left:90px;width:900px;border-radius:44px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14);box-shadow:0 40px 120px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(30px);overflow:hidden}

.sub{font-size:44px;font-weight:500;color:#C8D0CA;line-height:1.25}
.sub b{color:var(--lime);font-weight:800}
.bar{height:22px;border-radius:12px;background:rgba(255,255,255,.14)}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-family:Mont;font-weight:900;font-size:66px;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase}

<script>
const D = window.__DATA__;
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eo5=t=>1-Math.pow(1-clamp(t),5);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const P=(t,a,d)=>clamp((t-a)/d);
function st(el,o){for(const k in o) el.style[k]=o[k];}
function pop(el,t,a,d=.45,from=.6){const p=P(t,a,d);st(el,{opacity:clamp(p*3),transform:`scale(${lerp(from,1,back(p))})`});}
function rise(el,t,a,d=.5,dy=60){const p=eo(P(t,a,d));st(el,{opacity:p,transform:`translateY(${(1-p)*dy}px)`,filter:`blur(${(1-p)*10}px)`});}
function typed(el,txt,t,a,cps=26){const n=Math.floor(clamp((t-a)*cps,0,txt.length));el.textContent=txt.slice(0,n);return n<txt.length;}
function mk(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
const scenesEl=$('#scenes');

/* ---------- content ---------- */
const PROMPT='Turn this video script into 5 posts: an Instagram caption, a 5-slide carousel, a LinkedIn post, a 4-post X thread and a short email. Keep each one simple. Script: [paste]';
const OUTS=['Caption','Carousel','LinkedIn','X thread','Email'];
const CHECK=`<svg width="30" height="30" viewBox="0 0 26 26"><path d="M4 14l6 6L22 6" stroke="#22E06F" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const LOGO_SHOP=`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#95BF47" d="M15.337 23.979l7.216-1.561s-2.604-17.613-2.625-17.73c-.018-.116-.114-.192-.211-.192s-1.929-.136-1.929-.136-1.275-1.274-1.439-1.411c-.045-.037-.075-.057-.121-.074l-.914 21.104h.023zM11.71 11.305s-.81-.424-1.774-.424c-1.447 0-1.504.906-1.504 1.141 0 1.232 3.24 1.715 3.24 4.629 0 2.295-1.44 3.76-3.406 3.76-2.354 0-3.54-1.465-3.54-1.465l.646-2.086s1.245 1.066 2.28 1.066c.675 0 .975-.545.975-.932 0-1.619-2.654-1.694-2.654-4.359-.034-2.237 1.571-4.416 4.827-4.416 1.257 0 1.875.361 1.875.361l-.945 2.715-.02.01zM11.17.83c.136 0 .271.038.405.135-.984.465-2.064 1.639-2.508 3.992-.656.213-1.293.405-1.889.578C7.697 3.75 8.951.84 11.17.84V.83zm1.235 2.949v.135c-.754.232-1.583.484-2.394.736.466-1.777 1.333-2.645 2.085-2.971.193.501.309 1.176.309 2.1zm.539-2.234c.694.074 1.141.867 1.429 1.755-.349.114-.735.231-1.158.366v-.252c0-.752-.096-1.371-.271-1.871v.002zm2.992 1.289c-.02 0-.06.021-.078.021s-.289.075-.714.21c-.423-1.233-1.176-2.37-2.508-2.37h-.115C12.135.209 11.669 0 11.265 0 8.159 0 6.675 3.877 6.21 5.846c-1.194.365-2.063.636-2.16.674-.675.213-.694.232-.772.87-.075.462-1.83 14.063-1.83 14.063L15.009 24l.927-21.166z"/></svg>`;
const LOGO_GADS=`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><line x1="56" y1="150" x2="102" y2="56" stroke="#FBBC04" stroke-width="46" stroke-linecap="round"/><line x1="102" y1="56" x2="148" y2="150" stroke="#4285F4" stroke-width="46" stroke-linecap="round"/><circle cx="56" cy="150" r="25" fill="#34A853"/></svg>`;
const LT=(svg,size,r)=>`<span class="tile" style="width:${size}px;height:${size}px;border-radius:${r}px;padding:${Math.round(size*.17)}px;background:#fff">${svg}</span>`;
/* ---------- HOOK (cover frame) ---------- */
const hook=mk(`<div class="scene" id="s-hook">
  <div class="abs" id="h-burn" style="top:150px;left:0;right:0;margin:0 auto;width:fit-content;display:flex;align-items:center;gap:14px;padding:12px 28px;border-radius:999px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);white-space:nowrap"><span class="mono" style="font-size:26px;color:#8A938C">BUDGET LEFT TODAY</span><span class="h-v" style="font:900 44px Mont;font-variant-numeric:tabular-nums">0</span></div>
  <div class="abs mono" id="h-tag" style="top:250px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)">GOOGLE ADS ACCOUNTS</div>
  <div class="abs" id="h-n" style="top:300px;left:0;right:0;text-align:center;font-family:Mont;font-weight:900;font-size:560px;line-height:1;letter-spacing:-.06em;background:linear-gradient(180deg,#fff 30%,#22E06F);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 20px 80px rgba(34,224,111,.35))">7</div>
  <div class="abs title" id="h-t1" style="top:860px;left:0;right:0;text-align:center;font-size:118px">SETTINGS</div>
  <div class="abs" id="h-t2" style="top:990px;left:0;right:0;text-align:center;font-family:ISerif;font-size:92px;color:#D8E0DA">quietly burning your budget</div>
  <div class="abs" id="h-list" style="top:1140px;left:40px;right:40px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px">
    ${[[LOGO_GADS,'Google Ads'],[null,'·'],[null,'1 min each']].map(([l,a])=>l?`<div class="pill ghost" style="font-size:34px;padding:8px 26px 8px 8px;gap:12px">${LT(l,58,29)}${a}</div>`:`<div style="font:900 44px Mont;color:#8A938C;align-self:center">${a}</div>`).join('')}</div>
  <div class="abs pill" id="h-save" style="top:1400px;left:50%;margin-left:-160px;width:320px;justify-content:center;background:var(--lime);color:#030403;font-size:34px;font-weight:900">
    <svg width="30" height="36" viewBox="0 0 30 36"><path d="M3 2h24v32l-12-8-12 8z" fill="#030403"/></svg> SAVE THIS</div>
</div>`);
scenesEl.appendChild(hook);

/* ---------- item scene shell (same layout as the tool scenes) ---------- */
const CARD_TOP=760, CARD_H=640;
function itemScene(key,idx,tileTxt,name,pillTxt,monoTxt,one,pillMuted){
  const s=mk(`<div class="scene" id="s-${key}">
    <div class="abs mono s-idx" style="top:230px;left:90px;font-size:32px;color:var(--lime)">${idx}</div>
    <div class="abs s-logo" style="top:292px;left:90px">${tileTxt.startsWith('<svg')?LT(tileTxt,132,34):`<span class="tile" style="width:132px;height:132px;border-radius:34px;font-size:${tileTxt.length>2?50:68}px">${tileTxt}</span>`}</div>
    <div class="abs title s-name" style="top:300px;left:252px;font-size:${name.length>12?80:name.length>11?96:112}px">${name}</div>
    <div class="abs s-by" style="top:430px;left:90px;display:flex;gap:16px;align-items:center">
      <span class="pill" style="background:${pillMuted?'rgba(255,255,255,.14)':'var(--lime)'};color:${pillMuted?'#fff':'#030403'};font-size:28px;padding:10px 22px;font-weight:900">${pillTxt}</span>
      <span class="mono" style="font-size:30px;color:var(--muted)">${monoTxt}</span></div>
    <div class="abs sub s-one" style="top:540px;left:90px;right:90px;font-size:56px;font-weight:700;color:#fff">${one}</div>
    <div class="card s-card" style="top:${CARD_TOP}px;height:${CARD_H}px"><div class="abs" style="inset:0;background:radial-gradient(600px 300px at 80% 0%,#0E7A3C55,transparent 70%)"></div><div class="abs s-ui" style="inset:0"></div></div>
  </div>`);
  scenesEl.appendChild(s); return s;
}

const ROWS=[
 {k:'r1',lab:'LOCATION',name:'Location',now:'Presence or interest',fix:'Presence',why:'Only <b>locals</b> see your ads.',where:'CAMPAIGN SETTINGS → LOCATIONS'},
 {k:'r2',lab:'NETWORKS',name:'Networks',now:'Display Network: On',fix:'Display Network: Off',why:'Search ads stay on <b>Search</b>.',where:'SEARCH CAMPAIGN → NETWORKS'},
 {k:'r3',lab:'NEGATIVES',name:'Negatives',now:'Negative keywords: none',fix:'jobs · free · DIY · salary',why:'Block <b>junk searches</b> weekly.',where:'KEYWORDS → NEGATIVE KEYWORDS'},
 {k:'r4',lab:'GOALS',name:'Goals',now:'Page view = lead',fix:'Calls + forms only',why:'Count <b>real leads</b> only.',where:'GOALS → CONVERSIONS'},
 {k:'r5',lab:'AUTO-APPLY',name:'Auto-apply',now:'Auto-apply: On',fix:'Auto-apply: Off',why:'Review changes <b>yourself</b>.',where:'RECOMMENDATIONS → AUTO-APPLY'},
 {k:'r6',lab:'STRUCTURE',name:'Structure',now:'1 ad group: everything',fix:'1 ad group per service',why:'Each service gets <b>its own ads</b>.',where:'CAMPAIGN → AD GROUPS'},
 {k:'r7',lab:'SCHEDULE',name:'Schedule',now:'Ads run 24/7',fix:'Only when you answer',why:'No ads when <b>nobody picks up</b>.',where:'CAMPAIGN → AD SCHEDULE'},
];
const XMARK=`<svg width="30" height="30" viewBox="0 0 26 26"><path d="M6 6l14 14M20 6L6 20" stroke="#8A938C" stroke-width="4.5" stroke-linecap="round"/></svg>`;
const RS=ROWS.map((R,i)=>{
  const sc=itemScene(R.k,`SETTING ${String(i+1).padStart(2,'0')} / 07 · ${R.lab}`,LOGO_GADS,R.name,'1-MIN FIX',R.where,R.why);
  $('.s-ui',sc).innerHTML=`
   <div class="abs mono" style="left:50px;top:40px;font-size:22px;color:#8E9890;display:flex;align-items:center;gap:12px">${LT(LOGO_GADS,40,11)}GOOGLE ADS · EXAMPLE</div>
   <div class="abs r-now" style="left:50px;right:50px;top:110px;display:flex;align-items:center;gap:18px;padding:26px 28px;border-radius:24px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06)">
     ${XMARK}<div style="flex:1"><div class="mono" style="font-size:20px;color:#8E9890">NOW</div><div class="r-nt" style="font:800 40px Inter;position:relative;display:inline-block">${R.now}<i class="r-st" style="position:absolute;left:0;top:52%;height:5px;width:100%;background:#8A938C;transform-origin:left;transform:scaleX(0)"></i></div></div></div>
   <div class="abs r-fix" style="left:50px;right:50px;top:270px;display:flex;align-items:center;gap:18px;padding:26px 28px;border-radius:24px;border:3px solid #22E06F;background:rgba(34,224,111,.12)">
     ${CHECK}<div style="flex:1"><div class="mono" style="font-size:20px;color:var(--lime)">CHANGE TO</div><div style="font:800 40px Inter">${R.fix}</div></div></div>
   <div class="abs" style="left:50px;right:50px;bottom:44px">
     <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="mono" style="font-size:22px;color:#8E9890">BUDGET LEAKS FIXED</span><span class="r-c" style="font:900 52px Mont;color:var(--lime)">${i}/7</span></div>
     <div style="display:flex;gap:8px;margin-top:12px">${ROWS.map((_,j)=>`<i class="r-d" data-j="${j}" style="flex:1;height:16px;border-radius:8px;background:${j<i?'#22E06F':'rgba(255,255,255,.14)'}"></i>`).join('')}</div></div>`;
  return sc;});
const ANGLES=ROWS.map(R=>R.name);
const ANGLE_LOGO=ROWS.map(()=>LOGO_GADS);

/* ---------- CTA ---------- */
const cta=mk(`<div class="scene" id="s-cta">
  <div class="abs mono" style="top:250px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)" id="c-tag">7 SETTINGS · 1 MIN EACH</div>
  <div class="abs" id="c-grid" style="top:330px;left:90px;right:90px;display:grid;grid-template-columns:1fr 1fr;gap:20px">
   ${ANGLES.map((a,i)=>`<div class="c-g ghost" style="border-radius:28px;padding:18px 26px;display:flex;align-items:center;gap:20px${i===6?';grid-column:1/3;justify-content:center':''}"><span class="tile" style="width:64px;height:64px;border-radius:18px;font:700 26px Mono">${String(i+1).padStart(2,'0')}</span><span style="font:800 36px Inter">${a}</span></div>`).join('')}</div>
  <div class="abs title" id="c-t" style="top:1010px;left:0;right:0;text-align:center;font-size:110px">Follow for more</div>
  <div class="abs" id="c-s" style="top:1135px;left:0;right:0;text-align:center;font-family:ISerif;font-size:80px;color:#D8E0DA">save this and audit tonight</div>
  <div class="abs pill" id="c-btn" style="top:1290px;left:50%;width:380px;margin-left:-190px;height:110px;justify-content:center;font-size:44px;font-weight:900;background:var(--lime);color:#030403">Follow</div>
  <svg class="abs" id="c-cur" style="top:1352px;left:700px" width="70" height="80" viewBox="0 0 70 80"><path d="M6 4 L6 62 L22 48 L34 74 L46 68 L34 43 L56 43 Z" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round"/></svg>
</div>`);
scenesEl.appendChild(cta);

/* ---------- THESIS: from 1.4s, the daily budget drains to $0 by lunch while leads stay at 0 ---------- */
const HOOK_HOLD=1.4, LAND=3.75, BUDGET=100;
const budget=T=>'$'+Math.max(0,Math.round(BUDGET*(1-Math.pow(clamp(T/LAND),1.3))));
const clock=T=>{const m=9*60+Math.round(clamp(T/LAND)*(3*60+2));const h=Math.floor(m/60),mm=m%60;return `${h>12?h-12:h}:${String(mm).padStart(2,'0')} ${h>=12?'PM':'AM'}`;};
const thesis=mk(`<div class="scene" id="s-thesis">
  <div class="abs mono" id="t-tag" style="top:270px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)">YOUR ACCOUNT TODAY</div>
  <div class="abs" id="t-q" style="top:350px;left:40px;right:40px;text-align:center;font:900 70px/1 Mont;letter-spacing:-.03em;text-transform:uppercase;white-space:nowrap">Budget gone <span style="color:var(--lime)">by lunch.</span></div>
  <div class="abs" id="t-s1" style="top:470px;left:60px;right:60px;text-align:center;font:900 112px/.96 Mont;letter-spacing:-.035em;text-transform:uppercase;background:linear-gradient(180deg,#fff 35%,#22E06F);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 20px 60px rgba(34,224,111,.35))">And zero leads.</div>
  <div class="abs" id="t-shop" style="left:70px;top:720px;width:450px;height:660px;border-radius:40px;background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.18);padding:26px">
    <div style="display:flex;align-items:center;gap:14px">${LT(LOGO_GADS,56,16)}<div><div style="font:800 30px Inter">Google Ads</div><div class="mono" style="font-size:20px;color:#8E9890">EXAMPLE</div></div></div>
    <div class="mono" style="margin-top:44px;font-size:24px;color:#8E9890">DAILY BUDGET LEFT</div>
    <div class="t-b" style="font:900 130px Mont;line-height:1.05;font-variant-numeric:tabular-nums">$100</div>
    <div style="height:30px;border-radius:16px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:14px"><i class="t-bar" style="display:block;height:100%;width:100%;background:linear-gradient(90deg,#0E7A3C,#22E06F)"></i></div>
    <div class="t-clk mono" style="margin-top:30px;font-size:44px;color:#fff">9:00 AM</div></div>
  <div class="abs" id="t-gads" style="left:560px;top:720px;width:450px;height:660px;border-radius:40px;background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.18);padding:26px">
    <div style="display:flex;align-items:center;gap:14px"><span class="tile" style="width:56px;height:56px;border-radius:16px;font-size:30px">☎</span><div><div style="font:800 30px Inter">Your phone</div><div class="mono" style="font-size:20px;color:#8E9890">TODAY</div></div></div>
    <div class="mono" style="margin-top:44px;font-size:24px;color:#8E9890">LEADS</div>
    <div class="t-gz" style="font:900 220px Mont;line-height:1.1;color:#fff">0</div>
    <div class="t-gq" style="margin-top:10px;font:800 34px Inter;color:#C8D0CA">No calls. No forms.</div></div>
  <div class="abs pill" id="t-fix" style="top:1430px;left:0;right:0;margin:0 auto;width:fit-content;background:var(--lime);color:#030403;font-size:34px;font-weight:900;white-space:nowrap;box-shadow:0 0 40px rgba(34,224,111,.6)">7 FIXES · 1 MIN EACH ↓</div>
</div>`);
scenesEl.appendChild(thesis);
function renderThesis(t,el){const w=segBy.hook.words; const a1=w[8].s-HOOK_HOLD-.05;
  rise($('#t-tag',el),t,0,.3,20);
  const q=$('#t-q',el); const pq=eo5(P(t,0,.35)); st(q,{opacity:clamp(pq*2)*(t>a1?lerp(1,.4,eo(P(t,a1,.3))):1),transform:`scale(${lerp(1.15,1,pq)})`});
  const p1=eo5(P(t,a1,.4)); st($('#t-s1',el),{opacity:clamp(p1*2),transform:`scale(${lerp(1.25,1,p1)})`});
  const T=t+HOOK_HOLD;
  rise($('#t-shop',el),t,0,.35,60); rise($('#t-gads',el),t,.08,.35,60);
  $('.t-b',el).textContent=budget(T); $('.t-bar',el).style.width=(100*(1-Math.pow(clamp(T/LAND),1.3)))+'%';
  $('.t-bar',el).style.background=T>LAND*.7?'#8A938C':'linear-gradient(90deg,#0E7A3C,#22E06F)';
  $('.t-clk',el).textContent=clock(T);
  const gz=$('.t-gz',el); const land=P(T,LAND,.3); gz.style.transform=`scale(${1+Math.sin(land*Math.PI)*.12})`;
  pop($('#t-fix',el),T,LAND+.05,.4,.5);
}

/* ---------- timeline (voice-driven) ---------- */
const S=D.segs, segBy=Object.fromEntries(S.map(s=>[s.key,s]));
const LEAD=0.18;
const order=['hook','thesis','r1','r2','r3','r4','r5','r6','r7','cta'];
const els={hook,thesis,cta}; ROWS.forEach((R,i)=>els[R.k]=RS[i]);
const starts=order.map((k,i)=>i===0?0:k==='thesis'?HOOK_HOLD:segBy[k].start-LEAD);
const END=D.end;
const TR=0.42;
const TRTYPE=['zoom','whip','zoom','whip','wipe','whip','zoom','whip','wipe'];
const NSEG=order.length-3;
for(let i=0;i<NSEG;i++) $('#prog').appendChild(mk('<div class="seg"><i></i></div>'));

/* captions from the real word timings */
const capWords=[];
S.forEach(s=>s.words.forEach((w,k)=>{const nx=s.words[k+1];capWords.push({w:w.w.replace(/[.,]$/,''),s:w.s,e:nx?nx.s:s.start+s.dur,seg:s.key,brk:/[.,!?]$/.test(w.w)});}));
const chunks=[];let cur=[];
capWords.forEach((w,i)=>{cur.push(w);const nx=capWords[i+1];if(cur.length>=3||w.brk||!nx||nx.seg!==w.seg){chunks.push(cur);cur=[];}});

function renderBg(t){
  st($('#b1'),{left:`${300+Math.sin(t*.35)*180}px`,top:`${200+Math.cos(t*.28)*160}px`});
  st($('#b2'),{left:`${500+Math.cos(t*.3)*200}px`,top:`${1300+Math.sin(t*.4)*180}px`});
  st($('#b3'),{left:`${100+Math.sin(t*.5+1)*120}px`,top:`${900+Math.cos(t*.45)*200}px`});
  st($('#grid'),{transform:`translateY(${(t*30)%90}px)`});
}
function sceneTransform(idx,t){
  const a=starts[idx], b=idx+1<order.length?starts[idx+1]:END+5;
  if(t<a-TR*0.5||t>b+TR*0.5) return null;
  let tr='',f='',o=1;
  if(idx>0&&t<a+TR*0.5){const p=eio((t-(a-TR*0.5))/TR);const ty=TRTYPE[idx-1];
    if(ty==='whip'){tr=`translateX(${(1-p)*1100}px)`;f=`blur(${(1-p)*(1-p)*40}px)`;}
    if(ty==='zoom'){tr=`scale(${lerp(.55,1,p)})`;f=`blur(${(1-p)*30}px)`;o=clamp(p*2);}
    if(ty==='wipe'){tr=`translateY(${(1-p)*400}px) scale(${lerp(1.1,1,p)})`;o=p>0.5?1:0;}
  }
  if(idx+1<order.length&&t>b-TR*0.5){const p=eio((t-(b-TR*0.5))/TR);const ty=TRTYPE[idx];
    if(ty==='whip'){tr=`translateX(${-p*1100}px)`;f=`blur(${p*p*40}px)`;}
    if(ty==='zoom'){tr=`scale(${lerp(1,2.2,p)})`;f=`blur(${p*30}px)`;o=1-clamp(p*1.6);}
    if(ty==='wipe'){tr=`translateY(${-p*400}px)`;o=p<0.5?1:0;}
  }
  const life=t-a; tr+=` scale(${1+clamp(life/6)*0.03})`;
  return {tr,f,o};
}
function renderHook(t,el){
  const p7=eo5(P(t,0,.5));
  st($('#h-n',el),{transform:`scale(${lerp(1.12,1,p7)})`,opacity:1});
  const pt=eo5(P(t,0,.4)); st($('#h-t1',el),{transform:`scale(${lerp(1.08,1,pt)})`,opacity:1});
  {const q=eo(P(t,0,.4));st($('#h-t2',el),{opacity:clamp(.5+q),transform:`translateY(${(1-q)*20}px)`});}
  [...$('#h-list',el).children].forEach((c,i)=>pop(c,t,.05+i*.07,.35,.5));
  pop($('#h-save',el),t,1.0,.45,.4);
  pop($('#h-burn',el),t,0,.3,.6); $('.h-v',el).textContent=budget(t);
  const sv=$('#h-save',el); const pulse=1+Math.max(0,Math.sin((t-1.5)*6))*0.04*(t>1.5?1:0); sv.style.transform+=` scale(${pulse})`;
}
function renderItemShell(t,el){
  rise($('.s-idx',el),t,.0,.35,30); pop($('.s-logo',el),t,.02,.45,.3);
  const pn=eo5(P(t,.0,.45)); st($('.s-name',el),{opacity:clamp(pn*2),transform:`translateX(${(1-pn)*-80}px)`,clipPath:`inset(0 ${(1-pn)*100}% 0 0)`});
  rise($('.s-by',el),t,.15,.4,30);
  rise($('.s-one',el),t,.3,.45,40);
  const pc=eo5(P(t,.25,.6)); st($('.s-card',el),{opacity:clamp(pc*2),transform:`translateY(${(1-pc)*160}px) rotateX(${(1-pc)*20}deg) scale(${lerp(.92,1,pc)})`});
}
function renderRow(i,t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.45;
  // the "NOW" setting shows first, gets struck out, then the fix lands and the leak counter ticks up
  const fx=2.3;
  rise($('.r-now',U),u,.1,.4,30);
  $('.r-st',U).style.transform=`scaleX(${eo(P(u,fx-.5,.4))})`;
  $('.r-now',U).style.opacity=u>fx-.1?lerp(1,.45,eo(P(u,fx-.1,.3))):$('.r-now',U).style.opacity;
  pop($('.r-fix',U),u,fx,.45,.6);
  const on=u>=fx+.35; $('.r-c',U).textContent=(on?i+1:i)+'/7';
  $$('.r-d',U).forEach(d=>{const j=+d.dataset.j;d.style.background=(j<i||(j===i&&on))?'#22E06F':'rgba(255,255,255,.14)';if(j===i&&on)d.style.boxShadow=`0 0 ${18*(1-P(u,fx+.35,.6))}px #22E06F`;});
}
function renderCta(t,el){
  rise($('#c-tag',el),t,0,.3,20);
  [...$('#c-grid',el).children].forEach((c,i)=>pop(c,t,.05+i*.06,.4,.6));
  const pt=eo5(P(t,.3,.45)); st($('#c-t',el),{opacity:pt,transform:`scale(${lerp(1.2,1,pt)})`});
  rise($('#c-s',el),t,.5,.4,30);
  const b=$('#c-btn',el); pop(b,t,.7,.45,.4);
  const click=P(t,2.6,.2); const followed=t>2.7;
  st(b,{background:followed?'rgba(255,255,255,.12)':'#22E06F',color:followed?'#fff':'#030403',border:followed?'2px solid rgba(255,255,255,.4)':'none'}); b.innerHTML=followed?'Following <svg width="34" height="34" viewBox="0 0 34 34" style="margin-left:10px"><path d="M6 18l7 7L28 9" stroke="#22E06F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'Follow';
  b.style.transform+=` scale(${1-Math.sin(click*Math.PI)*.08})`;
  const pc=eio(P(t,1.8,.75)); st($('#c-cur',el),{opacity:clamp(P(t,1.75,.2)),transform:`translate(${(1-pc)*220}px,${(1-pc)*260}px)`});
}

window.seek=function(t){
  renderBg(t);
  order.forEach((k,idx)=>{const el=els[k];const tf=sceneTransform(idx,t);
    if(!tf){el.style.display='none';return;} el.style.display='block';
    st(el,{transform:tf.tr,filter:tf.f||'none',opacity:tf.o});
    const lt=t-starts[idx];
    if(k==='hook')renderHook(lt,el); else if(k==='thesis')renderThesis(lt,el); else if(k==='cta')renderCta(lt,el);
    else renderRow(ROWS.findIndex(R=>R.k===k),lt,el);
  });
  [...$('#prog').children].forEach((s,i)=>{const a=starts[i+2],b=starts[i+3];s.firstChild.style.width=`${clamp((t-a)/(b-a))*100}%`;});
  const pv=t<starts[2]-.2?0:t<starts[2]+.2?eo(P(t,starts[2]-.2,.4)):(t>starts[order.length-1]?1-eo(P(t,starts[order.length-1],.3)):1); st($('#prog'),{opacity:pv});
  const cap=$('#cap'); const ch=chunks.find(c=>t>=c[0].s-.05&&t<c[c.length-1].e+.08);
  if(!ch){cap.innerHTML='';} else {
    const pin=eo5(P(t,ch[0].s-.05,.18));
    cap.innerHTML=ch.map(w=>{const on=t>=w.s&&t<w.e+.05; return `<span style="color:${on?'#22E06F':'#fff'};transform:scale(${on?1.08:1})">${w.w}</span>`}).join(' ');
    st(cap,{transform:`translateY(${(1-pin)*30}px) scale(${lerp(.9,1,pin)})`,opacity:pin});
    if(ch[0].seg==='hook'||ch[0].seg==='cta') cap.style.opacity=0;
  }
  let fl=0, wy=-2400;
  for(let i=1;i<order.length;i++){const b=starts[i];const d=t-b;
    if(Math.abs(d)<.12) fl=Math.max(fl,(1-Math.abs(d)/.12)*(TRTYPE[i-1]==='zoom'?.55:.3));
    if(TRTYPE[i-1]==='wipe'&&Math.abs(d)<TR*0.5){const p=eio((d+TR*.5)/TR); wy=lerp(1920,-2400,p);}
  }
  $('#flash').style.opacity=fl; $('#wipe').style.top=`${wy}px`;
  return true;
};
window.__ready=document.fonts.ready.then(()=>true);
window.__starts=starts;
</script></body></html>
