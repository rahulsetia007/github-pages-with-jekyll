<!doctype html>
<html><head><meta charset="utf-8">
<!-- Day 8: Google Ads showing outside your city. Built from reels/_brand/reference_reel.html (house look). -->
<style>
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
@font-face{font-family:Mont;src:url(fonts/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/SpaceMono-Bold.ttf)}
@font-face{font-family:ISerif;src:url(fonts/InstrumentSerif-Italic.ttf);font-style:normal;font-weight:400}
:root{
  --ink:#030403; --ink2:#0A0D0B; --line:rgba(255,255,255,.08);
  --text:#F5F8F6; --muted:#8A938C; --lime:#22E06F; --violet:#0E7A3C; --deep:#06331A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
body{font-family:Inter,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-200px}
.blob{position:absolute;border-radius:50%;filter:blur(140px);opacity:.42}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 45%,#000 30%,transparent 80%);opacity:.55}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.65) 100%);pointer-events:none}
.scene{position:absolute;inset:0;will-change:transform,filter,opacity}
.abs{position:absolute}
.mono{font-family:Mono,monospace;letter-spacing:.04em}
#prog{position:absolute;top:118px;left:90px;right:90px;display:flex;gap:12px}
#prog .seg{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
#prog .seg i{display:block;height:100%;width:0;background:var(--lime);border-radius:8px;box-shadow:0 0 18px var(--lime)}
.card{position:absolute;left:90px;width:900px;border-radius:44px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14);box-shadow:0 40px 120px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(30px);overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:12px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:30px}
.title{font-family:Mont;font-weight:900;font-size:128px;line-height:.92;letter-spacing:-.035em}
.sub{font-size:44px;font-weight:500;color:#C8D0CA;line-height:1.25}
.sub b{color:var(--lime);font-weight:800}
.bar{height:22px;border-radius:12px;background:rgba(255,255,255,.14)}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-family:Mont;font-weight:900;font-size:66px;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase}
#cap span{display:inline-block;margin:0 10px;text-shadow:0 6px 30px rgba(0,0,0,.7)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:overlay}
#wipe{position:absolute;left:0;right:0;height:2400px;top:-2400px;background:var(--lime)}
.ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16)}
.tile{display:inline-flex;align-items:center;justify-content:center;flex:none;background:#fff;color:#030403;font-family:Mont;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style></head>
<body><div id="stage">
  <div class="bg" id="bg">
    <div class="blob" id="b1" style="width:900px;height:900px;background:var(--violet)"></div>
    <div class="blob" id="b2" style="width:800px;height:800px;background:var(--deep)"></div>
    <div class="blob" id="b3" style="width:600px;height:600px;background:var(--lime);opacity:.18"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="scenes"></div>
  <div id="prog"></div>
  <div id="cap"></div>
  <div id="wipe"></div>
  <div id="flash"></div>
  <div class="vig"></div>
</div>
<script>
const D = window.__DATA__;
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eo5=t=>1-Math.pow(1-clamp(t),5);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const P=(t,a,d)=>clamp((t-a)/d);
function st(el,o){for(const k in o) el.style[k]=o[k];}
function pop(el,t,a,d=.45,from=.6){const p=P(t,a,d);st(el,{opacity:clamp(p*3),transform:`scale(${lerp(from,1,back(p))})`});}
function rise(el,t,a,d=.5,dy=60){const p=eo(P(t,a,d));st(el,{opacity:p,transform:`translateY(${(1-p)*dy}px)`,filter:`blur(${(1-p)*10}px)`});}
function typed(el,txt,t,a,cps=26){const n=Math.floor(clamp((t-a)*cps,0,txt.length));el.textContent=txt.slice(0,n);return n<txt.length;}
function mk(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
const scenesEl=$('#scenes');

/* ---------- content ---------- */
const PROMPT='Turn this video script into 5 posts: an Instagram caption, a 5-slide carousel, a LinkedIn post, a 4-post X thread and a short email. Keep each one simple. Script: [paste]';
const OUTS=['Caption','Carousel','LinkedIn','X thread','Email'];
const CHECK=`<svg width="30" height="30" viewBox="0 0 26 26"><path d="M4 14l6 6L22 6" stroke="#22E06F" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- HOOK (cover frame) ---------- */
const hook=mk(`<div class="scene" id="s-hook">
  <div class="abs mono" id="h-tag" style="top:250px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)">LOCAL BUSINESS? CHECK THIS</div>
  <div class="abs" id="h-n" style="top:300px;left:0;right:0;text-align:center;font-family:Mont;font-weight:900;font-size:560px;line-height:1;letter-spacing:-.06em;background:linear-gradient(180deg,#fff 30%,#22E06F);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 20px 80px rgba(34,224,111,.35))">1</div>
  <div class="abs title" id="h-t1" style="top:860px;left:0;right:0;text-align:center;font-size:118px">SETTING</div>
  <div class="abs" id="h-t2" style="top:990px;left:0;right:0;text-align:center;font-family:ISerif;font-size:92px;color:#D8E0DA">is wasting your ad budget</div>
  <div class="abs" id="h-list" style="top:1140px;left:40px;right:40px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px">
    ${['Why it happens','The fix','Where to find it'].map((a,i)=>`<div class="pill ghost" style="font-size:29px;padding:8px 22px 8px 8px;gap:10px"><span class="tile" style="width:46px;height:46px;border-radius:23px;font:700 20px Mono">${String(i+1).padStart(2,'0')}</span>${a}</div>`).join('')}</div>
  <div class="abs pill" id="h-save" style="top:1400px;left:50%;margin-left:-160px;width:320px;justify-content:center;background:var(--lime);color:#030403;font-size:34px;font-weight:900">
    <svg width="30" height="36" viewBox="0 0 30 36"><path d="M3 2h24v32l-12-8-12 8z" fill="#030403"/></svg> SAVE THIS</div>
</div>`);
scenesEl.appendChild(hook);

/* ---------- item scene shell (same layout as the tool scenes) ---------- */
const CARD_TOP=760, CARD_H=640;
function itemScene(key,idx,tileTxt,name,pillTxt,monoTxt,one,pillMuted){
  const s=mk(`<div class="scene" id="s-${key}">
    <div class="abs mono s-idx" style="top:230px;left:90px;font-size:32px;color:var(--lime)">${idx}</div>
    <div class="abs s-logo" style="top:292px;left:90px"><span class="tile" style="width:132px;height:132px;border-radius:34px;font-size:${tileTxt.length>2?50:68}px">${tileTxt}</span></div>
    <div class="abs title s-name" style="top:300px;left:252px;font-size:${name.length>11?96:112}px">${name}</div>
    <div class="abs s-by" style="top:430px;left:90px;display:flex;gap:16px;align-items:center">
      <span class="pill" style="background:${pillMuted?'rgba(255,255,255,.14)':'var(--lime)'};color:${pillMuted?'#fff':'#030403'};font-size:28px;padding:10px 22px;font-weight:900">${pillTxt}</span>
      <span class="mono" style="font-size:30px;color:var(--muted)">${monoTxt}</span></div>
    <div class="abs sub s-one" style="top:540px;left:90px;right:90px;font-size:56px;font-weight:700;color:#fff">${one}</div>
    <div class="card s-card" style="top:${CARD_TOP}px;height:${CARD_H}px"><div class="abs" style="inset:0;background:radial-gradient(600px 300px at 80% 0%,#0E7A3C55,transparent 70%)"></div><div class="abs s-ui" style="inset:0"></div></div>
  </div>`);
  scenesEl.appendChild(s); return s;
}

const PIN=(c)=>`<svg width="44" height="58" viewBox="0 0 44 58"><path d="M22 2C11 2 3 10 3 21c0 14 19 34 19 34s19-20 19-34C41 10 33 2 22 2z" fill="${c}" stroke="#030403" stroke-width="3"/><circle cx="22" cy="21" r="7" fill="#030403"/></svg>`;
const MAP=`<svg class="abs" style="left:0;top:0" width="900" height="640" viewBox="0 0 900 640">
  <path d="M-20 470 C 180 430, 330 520, 520 470 S 820 420, 940 450" stroke="rgba(255,255,255,.10)" stroke-width="26" fill="none"/>
  <path d="M120 -10 L 260 650 M 560 -10 L 470 650 M -10 210 L 910 160" stroke="rgba(255,255,255,.07)" stroke-width="8" fill="none"/></svg>`;
const AWAY=[[640,110,'Ottawa'],[760,260,'Montreal'],[600,430,'Buffalo'],[110,380,'London'],[720,520,'Kingston'],[90,120,'Barrie']];

// 1) Why it happens: the default includes people far away
const SH=itemScene('how','STEP 01 · WHY IT HAPPENS','?','The default','PRESENCE OR INTEREST','WHAT MOST CAMPAIGNS USE','Includes people <b>far away</b>.',true);
$('.s-ui',SH).innerHTML=MAP+`
 <div class="abs m-c" style="left:200px;top:180px;width:260px;height:260px;border-radius:50%;background:rgba(34,224,111,.16);border:4px solid #22E06F;box-shadow:0 0 60px rgba(34,224,111,.4);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px"><span style="font:900 34px Mont">Toronto</span><span class="mono" style="font-size:20px;color:#8E9890">YOUR AREA</span></div>
 ${AWAY.map(([x,y,n])=>`<div class="abs m-p" style="left:${x}px;top:${y}px;display:flex;flex-direction:column;align-items:center;gap:2px">${PIN('#C8D0CA')}<span class="mono" style="font-size:20px;color:#C8D0CA">${n}</span></div>`).join('')}
 <div class="abs mono m-l" style="left:40px;bottom:30px;font-size:24px;color:#8E9890">EXAMPLE · PINS = PEOPLE WHO SAW YOUR AD</div>`;

// 2) What it costs: a click from hours away
const SB=itemScene('bad','STEP 02 · WHAT IT COSTS','$','Wasted click','CAN\'T BUY','YOU STILL PAY','Clicks from <b>hours away</b>.',true);
$('.s-ui',SB).innerHTML=`
 <div class="abs b-ph" style="left:60px;top:60px;width:300px;height:520px;border-radius:40px;background:#0A0D0B;border:6px solid #1C231F;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5);padding:26px 20px">
  <div style="height:64px;border-radius:32px;background:#F5F8F6;color:#0B1A10;display:flex;align-items:center;padding:0 22px;font:600 26px Inter"><span class="b-q"></span></div>
  <div class="b-ad" style="margin-top:22px;border-radius:22px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);padding:20px">
   <div class="mono" style="font-size:18px;color:#8E9890">SPONSORED · EXAMPLE</div>
   <div style="margin-top:8px;font:800 30px/1.15 Inter">Maple Plumbing · Toronto</div>
   <div style="margin-top:8px;font:500 22px/1.3 Inter;color:#C8D0CA">24/7 emergency plumber</div></div>
  <svg class="abs b-tap" style="left:170px;top:250px" width="70" height="80" viewBox="0 0 70 80"><path d="M6 4 L6 62 L22 48 L34 74 L46 68 L34 43 L56 43 Z" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round"/></svg>
  <div class="abs b-cost" style="left:20px;right:20px;bottom:30px;text-align:center;font:900 54px Mont;color:#fff">−$4.10</div></div>
 <div class="abs" style="left:410px;right:50px;top:80px">
  <div class="mono" style="font-size:24px;color:#8E9890">SEARCHING FROM</div>
  <div class="b-km" style="font:900 100px Mont;line-height:1.05;white-space:nowrap">0 km</div>
  <div style="font:700 36px Inter;color:#C8D0CA">from your shop</div>
  <div class="b-no" style="margin-top:46px;display:flex;align-items:center;gap:18px;font:900 54px Mont">Can't hire you</div></div>`;

// 3) The fix: switch to Presence
const OPT=(t,d,cls)=>`<div class="g-r ${cls}" style="display:flex;gap:24px;align-items:flex-start;padding:26px 28px;border-radius:24px;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)"><span class="g-dot" style="flex:none;width:44px;height:44px;border-radius:50%;border:4px solid #8A938C;display:flex;align-items:center;justify-content:center"><i style="width:20px;height:20px;border-radius:50%;background:#22E06F;opacity:0"></i></span><div><div style="font:800 36px Inter">${t}</div><div style="margin-top:6px;font:500 26px/1.35 Inter;color:#A9B2AB">${d}</div></div></div>`;
const SG=itemScene('good','STEP 03 · THE FIX','✓','Presence','THE FIX','IN OR REGULARLY IN YOUR AREA','Only people who <b>can buy</b>.');
$('.s-ui',SG).innerHTML=`
 <div class="abs" style="left:50px;right:50px;top:44px;display:flex;justify-content:space-between;align-items:baseline"><span style="font:800 34px Inter">Location options</span><span class="mono" style="font-size:22px;color:#8E9890">INCLUDE · EXAMPLE</span></div>
 <div class="abs" style="left:50px;right:50px;top:110px;display:flex;flex-direction:column;gap:18px">
  ${OPT('Presence or interest','People in, regularly in, or who\'ve shown interest in your locations','g-a')}
  ${OPT('Presence','People in or regularly in your locations','g-b')}</div>
 <div class="abs g-ok" style="left:50px;bottom:44px;display:flex;align-items:center;gap:14px;font:800 32px Inter;color:#DDE3DF">${CHECK} Ads in other cities: off</div>`;

// 4) Where to find it
const STEPS=['Campaign','Settings','Locations','Location options'];
const SF=itemScene('find','STEP 04 · WHERE TO FIND IT','4','Find it','2 MINUTES','IN EACH CAMPAIGN','Four taps to <b>fix it</b>.');
$('.s-ui',SF).innerHTML=`<div class="abs" style="left:90px;right:90px;top:60px;display:flex;flex-direction:column;gap:20px">
 ${STEPS.map((x,i)=>`<div class="f-s" style="display:flex;align-items:center;gap:24px;padding:22px 28px;border-radius:24px;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)"><span class="tile" style="width:64px;height:64px;border-radius:18px;font:700 26px Mono">${String(i+1).padStart(2,'0')}</span><span style="font:800 42px Inter">${x}</span></div>`).join('')}</div>`;

// 5) Every campaign
const CAMPS=['Search · Emergency plumbing','Search · Drain cleaning','Performance Max · All services'];
const E1=itemScene('e1','ALSO CHECK · 1 / 2','✓✓','Every campaign','CHECK ALL','SET PER CAMPAIGN','Each one has <b>its own</b> setting.');
$('.s-ui',E1).innerHTML=`<div class="abs mono" style="left:50px;top:44px;font-size:22px;color:#8E9890">CAMPAIGNS · EXAMPLE</div>
 <div class="abs" style="left:50px;right:50px;top:100px;display:flex;flex-direction:column;gap:20px">
 ${CAMPS.map(c=>`<div class="c-r" style="display:flex;justify-content:space-between;align-items:center;padding:30px 30px;border-radius:24px;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)"><span style="font:800 34px Inter">${c}</span><span class="c-st pill" style="font-size:24px;padding:10px 20px;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap">Presence or interest</span></div>`).join('')}</div>`;

// 6) The exception
const E2=itemScene('e2','ALSO CHECK · 2 / 2','!','The exception','KEEP DEFAULT','IF YOU SELL TO VISITORS','Hotels, tours, <b>venues</b>.',true);
$('.s-ui',E2).innerHTML=`
 <div class="abs" style="left:50px;top:50px;width:380px"><div class="mono" style="font-size:24px;color:var(--lime)">SWITCH TO PRESENCE</div>
  ${['Plumber','Dentist','Restaurant','Hair salon'].map(x=>`<div class="x-a" style="margin-top:18px;display:flex;gap:14px;align-items:center;font:800 36px Inter">${CHECK}${x}</div>`).join('')}</div>
 <div class="abs" style="left:470px;top:50px;width:380px"><div class="mono" style="font-size:24px;color:#C8D0CA">KEEP THE DEFAULT</div>
  ${['Hotel','Tour company','Wedding venue'].map(x=>`<div class="x-b" style="margin-top:18px;display:flex;gap:14px;align-items:center;font:800 36px Inter;color:#DDE3DF"><span style="width:30px;text-align:center;font:900 30px Mont">•</span>${x}</div>`).join('')}</div>
 <div class="abs x-n" style="left:50px;right:50px;bottom:44px;font:600 30px/1.35 Inter;color:#A9B2AB">People plan these trips from far away, so interest in your area counts.</div>`;
const ANGLES=['Settings','Locations','Location options','Presence','Every campaign','Check today'];

/* ---------- CTA ---------- */
const cta=mk(`<div class="scene" id="s-cta">
  <div class="abs mono" style="top:250px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)" id="c-tag">CHECK THIS SETTING TODAY</div>
  <div class="abs" id="c-grid" style="top:330px;left:90px;right:90px;display:grid;grid-template-columns:1fr 1fr;gap:20px">
   ${ANGLES.map((a,i)=>`<div class="c-g ghost" style="border-radius:28px;padding:18px 26px;display:flex;align-items:center;gap:20px"><span class="tile" style="width:64px;height:64px;border-radius:18px;font:700 26px Mono">${String(i+1).padStart(2,'0')}</span><span style="font:800 38px Inter">${a}</span></div>`).join('')}</div>
  <div class="abs title" id="c-t" style="top:1010px;left:0;right:0;text-align:center;font-size:110px">Follow for more</div>
  <div class="abs" id="c-s" style="top:1135px;left:0;right:0;text-align:center;font-family:ISerif;font-size:80px;color:#D8E0DA">send this to a local business owner</div>
  <div class="abs pill" id="c-btn" style="top:1290px;left:50%;width:380px;margin-left:-190px;height:110px;justify-content:center;font-size:44px;font-weight:900;background:var(--lime);color:#030403">Follow</div>
  <svg class="abs" id="c-cur" style="top:1352px;left:700px" width="70" height="80" viewBox="0 0 70 80"><path d="M6 4 L6 62 L22 48 L34 74 L46 68 L34 43 L56 43 Z" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round"/></svg>
</div>`);
scenesEl.appendChild(cta);

/* ---------- THESIS: takes over from the cover at 1.4s and finishes the opening line ---------- */
const HOOK_HOLD=1.4;
const thesis=mk(`<div class="scene" id="s-thesis">
  <div class="abs mono" id="t-tag" style="top:470px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)">THE REAL PROBLEM</div>
  <div class="abs" id="t-q" style="top:560px;left:90px;right:90px;text-align:center;font:900 92px/1 Mont;letter-spacing:-.03em;text-transform:uppercase">Other <span style="color:var(--lime)">cities?</span></div>
  <div class="abs" id="t-s1" style="top:760px;left:70px;right:70px;text-align:center;font:900 116px/.98 Mont;letter-spacing:-.035em;text-transform:uppercase;background:linear-gradient(180deg,#fff 35%,#22E06F);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 20px 60px rgba(34,224,111,.35))">You pay for every click.</div>
  <div class="abs" id="t-s2" style="top:1090px;left:60px;right:60px;text-align:center;font-family:ISerif;font-size:92px;color:#D8E0DA">from people who can't buy</div>
</div>`);
scenesEl.appendChild(thesis);
function renderThesis(t,el){const w=segBy.hook.words; const a1=w[11].s-HOOK_HOLD-.05, a2=w[15].s-HOOK_HOLD-.05;
  rise($('#t-tag',el),t,0,.3,20);
  const q=$('#t-q',el); const pq=eo5(P(t,0,.35)); st(q,{opacity:clamp(pq*2)*(t>a1?lerp(1,.35,eo(P(t,a1,.3))):1),transform:`scale(${lerp(1.15,1,pq)})`});
  const p1=eo5(P(t,a1,.4)); st($('#t-s1',el),{opacity:clamp(p1*2),transform:`scale(${lerp(1.25,1,p1)})`});
  const s1=$('#t-s1',el); $('#t-s2',el).style.top=(s1.offsetTop+s1.offsetHeight+36)+'px';
  rise($('#t-s2',el),t,a2,.45,30);
}

/* ---------- timeline (voice-driven) ---------- */
const S=D.segs, segBy=Object.fromEntries(S.map(s=>[s.key,s]));
const LEAD=0.18;
const order=['hook','thesis','how','bad','good','find','e1','e2','cta'];
const els={hook,thesis,how:SH,bad:SB,good:SG,find:SF,e1:E1,e2:E2,cta};
const starts=order.map((k,i)=>i===0?0:k==='thesis'?HOOK_HOLD:segBy[k].start-LEAD);
const END=D.end;
const TR=0.42;
const TRTYPE=['zoom','whip','zoom','whip','wipe','whip','zoom','wipe'];
const NSEG=order.length-3;
for(let i=0;i<NSEG;i++) $('#prog').appendChild(mk('<div class="seg"><i></i></div>'));

/* captions from the real word timings */
const capWords=[];

function renderBg(t){
  st($('#b1'),{left:`${300+Math.sin(t*.35)*180}px`,top:`${200+Math.cos(t*.28)*160}px`});

function sceneTransform(idx,t){
  const a=starts[idx], b=idx+1<order.length?starts[idx+1]:END+5;
  if(t<a-TR*0.5||t>b+TR*0.5) return null;
  let tr='',f='',o=1;
  if(idx>0&&t<a+TR*0.5){const p=eio((t-(a-TR*0.5))/TR);const ty=TRTYPE[idx-1];
    if(ty==='whip'){tr=`translateX(${(1-p)*1100}px)`;f=`blur(${(1-p)*(1-p)*40}px)`;}
    if(ty==='zoom'){tr=`scale(${lerp(.55,1,p)})`;f=`blur(${(1-p)*30}px)`;o=clamp(p*2);}
    if(ty==='wipe'){tr=`translateY(${(1-p)*400}px) scale(${lerp(1.1,1,p)})`;o=p>0.5?1:0;}
  }
  if(idx+1<order.length&&t>b-TR*0.5){const p=eio((t-(b-TR*0.5))/TR);const ty=TRTYPE[idx];
    if(ty==='whip'){tr=`translateX(${-p*1100}px)`;f=`blur(${p*p*40}px)`;}
    if(ty==='zoom'){tr=`scale(${lerp(1,2.2,p)})`;f=`blur(${p*30}px)`;o=1-clamp(p*1.6);}
    if(ty==='wipe'){tr=`translateY(${-p*400}px)`;o=p<0.5?1:0;}
  }
  const life=t-a; tr+=` scale(${1+clamp(life/6)*0.03})`;
  return {tr,f,o};
}

window.seek=function(t){
  renderBg(t);
  order.forEach((k,idx)=>{const el=els[k];const tf=sceneTransform(idx,t);
    if(!tf){el.style.display='none';return;} el.style.display='block';
    st(el,{transform:tf.tr,filter:tf.f||'none',opacity:tf.o});
    const lt=t-starts[idx];
    if(k==='hook')renderHook(lt,el); else if(k==='thesis')renderThesis(lt,el); else if(k==='cta')renderCta(lt,el);
    else if(k==='how')renderHow(lt,el); else if(k==='bad')renderBad(lt,el); else if(k==='good')renderGood(lt,el);
    else if(k==='find')renderFind(lt,el); else renderEx(['e1','e2'].indexOf(k),lt,el);
  });
  [...$('#prog').children].forEach((s,i)=>{const a=starts[i+2],b=starts[i+3];s.firstChild.style.width=`${clamp((t-a)/(b-a))*100}%`;});
  const pv=t<starts[2]-.2?0:t<starts[2]+.2?eo(P(t,starts[2]-.2,.4)):(t>starts[order.length-1]?1-eo(P(t,starts[order.length-1],.3)):1); st($('#prog'),{opacity:pv});
  const cap=$('#cap'); const ch=chunks.find(c=>t>=c[0].s-.05&&t<c[c.length-1].e+.08);
  if(!ch){cap.innerHTML='';} else {
    const pin=eo5(P(t,ch[0].s-.05,.18));
    cap.innerHTML=ch.map(w=>{const on=t>=w.s&&t<w.e+.05; return `<span style="color:${on?'#22E06F':'#fff'};transform:scale(${on?1.08:1})">${w.w}</span>`}).join(' ');
    st(cap,{transform:`translateY(${(1-pin)*30}px) scale(${lerp(.9,1,pin)})`,opacity:pin});
    if(ch[0].seg==='hook'||ch[0].seg==='cta') cap.style.opacity=0;
  }
  let fl=0, wy=-2400;
  for(let i=1;i<order.length;i++){const b=starts[i];const d=t-b;
    if(Math.abs(d)<.12) fl=Math.max(fl,(1-Math.abs(d)/.12)*(TRTYPE[i-1]==='zoom'?.55:.3));
    if(TRTYPE[i-1]==='wipe'&&Math.abs(d)<TR*0.5){const p=eio((d+TR*.5)/TR); wy=lerp(1920,-2400,p);}
  }
  $('#flash').style.opacity=fl; $('#wipe').style.top=`${wy}px`;
  return true;
};
