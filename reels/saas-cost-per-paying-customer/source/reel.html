<!doctype html>
<html><head><meta charset="utf-8">
<!-- Day 12: find wasted Google Ads spend in 5 minutes with AI. Pain, Poke, Fix, Payoff, Recap, CTA. Built from reels/_brand/reference_reel.html (house look). -->
<style>
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
@font-face{font-family:Mont;src:url(fonts/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/SpaceMono-Bold.ttf)}
@font-face{font-family:ISerif;src:url(fonts/InstrumentSerif-Italic.ttf);font-style:normal;font-weight:400}
:root{
  --ink:#030403; --ink2:#0A0D0B; --line:rgba(255,255,255,.08);
  --text:#F5F8F6; --muted:#8A938C; --lime:#22E06F; --violet:#0E7A3C; --deep:#06331A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
body{font-family:Inter,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-200px}
.blob{position:absolute;border-radius:50%;filter:blur(140px);opacity:.42}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 45%,#000 30%,transparent 80%);opacity:.55}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.65) 100%);pointer-events:none}
.scene{position:absolute;inset:0;will-change:transform,filter,opacity}
.abs{position:absolute}
.mono{font-family:Mono,monospace;letter-spacing:.04em}
#prog{position:absolute;top:118px;left:90px;right:90px;display:flex;gap:12px}
#prog .seg{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
#prog .seg i{display:block;height:100%;width:0;background:var(--lime);border-radius:8px;box-shadow:0 0 18px var(--lime)}
.card{position:absolute;left:90px;width:900px;border-radius:44px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14);box-shadow:0 40px 120px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(30px);overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:12px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:30px}
.title{font-family:Mont;font-weight:900;font-size:128px;line-height:.92;letter-spacing:-.035em}
.sub{font-size:44px;font-weight:500;color:#C8D0CA;line-height:1.25}
.sub b{color:var(--lime);font-weight:800}
.bar{height:22px;border-radius:12px;background:rgba(255,255,255,.14)}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-family:Mont;font-weight:900;font-size:66px;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase}
#cap span{display:inline-block;margin:0 10px;text-shadow:0 6px 30px rgba(0,0,0,.7)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:overlay}
#wipe{position:absolute;left:0;right:0;height:2400px;top:-2400px;background:var(--lime)}
.ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16)}
.tile{display:inline-flex;align-items:center;justify-content:center;flex:none;background:#fff;color:#030403;font-family:Mont;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style></head>
<body><div id="stage">
  <div class="bg" id="bg">
    <div class="blob" id="b1" style="width:900px;height:900px;background:var(--violet)"></div>
    <div class="blob" id="b2" style="width:800px;height:800px;background:var(--deep)"></div>
    <div class="blob" id="b3" style="width:600px;height:600px;background:var(--lime);opacity:.18"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="scenes"></div>
  <div id="prog"></div>
  <div id="cap"></div>
  <div id="wipe"></div>
  <div id="flash"></div>
  <div class="vig"></div>
</div>
<script>
const D = window.__DATA__;
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eo5=t=>1-Math.pow(1-clamp(t),5);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const P=(t,a,d)=>clamp((t-a)/d);
function st(el,o){for(const k in o) el.style[k]=o[k];}
function pop(el,t,a,d=.45,from=.6){const p=P(t,a,d);st(el,{opacity:clamp(p*3),transform:`scale(${lerp(from,1,back(p))})`});}
function rise(el,t,a,d=.5,dy=60){const p=eo(P(t,a,d));st(el,{opacity:p,transform:`translateY(${(1-p)*dy}px)`,filter:`blur(${(1-p)*10}px)`});}
function typed(el,txt,t,a,cps=26){const n=Math.floor(clamp((t-a)*cps,0,txt.length));el.textContent=txt.slice(0,n);return n<txt.length;}
function mk(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
const scenesEl=$('#scenes');

/* ---------- content ---------- */
const LOGO_GADS=`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><line x1="56" y1="150" x2="102" y2="56" stroke="#FBBC04" stroke-width="46" stroke-linecap="round"/><line x1="102" y1="56" x2="148" y2="150" stroke="#4285F4" stroke-width="46" stroke-linecap="round"/><circle cx="56" cy="150" r="25" fill="#34A853"/></svg>`;
const LOGO_AI=`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#030403" d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/></svg>`;
let _gid=0;
const LT=(svg,size,r)=>{const id='g'+(++_gid);return `<span class="tile" style="width:${size}px;height:${size}px;border-radius:${r}px;padding:${Math.round(size*.17)}px;background:#fff">${svg.replace(/igg/g,id)}</span>`;};
const CHECK=`<svg width="30" height="30" viewBox="0 0 26 26"><path d="M4 14l6 6L22 6" stroke="#22E06F" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const XMARK=`<svg width="30" height="30" viewBox="0 0 26 26"><path d="M6 6l14 14M20 6L6 20" stroke="#C8D0CA" stroke-width="4.5" stroke-linecap="round"/></svg>`;
const W=(seg,re)=>{const w=segBy[seg].words.find(x=>re.test(x.w));return w?w.s:null;};
const TERMS=[['emergency plumber toronto','$64.20',0],['plumber jobs near me','$41.10','JOBS'],['blocked drain repair','$38.90',0],['free plumbing course','$27.40','FREE'],['how to fix a leaky tap diy','$22.80','DIY'],['24 hour plumber','$51.30',0],['plumber salary ontario','$19.60','JOBS'],['water heater install','$44.70',0],['plumbing apprenticeship','$16.90','JOBS'],['toilet repair near me','$33.10',0],['free drain snake rental','$12.40','FREE'],['diy pipe repair kit','$18.20','DIY']];
const ROW=(q,c,cls='',extra='')=>`<div class="${cls}" style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 22px;border-radius:16px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);font:700 28px Inter;white-space:nowrap" ${extra}><span>${q}</span><span style="font:800 28px Inter;color:#C8D0CA">${c}</span></div>`;

/* ---------- 1) PAIN: frame 1 is already scrolling a long search terms sheet ---------- */
const pain=mk(`<div class="scene" id="s-pain">
  <div class="abs" id="p-big" style="top:215px;left:30px;right:30px;text-align:center;font:900 72px/1.02 Mont;white-space:nowrap;letter-spacing:-.035em;text-transform:uppercase">Still checking this<br><span style="color:var(--lime)">by hand?</span></div>
  <div class="card" id="p-card" style="top:450px;height:820px;left:70px;width:940px">
    <div class="abs" style="left:36px;top:30px;display:flex;align-items:center;gap:14px">${LT(LOGO_GADS,52,14)}<div><div style="font:800 30px Inter">Search terms</div><div class="mono" style="font-size:20px;color:#8E9890">1,248 ROWS · EXAMPLE</div></div></div>
    <div class="abs" style="left:36px;right:36px;top:120px;height:520px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30px,#000 calc(100% - 50px),transparent)"><div class="p-rows" style="display:flex;flex-direction:column;gap:10px">${[...TERMS,...TERMS,...TERMS].map(([q,c])=>ROW(q,c)).join('')}</div></div>
    <div class="abs" style="left:36px;right:36px;bottom:36px;display:flex;justify-content:space-between;align-items:baseline"><span class="mono" style="font-size:24px;color:#8E9890">TIME SPENT EVERY WEEK</span><span class="p-n" style="font:900 86px Mont;font-variant-numeric:tabular-nums">0 min</span></div>
  </div>
  <div class="abs pill" id="p-topic" style="top:1300px;left:0;right:0;margin:0 auto;width:fit-content;background:var(--lime);color:#030403;font-size:36px;font-weight:900;white-space:nowrap;box-shadow:0 0 40px rgba(34,224,111,.6);opacity:0">AI DOES IT IN 5 MINUTES ↓</div>
</div>`);
scenesEl.appendChild(pain);
function renderPain(t,el){
  const wk=W('pain',/^week/)||2.1, hr=(W('pain',/^Here/)||2.7)-.05;
  const pb=eo5(P(t,0,.35)); st($('#p-big',el),{transform:`scale(${lerp(1.08,1,pb)})`,opacity:1});
  st($('#p-card',el),{opacity:1,transform:`translateY(${(1-eo(P(t,0,.35)))*40}px)`});
  $('.p-rows',el).style.transform=`translateY(${-((t*620)%(TERMS.length*67))}px)`;
  const m=Math.round(90*eo(P(t,0,wk+.1))); $('.p-n',el).textContent=m+' min';
  const land=P(t,wk,.3); $('.p-n',el).style.transform=`scale(${1+Math.sin(land*Math.PI)*.12})`;
  pop($('#p-topic',el),t,hr,.45,.6);
}

/* ---------- item scenes ---------- */
/* ---------- item scene shell (same layout as the tool scenes) ---------- */
const CARD_TOP=760, CARD_H=640;
function itemScene(key,idx,tileTxt,name,pillTxt,monoTxt,one,pillMuted){
  const s=mk(`<div class="scene" id="s-${key}">
    <div class="abs mono s-idx" style="top:230px;left:90px;font-size:32px;color:var(--lime)">${idx}</div>
    <div class="abs s-logo" style="top:292px;left:90px">${tileTxt.startsWith('<svg')?LT(tileTxt,132,34):`<span class="tile" style="width:132px;height:132px;border-radius:34px;font-size:${tileTxt.length>2?50:68}px">${tileTxt}</span>`}</div>
    <div class="abs title s-name" style="top:300px;left:252px;font-size:${name.length>12?80:name.length>11?96:112}px">${name}</div>
    <div class="abs s-by" style="top:430px;left:90px;display:flex;gap:16px;align-items:center">
      <span class="pill" style="background:${pillMuted?'rgba(255,255,255,.14)':'var(--lime)'};color:${pillMuted?'#fff':'#030403'};font-size:28px;padding:10px 22px;font-weight:900">${pillTxt}</span>
      <span class="mono" style="font-size:30px;color:var(--muted)">${monoTxt}</span></div>
    <div class="abs sub s-one" style="top:540px;left:90px;right:90px;font-size:56px;font-weight:700;color:#fff">${one}</div>
    <div class="card s-card" style="top:${CARD_TOP}px;height:${CARD_H}px"><div class="abs" style="inset:0;background:radial-gradient(600px 300px at 80% 0%,#0E7A3C55,transparent 70%)"></div><div class="abs s-ui" style="inset:0"></div></div>
  </div>`);
  scenesEl.appendChild(s); return s;
}





// 2) POKE: the junk hides in the rows
const SPK=itemScene('poke','WHY IT HURTS',LOGO_GADS,'Hidden junk','EATS YOUR BUDGET','EVERY SINGLE WEEK','Junk hides in <b>hundreds of rows</b>.',true);
$('.s-ui',SPK).innerHTML=`
 <div class="abs" style="left:40px;right:40px;top:36px;display:flex;flex-direction:column;gap:10px">${TERMS.slice(0,6).map(([q,c,j])=>ROW(q,c,'k-r',`data-j="${j||''}"`)).join('')}</div>
 <div class="abs" style="left:50px;right:50px;bottom:36px;display:flex;justify-content:space-between;align-items:baseline"><span class="mono" style="font-size:24px;color:#8E9890">WASTED THIS WEEK · EXAMPLE</span><span class="k-w" style="font:900 72px Mont;font-variant-numeric:tabular-nums">$0</span></div>`;

// 3) FIX intro: one export, one prompt
const fix0=mk(`<div class="scene" id="s-fix0">
  <div class="abs mono" id="f-tag" style="top:420px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)">THE FIX</div>
  <div class="abs" id="f-big" style="top:490px;left:60px;right:60px;text-align:center;font:900 120px/.96 Mont;letter-spacing:-.035em;text-transform:uppercase">1 export.<br>1 <span style="color:var(--lime)">prompt.</span></div>
  <div class="abs" id="f-flow" style="left:0;right:0;top:860px;display:flex;justify-content:center;align-items:center;gap:40px">
    <div class="f-c" style="display:flex;align-items:center;gap:16px;padding:20px 30px;border-radius:24px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16)">${LT(LOGO_GADS,64,18)}<span style="font:800 36px Inter">.CSV</span></div>
    <span class="f-c" style="font:900 60px Mont;color:var(--lime)">→</span>
    <div class="f-c" style="display:flex;align-items:center;gap:16px;padding:20px 30px;border-radius:24px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16)">${LT(LOGO_AI,64,18)}<span style="font:800 36px Inter">ChatGPT</span></div>
  </div>
</div>`);
scenesEl.appendChild(fix0);

// 4-6) three steps
const PROMPT='List the search terms that are clearly not customers. Group them by theme and suggest negative keywords.';
const THEMES=[['JOBS','jobs · salary · apprenticeship'],['FREE','free · rental'],['DIY','diy · how to fix']];
const NEG=[['jobs',1],['salary',1],['free',1],['diy',1],['emergency',0]];
const FX=[
 {k:'fix1',logo:LOGO_GADS,name:'Download',pill:'.CSV',mono:'SEARCH TERMS → DOWNLOAD',one:'Download the <b>search terms report</b>.',cue:/^C$/,
  html:`<div class="abs" style="left:50px;right:50px;top:50px;padding:28px;border-radius:24px;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.16)">
     <div style="display:flex;align-items:center;gap:14px">${LT(LOGO_GADS,48,13)}<div><div style="font:800 34px Inter">Search terms report</div><div class="mono" style="font-size:20px;color:#8E9890">LAST 30 DAYS · EXAMPLE</div></div>
       <span class="x-btn pill" style="margin-left:auto;background:var(--lime);color:#030403;font-size:28px;font-weight:900">Download ↓</span></div></div>
   <div class="abs x-chip" style="left:50px;top:250px;display:flex;align-items:center;gap:16px;padding:22px 28px;border-radius:22px;background:rgba(34,224,111,.12);border:3px solid #22E06F"><span style="font:900 40px Mont;color:var(--lime)">CSV</span><span style="font:800 34px Inter">search_terms.csv</span></div>
   <div class="abs x-note" style="left:50px;top:380px;font:600 28px Inter;color:#A9B2AB">Remove client names before you upload.</div>`},
 {k:'fix2',logo:LOGO_AI,name:'Run the prompt',pill:'CHATGPT',mono:'UPLOAD + PROMPT',one:'AI groups the junk <b>by theme</b>.',cue:/^groups/,
  html:`<div class="abs" style="left:50px;right:50px;top:40px;padding:22px 26px;border-radius:24px;background:rgba(0,0,0,.35);border:1.5px solid rgba(34,224,111,.5)">
     <div style="display:flex;align-items:center;gap:12px"><span class="pill" style="font-size:22px;padding:6px 16px;background:rgba(255,255,255,.12);color:#fff">📎 search_terms.csv</span><span class="mono" style="font-size:20px;color:var(--lime)">PROMPT</span></div>
     <div style="margin-top:12px;font:600 30px/1.35 Inter"><span class="x-typ"></span></div></div>
   <div class="abs" style="left:50px;right:50px;top:300px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px">${THEMES.map(([h,ex])=>`<div class="x-th" style="padding:18px 20px;border-radius:20px;background:rgba(34,224,111,.12);border:2px solid #22E06F"><div style="font:900 36px Mont;color:var(--lime)">${h}</div><div style="margin-top:6px;font:600 22px Inter;color:#C8D0CA">${ex}</div></div>`).join('')}</div>`},
 {k:'fix3',logo:LOGO_GADS,name:'Check, then add',pill:'YOU DECIDE',mono:'KEYWORDS → NEGATIVE KEYWORDS',one:'One wrong negative can <b>block customers</b>.',cue:/^One/,
  html:`<div class="abs mono" style="left:50px;top:40px;font-size:22px;color:#8E9890">SUGGESTED NEGATIVES · EXAMPLE</div>
   <div class="abs" style="left:50px;right:50px;top:90px;display:flex;flex-direction:column;gap:12px">${NEG.map(([n,ok])=>`<div class="x-n" data-ok="${ok}" style="display:flex;align-items:center;gap:16px;padding:14px 22px;border-radius:18px;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)"><span class="x-ic" style="width:30px;height:30px;display:flex"></span><span style="font:800 32px Inter;flex:1">${n}</span><span class="x-lb mono" style="font-size:20px;color:#8E9890"></span></div>`).join('')}</div>`},
];
const FS=FX.map((F,i)=>{const sc=itemScene(F.k,`STEP 0${i+1} / 03 · ${F.mono}`,F.logo,F.name,F.pill,i===1?'IN CHATGPT':'IN GOOGLE ADS',F.one);
  $('.s-ui',sc).innerHTML=F.html+`
   <div class="abs" style="left:50px;right:50px;bottom:40px">
     <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="mono" style="font-size:22px;color:#8E9890">STEPS DONE</span><span class="r-c" style="font:900 52px Mont;color:var(--lime)">${i}/3</span></div>
     <div style="display:flex;gap:10px;margin-top:12px">${FX.map((_,j)=>`<i class="r-d" data-j="${j}" style="flex:1;height:16px;border-radius:8px;background:${j<i?'#22E06F':'rgba(255,255,255,.14)'}"></i>`).join('')}</div></div>`;
  return sc;});

// 7) PAYOFF: junk blocked, wasted spend to zero
const SPY=itemScene('payoff','THE PAYOFF',LOGO_GADS,'Junk blocked','5 MINUTES','EXAMPLE','Budget goes to <b>real buyers</b>.');
$('.s-ui',SPY).innerHTML=`
 <div class="abs" style="left:40px;right:40px;top:36px;display:flex;flex-direction:column;gap:10px">${TERMS.slice(0,6).map(([q,c,j])=>ROW(q,c,'y-r',`data-j="${j||''}"`)).join('')}</div>
 <div class="abs" style="left:50px;right:50px;bottom:36px;display:flex;justify-content:space-between;align-items:baseline"><span class="mono" style="font-size:24px;color:#8E9890">WASTED NEXT WEEK</span><span class="y-w" style="font:900 72px Mont;color:var(--lime);font-variant-numeric:tabular-nums">$186</span></div>`;

// 8) RECAP
const recap=mk(`<div class="scene" id="s-recap">
  <div class="abs mono" id="r-tag" style="top:330px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)">RECAP · SAVE THIS</div>
  <div class="abs" id="r-big" style="top:400px;left:60px;right:60px;text-align:center;font:900 100px/.96 Mont;letter-spacing:-.035em;text-transform:uppercase">3 steps.<br><span style="color:var(--lime)">5 minutes.</span></div>
  <div class="abs" style="left:90px;right:90px;top:720px;display:flex;flex-direction:column;gap:22px">
   ${['Download the report','Run the prompt','Check, then add negatives'].map(x=>`<div class="r-r" style="display:flex;align-items:center;gap:20px;padding:28px 30px;border-radius:26px;border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06)"><span class="r-b" style="flex:none;width:56px;height:56px;border-radius:16px;border:4px solid #8A938C;display:flex;align-items:center;justify-content:center"></span><span style="font:800 42px Inter">${x}</span></div>`).join('')}</div>
</div>`);
scenesEl.appendChild(recap);
const ANGLES=['Download report','Run the prompt','Check, then add'];

/* ---------- CTA ---------- */
const cta=mk(`<div class="scene" id="s-cta">
  <div class="abs mono" style="top:250px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)" id="c-tag">COMMENT AUDIT FOR THE PROMPT</div>
  <div class="abs" id="c-grid" style="top:330px;left:90px;right:90px;display:grid;grid-template-columns:1fr 1fr;gap:20px">
   ${ANGLES.map((a,i)=>`<div class="c-g ghost" style="border-radius:28px;padding:18px 26px;display:flex;align-items:center;gap:20px${i===2?';grid-column:1/3;justify-content:center':''}"><span class="tile" style="width:64px;height:64px;border-radius:18px;font:700 26px Mono">${String(i+1).padStart(2,'0')}</span><span style="font:800 36px Inter">${a}</span></div>`).join('')}</div>
  <div class="abs title" id="c-t" style="top:1010px;left:0;right:0;text-align:center;font-size:110px">Follow for more</div>
  <div class="abs" id="c-s" style="top:1135px;left:0;right:0;text-align:center;font-family:ISerif;font-size:80px;color:#D8E0DA">send this to a Google Ads user</div>
  <div class="abs pill" id="c-btn" style="top:1290px;left:50%;width:380px;margin-left:-190px;height:110px;justify-content:center;font-size:44px;font-weight:900;background:var(--lime);color:#030403">Follow</div>
  <svg class="abs" id="c-cur" style="top:1352px;left:700px" width="70" height="80" viewBox="0 0 70 80"><path d="M6 4 L6 62 L22 48 L34 74 L46 68 L34 43 L56 43 Z" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round"/></svg>
</div>`);
scenesEl.appendChild(cta);

/* ---------- timeline (voice-driven, no title card) ---------- */
const S=D.segs, segBy=Object.fromEntries(S.map(s=>[s.key,s]));
const LEAD=0.18;
const order=['pain','poke','fix0','fix1','fix2','fix3','payoff','recap','cta'];
const els={pain,poke:SPK,fix0,payoff:SPY,recap,cta}; FS.forEach((e,i)=>els['fix'+(i+1)]=e);
const starts=order.map((k,i)=>i===0?0:segBy[k].start-LEAD);
const END=D.end;
const TR=0.42;
const TRTYPE=['whip','zoom','whip','whip','whip','zoom','wipe','zoom'];
const PB=order.indexOf('fix1'), NP=3;
for(let i=0;i<NP;i++) $('#prog').appendChild(mk('<div class="seg"><i></i></div>'));
const capWords=[];
S.forEach(s=>s.words.forEach((w,k)=>{const nx=s.words[k+1];capWords.push({w:w.w.replace(/[.,]$/,''),s:w.s,e:nx?nx.s:s.start+s.dur,seg:s.key,brk:/[.,!?]$/.test(w.w)});}));
const chunks=[];let cur=[];
capWords.forEach((w,i)=>{cur.push(w);const nx=capWords[i+1];if(cur.length>=3||w.brk||!nx||nx.seg!==w.seg){chunks.push(cur);cur=[];}});
const NOCAP=['pain','fix0','recap','cta'];

function renderBg(t){
  st($('#b1'),{left:`${300+Math.sin(t*.35)*180}px`,top:`${200+Math.cos(t*.28)*160}px`});
  st($('#b2'),{left:`${500+Math.cos(t*.3)*200}px`,top:`${1300+Math.sin(t*.4)*180}px`});
  st($('#b3'),{left:`${100+Math.sin(t*.5+1)*120}px`,top:`${900+Math.cos(t*.45)*200}px`});
  st($('#grid'),{transform:`translateY(${(t*30)%90}px)`});
}
function sceneTransform(idx,t){
  const a=starts[idx], b=idx+1<order.length?starts[idx+1]:END+5;
  if(t<a-TR*0.5||t>b+TR*0.5) return null;
  let tr='',f='',o=1;
  if(idx>0&&t<a+TR*0.5){const p=eio((t-(a-TR*0.5))/TR);const ty=TRTYPE[idx-1];
    if(ty==='whip'){tr=`translateX(${(1-p)*1100}px)`;f=`blur(${(1-p)*(1-p)*40}px)`;}
    if(ty==='zoom'){tr=`scale(${lerp(.55,1,p)})`;f=`blur(${(1-p)*30}px)`;o=clamp(p*2);}
    if(ty==='wipe'){tr=`translateY(${(1-p)*400}px) scale(${lerp(1.1,1,p)})`;o=p>0.5?1:0;}
  }
  if(idx+1<order.length&&t>b-TR*0.5){const p=eio((t-(b-TR*0.5))/TR);const ty=TRTYPE[idx];
    if(ty==='whip'){tr=`translateX(${-p*1100}px)`;f=`blur(${p*p*40}px)`;}
    if(ty==='zoom'){tr=`scale(${lerp(1,2.2,p)})`;f=`blur(${p*30}px)`;o=1-clamp(p*1.6);}
    if(ty==='wipe'){tr=`translateY(${-p*400}px)`;o=p<0.5?1:0;}
  }
  const life=t-a; tr+=` scale(${1+clamp(life/6)*0.03})`;
  return {tr,f,o};
}
function renderItemShell(t,el){
  rise($('.s-idx',el),t,.0,.35,30); pop($('.s-logo',el),t,.02,.45,.3);
  const pn=eo5(P(t,.0,.45)); st($('.s-name',el),{opacity:clamp(pn*2),transform:`translateX(${(1-pn)*-80}px)`,clipPath:`inset(0 ${(1-pn)*100}% 0 0)`});
  rise($('.s-by',el),t,.15,.4,30);
  rise($('.s-one',el),t,.3,.45,40);
  const pc=eo5(P(t,.25,.6)); st($('.s-card',el),{opacity:clamp(pc*2),transform:`translateY(${(1-pc)*160}px) rotateX(${(1-pc)*20}deg) scale(${lerp(.92,1,pc)})`});
}
const sceneStart=k=>starts[order.indexOf(k)];
function renderPoke(t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.45;const s0=sceneStart('poke')+.45;
  const cue={JOBS:W('poke',/^Jobs/)||8.5,FREE:W('poke',/^Free/)||8.9,DIY:W('poke',/^D$/)||9.2};
  $$('.k-r',U).forEach((r,i)=>{rise(r,u,.1+i*.08,.3,20);const j=r.dataset.j;const on=j&&u>=cue[j]-s0;
    r.style.borderColor=on?'rgba(255,255,255,.5)':'rgba(255,255,255,.1)';r.style.background=on?'rgba(255,255,255,.16)':'rgba(255,255,255,.04)';r.style.opacity=on?1:(j?.9:.55);});
  const ea=(W('poke',/^eating/)||11.7)-s0; $('.k-w',U).textContent='$'+Math.round(186*eo(P(u,cue.JOBS-s0,ea-(cue.JOBS-s0)+.3)));
}
function renderFix0(t,el){
  rise($('#f-tag',el),t,0,.3,20);
  const pb=eo5(P(t,.05,.35)); st($('#f-big',el),{opacity:clamp(pb*2),transform:`scale(${lerp(1.2,1,pb)})`});
  $$('.f-c',el).forEach((c,i)=>pop(c,t,.4+i*.15,.35,.5));
}
function renderFix(i,t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.45;const F=FX[i];
  const fx=Math.max(1.2,(W(F.k,F.cue)||0)-sceneStart(F.k)-.45);
  if(i===0){const b=$('.x-btn',U);pop(b,u,.4,.35,.5);b.style.transform+=` scale(${1-Math.sin(P(u,fx-.4,.2)*Math.PI)*.12})`;pop($('.x-chip',U),u,fx,.45,.5);rise($('.x-note',U),u,fx+.5,.4,20);}
  if(i===1){typed($('.x-typ',U),PROMPT,u,.3,60);$$('.x-th',U).forEach((c,j)=>pop(c,u,fx+j*.2,.4,.5));}
  if(i===2){$$('.x-n',U).forEach((r,j)=>{rise(r,u,.1+j*.12,.3,20);const ok=r.dataset.ok==='1';const done=u>=.9+j*.18;const flag=!ok&&u>=fx;
    $('.x-ic',r).innerHTML=done?(ok?CHECK:(flag?XMARK:'')):'';$('.x-lb',r).textContent=flag?'KEEP · REAL CUSTOMERS SEARCH THIS':(done&&ok?'ADD':'');
    r.style.borderColor=flag?'rgba(255,255,255,.55)':(done&&ok?'rgba(34,224,111,.6)':'rgba(255,255,255,.14)');r.style.background=flag?'rgba(255,255,255,.14)':(done&&ok?'rgba(34,224,111,.10)':'rgba(255,255,255,.05)');});}
  const on=u>=fx+.35; $('.r-c',U).textContent=(on?i+1:i)+'/3';
  $$('.r-d',U).forEach(d=>{const j=+d.dataset.j;d.style.background=(j<i||(j===i&&on))?'#22E06F':'rgba(255,255,255,.14)';});
}
function renderPayoff(t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.45;
  const bl=(W('payoff',/^blocked/)||32.1)-sceneStart('payoff')-.45;
  $$('.y-r',U).forEach((r,i)=>{rise(r,u,.05+i*.06,.3,20);const j=r.dataset.j;const k=P(u,bl-.3+i*.08,.3);
    if(j){r.style.opacity=lerp(1,.3,k);r.firstChild.style.textDecoration=k>0?'line-through':'none';}else{r.style.borderColor=k>0?'rgba(34,224,111,.6)':'rgba(255,255,255,.1)';}});
  $('.y-w',U).textContent='$'+Math.round(lerp(186,0,eio(P(u,bl-.3,1.0))));
}
function renderRecap(t,el){
  rise($('#r-tag',el),t,0,.3,20);
  const pb=eo5(P(t,.05,.4)); st($('#r-big',el),{opacity:clamp(pb*2),transform:`scale(${lerp(1.15,1,pb)})`});
  const T=t+sceneStart('recap'); const cues=[W('recap',/^Download/),W('recap',/^Run/),W('recap',/^Check/)];
  $$('.r-r',el).forEach((r,i)=>{rise(r,t,.15+i*.1,.35,30);const on=cues[i]!=null&&T>=cues[i]-.05;const b=$('.r-b',r);
    b.style.borderColor=on?'#22E06F':'#8A938C';b.style.background=on?'#22E06F':'transparent';
    b.innerHTML=on?'<svg width="34" height="34" viewBox="0 0 26 26"><path d="M4 14l6 6L22 6" stroke="#030403" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'';
    r.style.borderColor=on?'rgba(34,224,111,.6)':'rgba(255,255,255,.16)';});
}
function renderCta(t,el){
  rise($('#c-tag',el),t,0,.3,20);
  [...$('#c-grid',el).children].forEach((c,i)=>pop(c,t,.05+i*.06,.4,.6));
  const pt=eo5(P(t,.3,.45)); st($('#c-t',el),{opacity:pt,transform:`scale(${lerp(1.2,1,pt)})`});
  rise($('#c-s',el),t,.5,.4,30);
  const b=$('#c-btn',el); pop(b,t,.7,.45,.4);
  const click=P(t,2.6,.2); const followed=t>2.7;
  st(b,{background:followed?'rgba(255,255,255,.12)':'#22E06F',color:followed?'#fff':'#030403',border:followed?'2px solid rgba(255,255,255,.4)':'none'}); b.innerHTML=followed?'Following <svg width="34" height="34" viewBox="0 0 34 34" style="margin-left:10px"><path d="M6 18l7 7L28 9" stroke="#22E06F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'Follow';
  b.style.transform+=` scale(${1-Math.sin(click*Math.PI)*.08})`;
  const pc=eio(P(t,1.8,.75)); st($('#c-cur',el),{opacity:clamp(P(t,1.75,.2)),transform:`translate(${(1-pc)*220}px,${(1-pc)*260}px)`});
}

window.seek=function(t){
  renderBg(t);
  order.forEach((k,idx)=>{const el=els[k];const tf=sceneTransform(idx,t);
    if(!tf){el.style.display='none';return;} el.style.display='block';
    st(el,{transform:tf.tr,filter:tf.f||'none',opacity:tf.o});
    const lt=t-starts[idx];
    if(k==='pain')renderPain(lt,el); else if(k==='poke')renderPoke(lt,el); else if(k==='fix0')renderFix0(lt,el);
    else if(k==='payoff')renderPayoff(lt,el); else if(k==='recap')renderRecap(lt,el); else if(k==='cta')renderCta(lt,el);
    else renderFix(+k.slice(3)-1,lt,el);
  });
  [...$('#prog').children].forEach((s,i)=>{const a=starts[PB+i],b=starts[PB+i+1];s.firstChild.style.width=`${clamp((t-a)/(b-a))*100}%`;});
  const p0=starts[PB],p1=starts[PB+NP]; const pv=t<p0-.2?0:t<p0+.2?eo(P(t,p0-.2,.4)):(t>p1?1-eo(P(t,p1,.3)):1); st($('#prog'),{opacity:pv});
  const cap=$('#cap'); const ch=chunks.find(c=>t>=c[0].s-.05&&t<c[c.length-1].e+.08);
  if(!ch){cap.innerHTML='';} else {
    const pin=eo5(P(t,ch[0].s-.05,.18));
    cap.innerHTML=ch.map(w=>{const on=t>=w.s&&t<w.e+.05; return `<span style="color:${on?'#22E06F':'#fff'};transform:scale(${on?1.08:1})">${w.w}</span>`}).join(' ');
    st(cap,{transform:`translateY(${(1-pin)*30}px) scale(${lerp(.9,1,pin)})`,opacity:pin});
    if(NOCAP.includes(ch[0].seg)) cap.style.opacity=0;
  }
  let fl=0, wy=-2400;
  for(let i=1;i<order.length;i++){const b=starts[i];const d=t-b;
    if(Math.abs(d)<.12) fl=Math.max(fl,(1-Math.abs(d)/.12)*(TRTYPE[i-1]==='zoom'?.55:.3));
    if(TRTYPE[i-1]==='wipe'&&Math.abs(d)<TR*0.5){const p=eio((d+TR*.5)/TR); wy=lerp(1920,-2400,p);}
  }
  $('#flash').style.opacity=fl; $('#wipe').style.top=`${wy}px`;
  return true;
};
window.__ready=document.fonts.ready.then(()=>true);
window.__starts=starts;
</script></body></html>
