*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
body{font-family:Inter,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-200px}

.abs{position:absolute}
.mono{font-family:Mono,monospace;letter-spacing:.04em}
#prog{position:absolute;top:118px;left:90px;right:90px;display:flex;gap:12px}

#prog .seg i{display:block;height:100%;width:0;background:var(--lime);border-radius:8px;box-shadow:0 0 18px var(--lime)}
.card{position:absolute;left:90px;width:900px;border-radius:44px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14);box-shadow:0 40px 120px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(30px);overflow:hidden}

.title{font-family:Mont;font-weight:900;font-size:128px;line-height:.92;letter-spacing:-.035em}
.sub{font-size:44px;font-weight:500;color:#C8D0CA;line-height:1.25}
.sub b{color:var(--lime);font-weight:800}
.bar{height:22px;border-radius:12px;background:rgba(255,255,255,.14)}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-family:Mont;font-weight:900;font-size:66px;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase}
#cap span{display:inline-block;margin:0 10px;text-shadow:0 6px 30px rgba(0,0,0,.7)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:overlay}
#wipe{position:absolute;left:0;right:0;height:2400px;top:-2400px;background:var(--lime)}
.ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16)}
.tile{display:inline-flex;align-items:center;justify-content:center;flex:none;background:#fff;color:#030403;font-family:Mont;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4)}

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);

const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};

function pop(el,t,a,d=.45,from=.6){const p=P(t,a,d);st(el,{opacity:clamp(p*3),transform:`scale(${lerp(from,1,back(p))})`});}

function renderPain(t,el){
  const fi=W('pain',/^fifty/)||.9, fo=W('pain',/^four/)||3.0, hr=(W('pain',/^Here/)||4.1)-.05;
  const pb=eo5(P(t,0,.35)); st($('#p-big',el),{transform:`scale(${lerp(1.08,1,pb)})`,opacity:1});
  st($('#p-a',el),{opacity:1,transform:`translateY(${(1-eo(P(t,0,.35)))*50}px)`}); st($('#p-b',el),{opacity:1,transform:`translateY(${(1-eo(P(t,.05,.35)))*50}px)`});
  $('.p-av',el).textContent=Math.round(50*eo(P(t,0,fi+.4))); pop($('.p-cf',el),t,fi+.3,.4,.5);
  $('.p-bv',el).textContent=Math.round(4*eo(P(t,.6,fo-.6)));
  const land=P(t,fo,.3); $('.p-bv',el).style.transform=`scale(${1+Math.sin(land*Math.PI)*.14})`;
  pop($('#p-gap',el),t,fo+.4,.4,.5); pop($('#p-topic',el),t,hr,.45,.6);
}

    ${[[LOGO_GADS,'google-ads-spend.csv'],[LOGO_META,'meta-spend.csv'],[CARD,'billing-paid.csv']].map(([l,f])=>`<div class="x-f" style="display:flex;align-items:center;gap:18px;padding:20px 24px;border-radius:22px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.16)">${LT(l,52,14)}<span style="font:800 32px Inter">${f}</span></div>`).join('')}</div>`},
 {k:'fix2',logo:LOGO_CLAUDE,name:'Ask Claude',pill:'2 NUMBERS',mono:'COST PER PAYING CUSTOMER',one:'Cost per <b>paying</b> customer. Trial to paid.',cue:/^campaign/,
  html:`<div class="abs mono" style="left:50px;top:40px;font-size:22px;color:#8E9890;display:flex;align-items:center;gap:12px">${LT(LOGO_CLAUDE,40,11)}CLAUDE · EXAMPLE ANSWER</div>`+TABLE},
 {k:'fix3',logo:LOGO_CLAUDE,name:'Scale or fix',pill:'THE CALL',mono:'UNDER TARGET? TRIALS UP, BUYERS FLAT?',one:'Under target: <b>scale</b>. Buyers flat: <b>fix</b>.',cue:/^Scale/,
  html:`<div class="abs mono" style="left:50px;top:40px;font-size:22px;color:#8E9890">TARGET: $300 PER PAYING CUSTOMER · EXAMPLE</div>`+TABLE},
 {k:'fix4',logo:LOGO_CLAUDE,name:'Hold or data',pill:'THE CALL',mono:'UNDER 10 BUYERS? NUMBERS DON\'T MATCH?',one:'Too early: <b>hold</b>. No match: <b>fix tracking</b>.',cue:/^Hold/,
  html:`<div class="abs mono" style="left:50px;top:40px;font-size:22px;color:#8E9890">TARGET: $300 PER PAYING CUSTOMER · EXAMPLE</div>`+TABLE},
];
const FS=FX.map((F,i)=>{const sc=itemScene(F.k,`STEP 0${Math.min(i+1,3)} / 03`,F.logo,F.name,F.pill,F.mono,F.one);
  $('.s-ui',sc).innerHTML=F.html+`<div class="abs" style="left:50px;right:50px;bottom:40px">
     <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="mono" style="font-size:22px;color:#8E9890">STEPS DONE</span><span class="r-c" style="font:900 52px Mont;color:var(--lime)">${Math.min(i,2)}/3</span></div>
     <div style="display:flex;gap:10px;margin-top:12px">${[0,1,2].map((_,j)=>`<i class="r-d" data-j="${j}" style="flex:1;height:16px;border-radius:8px;background:${j<Math.min(i,2)?'#22E06F':'rgba(255,255,255,.14)'}"></i>`).join('')}</div></div>`;
  return sc;});

// 8) PAYOFF: budget follows paying customers
const SPY=itemScene('payoff','THE PAYOFF',LOGO_CLAUDE,'Clear calls','EVERY MONDAY','EXAMPLE','Budget follows <b>paying customers</b>.');
$('.s-ui',SPY).innerHTML=`<div class="abs mono" style="left:50px;top:40px;font-size:22px;color:#8E9890">BUDGET SPLIT · BEFORE → AFTER</div>
 <div class="abs" style="left:50px;right:50px;top:100px;display:flex;flex-direction:column;gap:18px">
  ${CAMPS.map((c,i)=>`<div style="display:flex;align-items:center;gap:18px"><span style="width:300px;font:800 28px Inter">${c.n}</span><div style="flex:1;height:34px;border-radius:17px;background:rgba(255,255,255,.08);overflow:hidden"><i class="y-b" data-a="${[25,45,10,20][i]}" data-b="${[60,10,15,15][i]}" style="display:block;height:100%;width:0;background:${i===0?'linear-gradient(90deg,#0E7A3C,#22E06F)':'#5A625C'}"></i></div><span class="y-p" style="width:80px;text-align:right;font:900 30px Mont">0%</span></div>`).join('')}</div>
 <div class="abs y-n" style="left:50px;right:50px;bottom:40px;font:700 30px Inter;color:#C8D0CA">More budget where customers <b style="color:#fff">actually pay</b>.</div>`;

const recap=mk(`<div class="scene" id="s-recap">
  <div class="abs mono" id="r-tag" style="top:330px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)">RECAP · SAVE THIS</div>
  <div class="abs" id="r-big" style="top:400px;left:60px;right:60px;text-align:center;font:900 100px/.96 Mont;letter-spacing:-.035em;text-transform:uppercase">5 minutes.<br><span style="color:var(--lime)">Every Monday.</span></div>
  <div class="abs" style="left:90px;right:90px;top:720px;display:flex;flex-direction:column;gap:22px"><div class="r-r" style="display:flex;align-items:center;gap:20px;padding:28px 30px;border-radius:26px;border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06)"><span class="r-b" style="flex:none;width:56px;height:56px;border-radius:16px;border:4px solid #8A938C;display:flex;align-items:center;justify-content:center"></span><span style="font:800 40px Inter">Download the numbers</span></div><div class="r-r" style="display:flex;align-items:center;gap:20px;padding:28px 30px;border-radius:26px;border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06)"><span class="r-b" style="flex:none;width:56px;height:56px;border-radius:16px;border:4px solid #8A938C;display:flex;align-items:center;justify-content:center"></span><span style="font:800 40px Inter">Get cost per paying customer</span></div><div class="r-r" style="display:flex;align-items:center;gap:20px;padding:28px 30px;border-radius:26px;border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06)"><span class="r-b" style="flex:none;width:56px;height:56px;border-radius:16px;border:4px solid #8A938C;display:flex;align-items:center;justify-content:center"></span><span style="font:800 40px Inter">Make one call per campaign</span></div></div>
</div>`);
scenesEl.appendChild(recap);

const ANGLES=['Scale it','Fix it','Hold it','Get data'];
const RECAP_CUES=()=>[W('recap',/^Download/),W('recap',/^Get/),W('recap',/^Make/)];

/* ---------- CTA ---------- */
const cta=mk(`<div class="scene" id="s-cta">
  <div class="abs mono" style="top:250px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)" id="c-tag">COMMENT SAAS FOR THE PROMPT</div>
  <div class="abs" id="c-grid" style="top:330px;left:90px;right:90px;display:grid;grid-template-columns:1fr 1fr;gap:20px">
   ${ANGLES.map((a,i)=>`<div class="c-g ghost" style="border-radius:28px;padding:18px 26px;display:flex;align-items:center;gap:20px"><span class="tile" style="width:64px;height:64px;border-radius:18px;font:700 26px Mono">${String(i+1).padStart(2,'0')}</span><span style="font:800 36px Inter">${a}</span></div>`).join('')}</div>
  <div class="abs title" id="c-t" style="top:1010px;left:0;right:0;text-align:center;font-size:110px">Follow for more</div>
  <div class="abs" id="c-s" style="top:1135px;left:0;right:0;text-align:center;font-family:ISerif;font-size:80px;color:#D8E0DA">send this to a SaaS founder</div>
  <div class="abs pill" id="c-btn" style="top:1290px;left:50%;width:380px;margin-left:-190px;height:110px;justify-content:center;font-size:44px;font-weight:900;background:var(--lime);color:#030403">Follow</div>
  <svg class="abs" id="c-cur" style="top:1352px;left:700px" width="70" height="80" viewBox="0 0 70 80"><path d="M6 4 L6 62 L22 48 L34 74 L46 68 L34 43 L56 43 Z" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round"/></svg>
</div>`);
scenesEl.appendChild(cta);

/* ---------- timeline (voice-driven, no title card) ---------- */
const S=D.segs, segBy=Object.fromEntries(S.map(s=>[s.key,s]));
const LEAD=0.18;
const order=['pain', 'poke', 'fix0', 'fix1', 'fix2', 'fix3', 'fix4', 'payoff', 'recap', 'cta'];
const els={pain,poke:SPK,fix0,payoff:SPY,recap,cta}; FS.forEach((e,i)=>els['fix'+(i+1)]=e);
const starts=order.map((k,i)=>i===0?0:segBy[k].start-LEAD);
const END=D.end;
const TR=0.42;
const TRTYPE=['whip', 'zoom', 'whip', 'whip', 'whip', 'whip', 'zoom', 'wipe', 'zoom'];
const PB=order.indexOf('fix1'), NP=4;
for(let i=0;i<NP;i++) $('#prog').appendChild(mk('<div class="seg"><i></i></div>'));
const capWords=[];
S.forEach(s=>s.words.forEach((w,k)=>{const nx=s.words[k+1];capWords.push({w:w.w.replace(/[.,]$/,''),s:w.s,e:nx?nx.s:s.start+s.dur,seg:s.key,brk:/[.,!?]$/.test(w.w)});}));
const chunks=[];let cur=[];
capWords.forEach((w,i)=>{cur.push(w);const nx=capWords[i+1];if(cur.length>=3||w.brk||!nx||nx.seg!==w.seg){chunks.push(cur);cur=[];}});
const NOCAP=['pain','fix0','recap','cta'];

function renderBg(t){
  st($('#b1'),{left:`${300+Math.sin(t*.35)*180}px`,top:`${200+Math.cos(t*.28)*160}px`});
  st($('#b2'),{left:`${500+Math.cos(t*.3)*200}px`,top:`${1300+Math.sin(t*.4)*180}px`});
  st($('#b3'),{left:`${100+Math.sin(t*.5+1)*120}px`,top:`${900+Math.cos(t*.45)*200}px`});
  st($('#grid'),{transform:`translateY(${(t*30)%90}px)`});
}
function sceneTransform(idx,t){
  const a=starts[idx], b=idx+1<order.length?starts[idx+1]:END+5;
  if(t<a-TR*0.5||t>b+TR*0.5) return null;
  let tr='',f='',o=1;
  if(idx>0&&t<a+TR*0.5){const p=eio((t-(a-TR*0.5))/TR);const ty=TRTYPE[idx-1];
    if(ty==='whip'){tr=`translateX(${(1-p)*1100}px)`;f=`blur(${(1-p)*(1-p)*40}px)`;}
    if(ty==='zoom'){tr=`scale(${lerp(.55,1,p)})`;f=`blur(${(1-p)*30}px)`;o=clamp(p*2);}
    if(ty==='wipe'){tr=`translateY(${(1-p)*400}px) scale(${lerp(1.1,1,p)})`;o=p>0.5?1:0;}
  }
  if(idx+1<order.length&&t>b-TR*0.5){const p=eio((t-(b-TR*0.5))/TR);const ty=TRTYPE[idx];
    if(ty==='whip'){tr=`translateX(${-p*1100}px)`;f=`blur(${p*p*40}px)`;}
    if(ty==='zoom'){tr=`scale(${lerp(1,2.2,p)})`;f=`blur(${p*30}px)`;o=1-clamp(p*1.6);}
    if(ty==='wipe'){tr=`translateY(${-p*400}px)`;o=p<0.5?1:0;}
  }
  const life=t-a; tr+=` scale(${1+clamp(life/6)*0.03})`;
  return {tr,f,o};
}
function renderItemShell(t,el){
  rise($('.s-idx',el),t,.0,.35,30); pop($('.s-logo',el),t,.02,.45,.3);
  const pn=eo5(P(t,.0,.45)); st($('.s-name',el),{opacity:clamp(pn*2),transform:`translateX(${(1-pn)*-80}px)`,clipPath:`inset(0 ${(1-pn)*100}% 0 0)`});
  rise($('.s-by',el),t,.15,.4,30);
  rise($('.s-one',el),t,.3,.45,40);
  const pc=eo5(P(t,.25,.6)); st($('.s-card',el),{opacity:clamp(pc*2),transform:`translateY(${(1-pc)*160}px) rotateX(${(1-pc)*20}deg) scale(${lerp(.92,1,pc)})`});
}
const sceneStart=k=>starts[order.indexOf(k)];
function renderPoke(t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.45;const s0=sceneStart('poke')+.45;
  rise($('.k-a',U),u,.2,.4,30); rise($('.k-b',U),u,.4,.4,30);
  pop($('.k-s1',U),u,(W('poke',/^scale/)||11.4)-s0,.4,.5); pop($('.k-s2',U),u,(W('poke',/^fewest/)||13.4)-s0,.4,.5);
  rise($('.k-n',U),u,(W('poke',/^fewest/)||13.4)-s0+.4,.4,20);
}
function renderFix0(t,el){
  rise($('#f-tag',el),t,0,.3,20);
  const pb=eo5(P(t,.05,.35)); st($('#f-big',el),{opacity:clamp(pb*2),transform:`scale(${lerp(1.2,1,pb)})`});
  pop($('.f-l',el),t,(W('fix0',/^Claude/)||16.4)-sceneStart('fix0')-.2,.4,.5);
  const ws=segBy.fix0.words; const cues=[/^Scale/,/^fix/,/^hold/,/^get/].map(r=>{const w=ws.find((w,j)=>j>12&&r.test(w.w));return w?w.s:null;});
  $$('.f-c',el).forEach((c,i)=>pop(c,t,(cues[i]||18+i*.6)-sceneStart('fix0')-.05,.35,.5));
}
const callAt={};
function renderFix(i,t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.45;const F=FX[i];
  const fx=Math.max(1.2,(W(F.k,F.cue)||0)-sceneStart(F.k)-.45);
  if(i===0){$$('.x-f',U).forEach((c,j)=>pop(c,u,.3+j*.5,.4,.5));}
  if(i>=1){
    const T=t+sceneStart(F.k);
    const at={'SCALE':W('fix3',/^Scale/),'FIX':W('fix3',/^Fix/),'HOLD':W('fix4',/^Hold/),'GET DATA':W('fix4',/^Get/)};
    $$('.x-row',U).forEach((r,j)=>{rise(r,u,.1+j*.12,.3,20);const call=r.dataset.call;const show=i>=2&&at[call]!=null&&T>=at[call]-.05;
      const c=$('.x-call',r); c.style.opacity=show?1:0; c.style.transform=`scale(${show?1+Math.sin(clamp((T-at[call])/.3)*Math.PI)*.12:1})`;
      const lit=show&&((i===2&&(call==='SCALE'||call==='FIX'))||(i===3&&(call==='HOLD'||call==='GET DATA')));
      r.style.borderColor=lit?'rgba(34,224,111,.7)':'rgba(255,255,255,.12)'; r.style.background=lit?'rgba(34,224,111,.10)':'rgba(255,255,255,.05)';});
  }
  const si=Math.min(i,2), on=i!==2&&u>=fx+.35; $('.r-c',U).textContent=(on?si+1:si)+'/3';
  $$('.r-d',U).forEach(d=>{const j=+d.dataset.j;d.style.background=(j<si||(j===si&&on))?'#22E06F':'rgba(255,255,255,.14)';});
}
function renderPayoff(t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.45;
  const k=eio(P(u,1.0,1.6)); const g=eo(P(u,.2,.5));
  $$('.y-b',U).forEach((b,i)=>{const v=lerp(+b.dataset.a,+b.dataset.b,k)*g; b.style.width=v+'%'; b.parentNode.nextSibling.textContent=Math.round(v)+'%';});
  rise($('.y-n',U),u,2.8,.4,20);
}
function renderRecap(t,el){
  rise($('#r-tag',el),t,0,.3,20);
  const pb=eo5(P(t,.05,.4)); st($('#r-big',el),{opacity:clamp(pb*2),transform:`scale(${lerp(1.15,1,pb)})`});
  const T=t+sceneStart('recap'); const cues=RECAP_CUES();
  $$('.r-r',el).forEach((r,i)=>{rise(r,t,.15+i*.1,.35,30);const on=cues[i]!=null&&T>=cues[i]-.05;const b=$('.r-b',r);
    b.style.borderColor=on?'#22E06F':'#8A938C';b.style.background=on?'#22E06F':'transparent';
    b.innerHTML=on?'<svg width="34" height="34" viewBox="0 0 26 26"><path d="M4 14l6 6L22 6" stroke="#030403" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'';
    r.style.borderColor=on?'rgba(34,224,111,.6)':'rgba(255,255,255,.16)';});
}
function renderCta(t,el){
  rise($('#c-tag',el),t,0,.3,20);
  [...$('#c-grid',el).children].forEach((c,i)=>pop(c,t,.05+i*.06,.4,.6));
  const pt=eo5(P(t,.3,.45)); st($('#c-t',el),{opacity:pt,transform:`scale(${lerp(1.2,1,pt)})`});
  rise($('#c-s',el),t,.5,.4,30);
  const b=$('#c-btn',el); pop(b,t,.7,.45,.4);
  const click=P(t,2.6,.2); const followed=t>2.7;
  st(b,{background:followed?'rgba(255,255,255,.12)':'#22E06F',color:followed?'#fff':'#030403',border:followed?'2px solid rgba(255,255,255,.4)':'none'}); b.innerHTML=followed?'Following <svg width="34" height="34" viewBox="0 0 34 34" style="margin-left:10px"><path d="M6 18l7 7L28 9" stroke="#22E06F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'Follow';
  b.style.transform+=` scale(${1-Math.sin(click*Math.PI)*.08})`;
  const pc=eio(P(t,1.8,.75)); st($('#c-cur',el),{opacity:clamp(P(t,1.75,.2)),transform:`translate(${(1-pc)*220}px,${(1-pc)*260}px)`});
}

window.seek=function(t){
  renderBg(t);
  order.forEach((k,idx)=>{const el=els[k];const tf=sceneTransform(idx,t);
    if(!tf){el.style.display='none';return;} el.style.display='block';
    st(el,{transform:tf.tr,filter:tf.f||'none',opacity:tf.o});
    const lt=t-starts[idx];
    if(k==='pain')renderPain(lt,el); else if(k==='poke')renderPoke(lt,el); else if(k==='fix0')renderFix0(lt,el);
    else if(k==='payoff')renderPayoff(lt,el); else if(k==='recap')renderRecap(lt,el); else if(k==='cta')renderCta(lt,el);
    else renderFix(+k.slice(3)-1,lt,el);
  });
  [...$('#prog').children].forEach((s,i)=>{const a=starts[PB+i],b=starts[PB+i+1];s.firstChild.style.width=`${clamp((t-a)/(b-a))*100}%`;});
  const p0=starts[PB],p1=starts[PB+NP]; const pv=t<p0-.2?0:t<p0+.2?eo(P(t,p0-.2,.4)):(t>p1?1-eo(P(t,p1,.3)):1); st($('#prog'),{opacity:pv});
  const cap=$('#cap'); const ch=chunks.find(c=>t>=c[0].s-.05&&t<c[c.length-1].e+.08);
  if(!ch){cap.innerHTML='';} else {
    const pin=eo5(P(t,ch[0].s-.05,.18));
    cap.innerHTML=ch.map(w=>{const on=t>=w.s&&t<w.e+.05; return `<span style="color:${on?'#22E06F':'#fff'};transform:scale(${on?1.08:1})">${w.w}</span>`}).join(' ');
    st(cap,{transform:`translateY(${(1-pin)*30}px) scale(${lerp(.9,1,pin)})`,opacity:pin});
    if(NOCAP.includes(ch[0].seg)) cap.style.opacity=0;
  }
  let fl=0, wy=-2400;
  for(let i=1;i<order.length;i++){const b=starts[i];const d=t-b;
    if(Math.abs(d)<.12) fl=Math.max(fl,(1-Math.abs(d)/.12)*(TRTYPE[i-1]==='zoom'?.55:.3));
    if(TRTYPE[i-1]==='wipe'&&Math.abs(d)<TR*0.5){const p=eio((d+TR*.5)/TR); wy=lerp(1920,-2400,p);}
  }
  $('#flash').style.opacity=fl; $('#wipe').style.top=`${wy}px`;
  return true;
};
window.__ready=document.fonts.ready.then(()=>true);
window.__starts=starts;
</script></body></html>
