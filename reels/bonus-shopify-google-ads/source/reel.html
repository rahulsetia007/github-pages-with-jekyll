<!doctype html>
<html><head><meta charset="utf-8">
<!-- Bonus: connect Shopify to Google Ads in 60 seconds. Built from reels/_brand/reference_reel.html (house look). -->
<style>
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
@font-face{font-family:Mont;src:url(fonts/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/SpaceMono-Bold.ttf)}
@font-face{font-family:ISerif;src:url(fonts/InstrumentSerif-Italic.ttf);font-style:normal;font-weight:400}
:root{
  --ink:#030403; --ink2:#0A0D0B; --line:rgba(255,255,255,.08);
  --text:#F5F8F6; --muted:#8A938C; --lime:#22E06F; --violet:#0E7A3C; --deep:#06331A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
body{font-family:Inter,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-200px}
.blob{position:absolute;border-radius:50%;filter:blur(140px);opacity:.42}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 45%,#000 30%,transparent 80%);opacity:.55}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.65) 100%);pointer-events:none}
.scene{position:absolute;inset:0;will-change:transform,filter,opacity}
.abs{position:absolute}
.mono{font-family:Mono,monospace;letter-spacing:.04em}
#prog{position:absolute;top:118px;left:90px;right:90px;display:flex;gap:12px}
#prog .seg{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
#prog .seg i{display:block;height:100%;width:0;background:var(--lime);border-radius:8px;box-shadow:0 0 18px var(--lime)}
.card{position:absolute;left:90px;width:900px;border-radius:44px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14);box-shadow:0 40px 120px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(30px);overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:12px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:30px}
.title{font-family:Mont;font-weight:900;font-size:128px;line-height:.92;letter-spacing:-.035em}
.sub{font-size:44px;font-weight:500;color:#C8D0CA;line-height:1.25}
.sub b{color:var(--lime);font-weight:800}
.bar{height:22px;border-radius:12px;background:rgba(255,255,255,.14)}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-family:Mont;font-weight:900;font-size:66px;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase}
#cap span{display:inline-block;margin:0 10px;text-shadow:0 6px 30px rgba(0,0,0,.7)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:overlay}
#wipe{position:absolute;left:0;right:0;height:2400px;top:-2400px;background:var(--lime)}
.ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16)}
.tile{display:inline-flex;align-items:center;justify-content:center;flex:none;background:#fff;color:#030403;font-family:Mont;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style></head>
<body><div id="stage">
  <div class="bg" id="bg">
    <div class="blob" id="b1" style="width:900px;height:900px;background:var(--violet)"></div>
    <div class="blob" id="b2" style="width:800px;height:800px;background:var(--deep)"></div>
    <div class="blob" id="b3" style="width:600px;height:600px;background:var(--lime);opacity:.18"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="scenes"></div>
  <div id="prog"></div>
  <div id="cap"></div>
  <div id="wipe"></div>
  <div id="flash"></div>
  <div class="vig"></div>
</div>
<script>
const D = window.__DATA__;
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eo5=t=>1-Math.pow(1-clamp(t),5);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const P=(t,a,d)=>clamp((t-a)/d);
function st(el,o){for(const k in o) el.style[k]=o[k];}
function pop(el,t,a,d=.45,from=.6){const p=P(t,a,d);st(el,{opacity:clamp(p*3),transform:`scale(${lerp(from,1,back(p))})`});}
function rise(el,t,a,d=.5,dy=60){const p=eo(P(t,a,d));st(el,{opacity:p,transform:`translateY(${(1-p)*dy}px)`,filter:`blur(${(1-p)*10}px)`});}
function typed(el,txt,t,a,cps=26){const n=Math.floor(clamp((t-a)*cps,0,txt.length));el.textContent=txt.slice(0,n);return n<txt.length;}
function mk(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
const scenesEl=$('#scenes');

/* ---------- content ---------- */
const PROMPT='Turn this video script into 5 posts: an Instagram caption, a 5-slide carousel, a LinkedIn post, a 4-post X thread and a short email. Keep each one simple. Script: [paste]';
const OUTS=['Caption','Carousel','LinkedIn','X thread','Email'];
const CHECK=`<svg width="30" height="30" viewBox="0 0 26 26"><path d="M4 14l6 6L22 6" stroke="#22E06F" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const LOGO_SHOP=`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#95BF47" d="M15.337 23.979l7.216-1.561s-2.604-17.613-2.625-17.73c-.018-.116-.114-.192-.211-.192s-1.929-.136-1.929-.136-1.275-1.274-1.439-1.411c-.045-.037-.075-.057-.121-.074l-.914 21.104h.023zM11.71 11.305s-.81-.424-1.774-.424c-1.447 0-1.504.906-1.504 1.141 0 1.232 3.24 1.715 3.24 4.629 0 2.295-1.44 3.76-3.406 3.76-2.354 0-3.54-1.465-3.54-1.465l.646-2.086s1.245 1.066 2.28 1.066c.675 0 .975-.545.975-.932 0-1.619-2.654-1.694-2.654-4.359-.034-2.237 1.571-4.416 4.827-4.416 1.257 0 1.875.361 1.875.361l-.945 2.715-.02.01zM11.17.83c.136 0 .271.038.405.135-.984.465-2.064 1.639-2.508 3.992-.656.213-1.293.405-1.889.578C7.697 3.75 8.951.84 11.17.84V.83zm1.235 2.949v.135c-.754.232-1.583.484-2.394.736.466-1.777 1.333-2.645 2.085-2.971.193.501.309 1.176.309 2.1zm.539-2.234c.694.074 1.141.867 1.429 1.755-.349.114-.735.231-1.158.366v-.252c0-.752-.096-1.371-.271-1.871v.002zm2.992 1.289c-.02 0-.06.021-.078.021s-.289.075-.714.21c-.423-1.233-1.176-2.37-2.508-2.37h-.115C12.135.209 11.669 0 11.265 0 8.159 0 6.675 3.877 6.21 5.846c-1.194.365-2.063.636-2.16.674-.675.213-.694.232-.772.87-.075.462-1.83 14.063-1.83 14.063L15.009 24l.927-21.166z"/></svg>`;
const LOGO_GADS=`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><line x1="56" y1="150" x2="102" y2="56" stroke="#FBBC04" stroke-width="46" stroke-linecap="round"/><line x1="102" y1="56" x2="148" y2="150" stroke="#4285F4" stroke-width="46" stroke-linecap="round"/><circle cx="56" cy="150" r="25" fill="#34A853"/></svg>`;
const LT=(svg,size,r)=>`<span class="tile" style="width:${size}px;height:${size}px;border-radius:${r}px;padding:${Math.round(size*.17)}px;background:#fff">${svg}</span>`;
/* ---------- HOOK (cover frame) ---------- */
const hook=mk(`<div class="scene" id="s-hook">
  <div class="abs" id="h-burn" style="top:150px;left:0;right:0;margin:0 auto;width:fit-content;display:flex;align-items:center;gap:14px;padding:12px 28px;border-radius:999px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);white-space:nowrap"><span class="mono" style="font-size:26px;color:#8A938C">SHOPIFY ORDERS TODAY</span><span class="h-v" style="font:900 44px Mont;font-variant-numeric:tabular-nums">0</span></div>
  <div class="abs mono" id="h-tag" style="top:250px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)">SHOPIFY STORE OWNERS</div>
  <div class="abs" id="h-n" style="top:300px;left:0;right:0;text-align:center;font-family:Mont;font-weight:900;font-size:560px;line-height:1;letter-spacing:-.06em;background:linear-gradient(180deg,#fff 30%,#22E06F);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 20px 80px rgba(34,224,111,.35))">0</div>
  <div class="abs title" id="h-t1" style="top:860px;left:0;right:0;text-align:center;font-size:118px">SALES SEEN</div>
  <div class="abs" id="h-t2" style="top:990px;left:0;right:0;text-align:center;font-family:ISerif;font-size:92px;color:#D8E0DA">by your Google Ads</div>
  <div class="abs" id="h-list" style="top:1140px;left:40px;right:40px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px">
    ${[[LOGO_SHOP,'Shopify'],[null,'✕'],[LOGO_GADS,'Google Ads']].map(([l,a])=>l?`<div class="pill ghost" style="font-size:34px;padding:8px 26px 8px 8px;gap:12px">${LT(l,58,29)}${a}</div>`:`<div style="font:900 44px Mont;color:#8A938C;align-self:center">${a}</div>`).join('')}</div>
  <div class="abs pill" id="h-save" style="top:1400px;left:50%;margin-left:-160px;width:320px;justify-content:center;background:var(--lime);color:#030403;font-size:34px;font-weight:900">
    <svg width="30" height="36" viewBox="0 0 30 36"><path d="M3 2h24v32l-12-8-12 8z" fill="#030403"/></svg> SAVE THIS</div>
</div>`);
scenesEl.appendChild(hook);

/* ---------- item scene shell (same layout as the tool scenes) ---------- */
const CARD_TOP=760, CARD_H=640;
function itemScene(key,idx,tileTxt,name,pillTxt,monoTxt,one,pillMuted){
  const s=mk(`<div class="scene" id="s-${key}">
    <div class="abs mono s-idx" style="top:230px;left:90px;font-size:32px;color:var(--lime)">${idx}</div>
    <div class="abs s-logo" style="top:292px;left:90px">${tileTxt.startsWith('<svg')?LT(tileTxt,132,34):`<span class="tile" style="width:132px;height:132px;border-radius:34px;font-size:${tileTxt.length>2?50:68}px">${tileTxt}</span>`}</div>
    <div class="abs title s-name" style="top:300px;left:252px;font-size:${name.length>12?80:name.length>11?96:112}px">${name}</div>
    <div class="abs s-by" style="top:430px;left:90px;display:flex;gap:16px;align-items:center">
      <span class="pill" style="background:${pillMuted?'rgba(255,255,255,.14)':'var(--lime)'};color:${pillMuted?'#fff':'#030403'};font-size:28px;padding:10px 22px;font-weight:900">${pillTxt}</span>
      <span class="mono" style="font-size:30px;color:var(--muted)">${monoTxt}</span></div>
    <div class="abs sub s-one" style="top:540px;left:90px;right:90px;font-size:56px;font-weight:700;color:#fff">${one}</div>
    <div class="card s-card" style="top:${CARD_TOP}px;height:${CARD_H}px"><div class="abs" style="inset:0;background:radial-gradient(600px 300px at 80% 0%,#0E7A3C55,transparent 70%)"></div><div class="abs s-ui" style="inset:0"></div></div>
  </div>`);
  scenesEl.appendChild(s); return s;
}

const ROW=(inner,cls='')=>`<div class="${cls}" style="display:flex;align-items:center;gap:20px;padding:22px 26px;border-radius:24px;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)">${inner}</div>`;
const ORDERS=[['#1042','$64.00'],['#1043','$118.50'],['#1044','$39.90'],['#1045','$82.00']];

// 1) Why it matters: without sales data Google can't tell buyers from browsers
const PEOPLE=['browse','buy','browse','browse','browse','buy','browse','browse','browse','browse'];
const SH=itemScene('how','WHY IT MATTERS',LOGO_GADS,'Guessing','NO SALES DATA','BUYERS OR BROWSERS?','Every guess <b>costs you</b>.',true);
$('.s-ui',SH).innerHTML=`
 <div class="abs mono" style="left:50px;top:40px;font-size:22px;color:#8E9890">WHO GOOGLE SHOWS YOUR AD TO · EXAMPLE</div>
 <div class="abs" style="left:50px;right:50px;top:96px;display:grid;grid-template-columns:repeat(5,1fr);gap:18px">
  ${PEOPLE.map(k=>`<div class="g-p" data-k="${k}" style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0;border-radius:22px;border:3px solid transparent"><svg width="70" height="80" viewBox="0 0 70 80"><circle cx="35" cy="22" r="17" fill="#C8D0CA"/><path d="M6 78c0-18 13-30 29-30s29 12 29 30z" fill="#C8D0CA"/></svg><span class="mono g-l" style="font-size:18px;color:#8E9890">?</span></div>`).join('')}</div>
 <div class="abs" style="left:50px;right:50px;bottom:40px;display:flex;justify-content:space-between;align-items:baseline"><span class="mono" style="font-size:24px;color:#8E9890">SPENT ON BROWSERS</span><span class="g-sp" style="font:900 70px Mont;font-variant-numeric:tabular-nums">$0</span></div>`;

// 2) Step 1: install the app
const S1=itemScene('s1','STEP 01 · IN SHOPIFY',LOGO_SHOP,'Install the app','FREE','GOOGLE & YOUTUBE APP','Search <b>Google</b> in Shopify.');
$('.s-ui',S1).innerHTML=`
 <div class="abs" style="left:50px;right:50px;top:50px;height:84px;border-radius:42px;background:#F5F8F6;color:#0B1A10;display:flex;align-items:center;gap:18px;padding:0 30px;font:600 36px Inter"><svg width="34" height="34" viewBox="0 0 40 40"><circle cx="17" cy="17" r="12" stroke="#0B1A10" stroke-width="5" fill="none"/><path d="M26 26l10 10" stroke="#0B1A10" stroke-width="5" stroke-linecap="round"/></svg><span class="i-q"></span></div>
 <div class="abs i-res" style="left:50px;right:50px;top:170px;padding:26px 30px;border-radius:26px;background:rgba(34,224,111,.12);border:3px solid #22E06F;display:flex;align-items:center;gap:24px">
  <span class="tile" style="width:96px;height:96px;border-radius:26px;font-size:48px">G</span>
  <div style="flex:1"><div style="font:900 44px Mont">Google &amp; YouTube</div><div class="mono" style="margin-top:6px;font-size:22px;color:#A9B2AB">SALES CHANNEL APP · FREE · EXAMPLE CARD</div></div></div>
 <div class="abs i-btn pill" style="right:50px;top:360px;background:var(--lime);color:#030403;font-size:34px;font-weight:900;padding:18px 40px">Install</div>
 <div class="abs i-ok" style="left:50px;top:470px;display:flex;align-items:center;gap:14px;font:800 32px Inter">${CHECK} Installed</div>`;

// 3) Step 2: connect accounts
const S2=itemScene('s2','STEP 02 · IN THE APP',LOGO_SHOP,'Connect','3 ACCOUNTS','ONE SCREEN','Link Google, Ads and <b>Merchant Center</b>.');
$('.s-ui',S2).innerHTML=`<div class="abs" style="left:50px;right:50px;top:50px;display:flex;flex-direction:column;gap:18px">
 ${['Google account','Google Ads account','Google Merchant Center'].map(x=>ROW(`<span class="c-ic" style="flex:none;width:52px;height:52px;border-radius:50%;border:4px solid #8A938C;display:flex;align-items:center;justify-content:center"></span><span style="flex:1;font:800 36px Inter">${x}</span><span class="c-st mono" style="font-size:24px;color:#8E9890">NOT CONNECTED</span>`,'c-r')).join('')}
 ${ROW(`<span style="flex:1;font:800 32px Inter;color:#C8D0CA">Conversion tracking</span><span class="c-tr pill" style="font-size:24px;padding:8px 20px;background:rgba(255,255,255,.12);color:#fff">Off</span>`,'c-t')}</div>`;

// 4) Step 3: Data manager → Shopify → Direct connection
const PATH=['Tools','Data manager','Shopify','Direct connection'];
const S3=itemScene('s3','STEP 03 · IN GOOGLE ADS',LOGO_GADS,'Data manager','DIRECT CONNECTION','THEN AUTHORIZE','Connect the <b>store itself</b>.');
$('.s-ui',S3).innerHTML=`
 <div class="abs" style="left:50px;right:50px;top:44px;display:grid;grid-template-columns:1fr 1fr;gap:16px">
  ${PATH.map((x,i)=>`<div class="d-s" style="display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:22px;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)"><span class="tile" style="width:52px;height:52px;border-radius:14px;font:700 22px Mono">${String(i+1).padStart(2,'0')}</span><span style="font:800 32px Inter">${x}</span></div>`).join('')}</div>
 <div class="abs d-url" style="left:50px;right:50px;top:270px;height:84px;border-radius:24px;background:rgba(0,0,0,.35);border:1.5px solid rgba(34,224,111,.5);display:flex;align-items:center;padding:0 28px;font:600 34px Inter"><span style="color:#8E9890">https://</span><span class="d-q"></span><span style="color:#8E9890">.myshopify.com</span></div>
 <div class="abs d-auth pill" style="right:50px;top:390px;background:var(--lime);color:#030403;font-size:32px;font-weight:900;padding:16px 36px">Authorize</div>
 <div class="abs d-ok" style="left:50px;top:400px;display:flex;align-items:center;gap:14px;font:800 32px Inter">${CHECK} Store connected</div>`;

// 5) Step 4: customer match
const S4=itemScene('s4','STEP 04 · IN GOOGLE ADS',LOGO_GADS,'Customer match','TURN ON','AUDIENCES FROM BUYERS','Show ads to people <b>like your buyers</b>.');
$('.s-ui',S4).innerHTML=`
 <div class="abs" style="left:50px;right:50px;top:50px">${ROW(`<span style="flex:1;font:800 38px Inter">Customer match</span><span class="m-tg" style="flex:none;width:120px;height:64px;border-radius:32px;background:rgba(255,255,255,.18);position:relative"><i class="m-k" style="position:absolute;top:7px;left:7px;width:50px;height:50px;border-radius:50%;background:#fff"></i></span>`)}</div>
 <div class="abs" style="left:50px;right:50px;top:200px;padding:28px 30px;border-radius:24px;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.16)">
  <div class="mono" style="font-size:22px;color:#8E9890">AUDIENCE LIST · EXAMPLE</div>
  <div style="display:flex;align-items:baseline;gap:16px;margin-top:8px"><span class="m-n" style="font:900 100px Mont;font-variant-numeric:tabular-nums">0</span><span style="font:700 34px Inter;color:#C8D0CA">customers</span></div></div>
 <div class="abs m-note" style="left:50px;right:50px;bottom:40px;font:600 28px/1.35 Inter;color:#A9B2AB">Only upload customers who agreed to it. Shopify asks you to confirm.</div>`;

// 6) Result: purchases come back as conversions
const E1=itemScene('e1','THE RESULT · IN GOOGLE ADS',LOGO_GADS,'Every sale counts','NEW CONVERSION','ADDED FOR YOU','Google finally <b>sees the sale</b>.');
$('.s-ui',E1).innerHTML=`
 <div class="abs" style="left:50px;right:50px;top:44px"><div class="mono" style="font-size:22px;color:#8E9890">GOOGLE ADS · CONVERSIONS · EXAMPLE</div>
  <div class="r-row" style="margin-top:14px;display:flex;align-items:center;gap:18px;padding:24px 26px;border-radius:24px;border:3px solid #22E06F;background:rgba(34,224,111,.12)"><span style="flex:1;font:800 34px Inter">Google Shopping App Purchase</span><span class="pill" style="font-size:22px;padding:8px 18px;background:var(--lime);color:#030403">Primary</span></div></div>
 <div class="abs" style="left:50px;right:50px;top:260px;display:flex;gap:20px">
  <div style="flex:1;padding:26px;border-radius:24px;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.16)"><div class="mono" style="font-size:22px;color:#8E9890">CONVERSIONS</div><div class="r-n" style="font:900 110px Mont;line-height:1;color:var(--lime)">0</div></div>
  <div style="flex:1;padding:26px;border-radius:24px;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.16)"><div class="mono" style="font-size:22px;color:#8E9890">SALES SEEN</div><div class="r-v" style="font:900 80px Mont;line-height:1.3">$0</div></div></div>`;
const ANGLES=['Google & YouTube app','Connect accounts','Data manager','Direct connection','Customer match','Purchase tracking'];
const ANGLE_LOGO=[LOGO_SHOP,LOGO_SHOP,LOGO_GADS,LOGO_GADS,LOGO_GADS,LOGO_GADS];

/* ---------- CTA ---------- */
const cta=mk(`<div class="scene" id="s-cta">
  <div class="abs mono" style="top:250px;left:0;right:0;text-align:center;font-size:34px;color:var(--lime)" id="c-tag">SHOPIFY + GOOGLE ADS · 4 STEPS</div>
  <div class="abs" id="c-grid" style="top:330px;left:90px;right:90px;display:grid;grid-template-columns:1fr 1fr;gap:20px">
   ${ANGLES.map((a,i)=>`<div class="c-g ghost" style="border-radius:28px;padding:18px 26px;display:flex;align-items:center;gap:20px">${LT(ANGLE_LOGO[i],64,18)}<span style="font:800 34px Inter">${a}</span></div>`).join('')}</div>
  <div class="abs title" id="c-t" style="top:1010px;left:0;right:0;text-align:center;font-size:110px">Follow for more</div>

</div>`);

function renderThesis(t,el){const w=segBy.hook.words; const a1=w[10].s-HOOK_HOLD-.05;

  // Google Ads stays at 0 and shakes a little with every order
  const gz=$('.t-gz',el); const k=orders(T)>0?LAND*Math.pow((orders(T)-.5)/ORD,1/1.15):-9; const sh=Math.sin(P(T,k,.25)*Math.PI*4)*(1-P(T,k,.25))*10;

  pop($('#t-fix',el),T,LAND+.05,.4,.5);

/* ---------- timeline (voice-driven) ---------- */
const S=D.segs, segBy=Object.fromEntries(S.map(s=>[s.key,s]));
const LEAD=0.18;
const order=['hook','thesis','how','s1','s2','s3','s4','e1','cta'];
const els={hook,thesis,how:SH,s1:S1,s2:S2,s3:S3,s4:S4,e1:E1,cta};
const starts=order.map((k,i)=>i===0?0:k==='thesis'?HOOK_HOLD:segBy[k].start-LEAD);
const END=D.end;
const TR=0.42;
const TRTYPE=['zoom','whip','zoom','whip','wipe','whip','zoom','wipe'];
const NSEG=order.length-3;
for(let i=0;i<NSEG;i++) $('#prog').appendChild(mk('<div class="seg"><i></i></div>'));

const capWords=[];
S.forEach(s=>s.words.forEach((w,k)=>{const nx=s.words[k+1];capWords.push({w:w.w.replace(/[.,]$/,''),s:w.s,e:nx?nx.s:s.start+s.dur,seg:s.key,brk:/[.,!?]$/.test(w.w)});}));
const chunks=[];let cur=[];
capWords.forEach((w,i)=>{cur.push(w);const nx=capWords[i+1];if(cur.length>=3||w.brk||!nx||nx.seg!==w.seg){chunks.push(cur);cur=[];}});

function renderBg(t){
  st($('#b1'),{left:`${300+Math.sin(t*.35)*180}px`,top:`${200+Math.cos(t*.28)*160}px`});
  st($('#b2'),{left:`${500+Math.cos(t*.3)*200}px`,top:`${1300+Math.sin(t*.4)*180}px`});
  st($('#b3'),{left:`${100+Math.sin(t*.5+1)*120}px`,top:`${900+Math.cos(t*.45)*200}px`});
  st($('#grid'),{transform:`translateY(${(t*30)%90}px)`});
}
function sceneTransform(idx,t){
  const a=starts[idx], b=idx+1<order.length?starts[idx+1]:END+5;
  if(t<a-TR*0.5||t>b+TR*0.5) return null;
  let tr='',f='',o=1;
  if(idx>0&&t<a+TR*0.5){const p=eio((t-(a-TR*0.5))/TR);const ty=TRTYPE[idx-1];
    if(ty==='whip'){tr=`translateX(${(1-p)*1100}px)`;f=`blur(${(1-p)*(1-p)*40}px)`;}
    if(ty==='zoom'){tr=`scale(${lerp(.55,1,p)})`;f=`blur(${(1-p)*30}px)`;o=clamp(p*2);}
    if(ty==='wipe'){tr=`translateY(${(1-p)*400}px) scale(${lerp(1.1,1,p)})`;o=p>0.5?1:0;}
  }
  if(idx+1<order.length&&t>b-TR*0.5){const p=eio((t-(b-TR*0.5))/TR);const ty=TRTYPE[idx];
    if(ty==='whip'){tr=`translateX(${-p*1100}px)`;f=`blur(${p*p*40}px)`;}
    if(ty==='zoom'){tr=`scale(${lerp(1,2.2,p)})`;f=`blur(${p*30}px)`;o=1-clamp(p*1.6);}
    if(ty==='wipe'){tr=`translateY(${-p*400}px)`;o=p<0.5?1:0;}
  }
  const life=t-a; tr+=` scale(${1+clamp(life/6)*0.03})`;
  return {tr,f,o};
}
function renderHook(t,el){
  const p7=eo5(P(t,0,.5));

  {const q=eo(P(t,0,.4));st($('#h-t2',el),{opacity:clamp(.5+q),transform:`translateY(${(1-q)*20}px)`});}
  [...$('#h-list',el).children].forEach((c,i)=>pop(c,t,.05+i*.07,.35,.5));
  pop($('#h-save',el),t,1.0,.45,.4);

  const sv=$('#h-save',el); const pulse=1+Math.max(0,Math.sin((t-1.5)*6))*0.04*(t>1.5?1:0); sv.style.transform+=` scale(${pulse})`;
}

function renderHow(t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.5;
  const ps=$$('.g-p',U); ps.forEach((p,i)=>{pop(p,u,.1+i*.08,.35,.5);});

  const order=[0,3,6,2,8,4,9,7,1,5];
  order.forEach((idx,j)=>{const a=1.6+j*.42;const p=ps[idx];const on=u>=a;
    p.style.borderColor=on?(p.dataset.k==='buy'?'#22E06F':'rgba(255,255,255,.35)'):'transparent';

    p.querySelector('.g-l').style.color=on&&p.dataset.k==='buy'?'#22E06F':'#8E9890';
    p.querySelectorAll('circle,path').forEach(x=>x.setAttribute('fill',on?(p.dataset.k==='buy'?'#22E06F':'#5A625C'):'#C8D0CA'));});
  let n=0; order.forEach((idx,j)=>{if(u>=1.6+j*.42&&ps[idx].dataset.k!=='buy')n++;}); $('.g-sp',U).textContent='$'+(n*4.10).toFixed(2);
}
function renderS1(t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.45;
  typed($('.i-q',U),'google',u,.6,10);
  rise($('.i-res',U),u,1.6,.4,30);

  const at=[1.4,2.2,3.0];
  $$('.c-r',U).forEach((r,k)=>{rise(r,u,k*.15,.35,30);const on=u>=at[k];const ic=$('.c-ic',r);
    ic.style.borderColor=on?'#22E06F':'#8A938C'; ic.style.background=on?'#22E06F':'transparent'; ic.innerHTML=on?'<svg width="28" height="28" viewBox="0 0 26 26"><path d="M4 14l6 6L22 6" stroke="#030403" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'';
    const stt=$('.c-st',r); stt.textContent=on?'CONNECTED':'NOT CONNECTED'; stt.style.color=on?'#22E06F':'#8E9890';
    r.style.borderColor=on?'rgba(34,224,111,.6)':'rgba(255,255,255,.14)';});
  const tr=$('.c-t',U); rise(tr,u,.45,.35,30); const on=u>=3.8; const p=$('.c-tr',U); p.textContent=on?'On ✓':'Off'; st(p,{background:on?'#22E06F':'rgba(255,255,255,.12)',color:on?'#030403':'#fff'});

  rise($('.d-url',U),u,5.6,.35,30); typed($('.d-q',U),'yourstore',u,5.8,14);
  pop($('.d-auth',U),u,6.4,.35,.5); $('.d-auth',U).style.transform+=` scale(${1-Math.sin(P(u,6.9,.2)*Math.PI)*.12})`;

function renderS4(t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.45;
  const on=eo(P(u,1.5,.3)); $('.m-k',U).style.left=(7+56*on)+'px'; $('.m-tg',U).style.background=on>.5?'#22E06F':'rgba(255,255,255,.18)';
  $('.m-n',U).textContent=Math.round(1240*eo(P(u,1.9,2.4))).toLocaleString('en-US');

function renderEx(i,t,el){renderItemShell(t,el);const U=$('.s-ui',el);const u=t-.45;

function renderCta(t,el){

  [...$('#c-grid',el).children].forEach((c,i)=>pop(c,t,.05+i*.06,.4,.6));
  const pt=eo5(P(t,.3,.45)); st($('#c-t',el),{opacity:pt,transform:`scale(${lerp(1.2,1,pt)})`});
  rise($('#c-s',el),t,.5,.4,30);

  st(b,{background:followed?'rgba(255,255,255,.12)':'#22E06F',color:followed?'#fff':'#030403',border:followed?'2px solid rgba(255,255,255,.4)':'none'}); b.innerHTML=followed?'Following <svg width="34" height="34" viewBox="0 0 34 34" style="margin-left:10px"><path d="M6 18l7 7L28 9" stroke="#22E06F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'Follow';

window.seek=function(t){
  renderBg(t);
  order.forEach((k,idx)=>{const el=els[k];const tf=sceneTransform(idx,t);
    if(!tf){el.style.display='none';return;} el.style.display='block';
    st(el,{transform:tf.tr,filter:tf.f||'none',opacity:tf.o});
    const lt=t-starts[idx];
    if(k==='hook')renderHook(lt,el); else if(k==='thesis')renderThesis(lt,el); else if(k==='cta')renderCta(lt,el);
    else if(k==='how')renderHow(lt,el); else if(k==='s1')renderS1(lt,el); else if(k==='s2')renderS2(lt,el);
    else if(k==='s3')renderS3(lt,el); else if(k==='s4')renderS4(lt,el); else renderEx(0,lt,el);
  });
  [...$('#prog').children].forEach((s,i)=>{const a=starts[i+2],b=starts[i+3];s.firstChild.style.width=`${clamp((t-a)/(b-a))*100}%`;});
  const pv=t<starts[2]-.2?0:t<starts[2]+.2?eo(P(t,starts[2]-.2,.4)):(t>starts[order.length-1]?1-eo(P(t,starts[order.length-1],.3)):1); st($('#prog'),{opacity:pv});
  const cap=$('#cap'); const ch=chunks.find(c=>t>=c[0].s-.05&&t<c[c.length-1].e+.08);
  if(!ch){cap.innerHTML='';} else {
    const pin=eo5(P(t,ch[0].s-.05,.18));
    cap.innerHTML=ch.map(w=>{const on=t>=w.s&&t<w.e+.05; return `<span style="color:${on?'#22E06F':'#fff'};transform:scale(${on?1.08:1})">${w.w}</span>`}).join(' ');
    st(cap,{transform:`translateY(${(1-pin)*30}px) scale(${lerp(.9,1,pin)})`,opacity:pin});
    if(ch[0].seg==='hook'||ch[0].seg==='cta') cap.style.opacity=0;
  }
  let fl=0, wy=-2400;
  for(let i=1;i<order.length;i++){const b=starts[i];const d=t-b;
    if(Math.abs(d)<.12) fl=Math.max(fl,(1-Math.abs(d)/.12)*(TRTYPE[i-1]==='zoom'?.55:.3));
    if(TRTYPE[i-1]==='wipe'&&Math.abs(d)<TR*0.5){const p=eio((d+TR*.5)/TR); wy=lerp(1920,-2400,p);}
  }
  $('#flash').style.opacity=fl; $('#wipe').style.top=`${wy}px`;
  return true;
};
